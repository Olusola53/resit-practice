<script>
// O&G · Flashcards · Hypertension in pregnancy.
// The supplied slide deck has NO lecture on pre-eclampsia/eclampsia; standard teaching shaped by past papers.
// src names a slide page only where the deck mentions the point.
window.QUESTION_BANKS = (window.QUESTION_BANKS || []).concat([{
  id: "og-cards-htn",
  subject: "O&G",
  group: "Hypertension in pregnancy",
  type: "cards",
  title: "O&G Flashcards · Hypertension in pregnancy",
  cards: [
    { topic: "Definitions", src: "p.154, 171",
      q: "Classify the hypertensive disorders of pregnancy.",
      a: "1 Chronic hypertension (present before 20 weeks or before pregnancy). 2 Gestational hypertension (new hypertension after 20 weeks, no proteinuria, settles by 12 weeks postpartum). 3 Pre-eclampsia (hypertension after 20 weeks plus proteinuria or organ dysfunction). 4 Pre-eclampsia superimposed on chronic hypertension. 5 Eclampsia (fits).",
      connect: "Your ANC slide lists pregnancy-induced hypertension, pre-eclampsia and eclampsia as maternal complications (p.154). 'Pregnancy-induced hypertension' is the older umbrella term." },
    { topic: "Definitions", src: "p.171",
      q: "How is hypertension defined in pregnancy, and how should BP be measured?",
      a: "Systolic 140 or more, or diastolic 90 or more, on two readings at least 4 hours apart. Severe: 160/110 or more. Measure sitting, arm at heart level, correct cuff size, diastolic at Korotkoff phase V (disappearance).",
      connect: "Your labour slide gives the same alarm numbers: diastolic above 90, especially above 110, with proteinuria and convulsion (p.171). Measuring BP is also an essential early-detection step at ANC (p.139)." },
    { topic: "Definitions", src: "Standard teaching",
      q: "Define pre-eclampsia, and what is NOT required for the diagnosis?",
      a: "New hypertension after 20 weeks plus proteinuria (300 mg/24 h, protein:creatinine ratio 30 mg/mmol, or dipstick 1+) or other maternal organ dysfunction. Oedema is not required (and is common in normal pregnancy).",
      connect: "Past T/F: 'has pre-eclampsia if associated with oedema' is false. Another: 'pre-eclampsia usually manifests after 20 weeks'.", extra: true },
    { topic: "Definitions", src: "Standard teaching",
      q: "Define eclampsia and name its warning signs.",
      a: "Generalised tonic-clonic (grand mal) convulsions in a woman with pre-eclampsia, not attributable to another cause. Warning signs of impending eclampsia: severe headache, visual disturbance (blurring, scotomata, flashing lights), epigastric pain, vomiting, hyperreflexia with clonus, rapid rise in BP.",
      connect: "A past short question asks for 'acute attack fits are ___ with ___ in eclampsia' (tonic-clonic fits, with loss of consciousness and cyanosis). Pre-eclampsia can also present with a first fit up to several weeks after delivery.", extra: true },
    { topic: "Pathophysiology", src: "Standard teaching",
      q: "Outline the pathogenesis of pre-eclampsia.",
      a: "Abnormal placentation in the first trimester: trophoblast fails to invade and convert the spiral arteries into low-resistance vessels, leaving them narrow and muscular. The ischaemic placenta releases anti-angiogenic factors (sFlt-1) causing maternal endothelial dysfunction, vasospasm, raised BP, capillary leak (proteinuria, oedema) and organ hypoperfusion.",
      connect: "Past short question: 'Events that lead to pre-eclampsia occur in the first trimester and manifest in the second half of pregnancy (after 20 weeks)'. The disease is cured by delivery of the placenta.", extra: true },
    { topic: "Risk factors", src: "p.300, 306, 1063, 1164, 1232, 1524, 1537",
      q: "List the risk factors for pre-eclampsia (past paper: 'Risk factors for developing pre-eclampsia').",
      a: "Primigravida or new partner; previous pre-eclampsia; family history; chronic hypertension; renal disease; diabetes; obesity; multiple pregnancy; extremes of age (under 18, over 35); molar pregnancy; haemoglobinopathies (sickle cell); anaemia; antiphospholipid syndrome, SLE, thrombophilia; assisted reproduction; long interval since last pregnancy.",
      connect: "Your slides name teenage pregnancy (p.300), obesity (p.306), haemoglobinopathies (p.1063), diabetes (p.1164), chronic hypertension (p.1232) and hydatidiform mole, with pre-eclampsia in 27% of complete moles (p.1524) and over 50% with a coexisting viable fetus (p.1537)." },
    { topic: "Presentation", src: "Standard teaching",
      q: "Give the symptoms and signs of pre-eclampsia (past paper: 'List 3 clinical features').",
      a: "Usually asymptomatic early (found at ANC by raised BP and proteinuria). Later: headache, visual disturbance, epigastric or right upper quadrant pain, nausea and vomiting, sudden facial or hand oedema, reduced fetal movements. Signs: hypertension, proteinuria, brisk reflexes with clonus, hepatic tenderness, papilloedema, small-for-dates fetus.",
      connect: "Screening is the key: BP and urine dipstick at every ANC visit." },
    { topic: "Severity", src: "Standard teaching",
      q: "List the criteria for severe pre-eclampsia (past paper: 'Criteria of severity of pre-eclampsia').",
      a: "BP 160/110 or more; heavy proteinuria (2+ or more, over 3–5 g/24 h); severe headache or visual disturbance; epigastric or RUQ pain; oliguria (below 400–500 ml/24 h); pulmonary oedema or cyanosis; platelets below 100,000; raised ALT/AST; raised creatinine; HELLP syndrome; fetal growth restriction or abnormal Doppler; eclampsia.",
      connect: "Past stem: 'in severe pre-eclampsia the following are significantly elevated: ALT, PTT'; platelets and bicarbonate fall, Hb is raised by haemoconcentration." },
    { topic: "Investigations", src: "Standard teaching",
      q: "What investigations are done in pre-eclampsia?",
      a: "Urine: dipstick, 24-hour protein or protein:creatinine ratio. Blood: FBC with platelets, liver enzymes (AST/ALT), urea, creatinine, urate, LDH, clotting profile, blood film for haemolysis, group and crossmatch. Fetus: ultrasound for growth, liquor volume and umbilical artery Doppler; CTG.",
      connect: "Platelets and liver enzymes are what diagnose HELLP; clotting is checked before regional anaesthesia.", extra: true },
    { topic: "Complications", src: "Standard teaching",
      q: "List the maternal complications of pre-eclampsia (past paper: 'Give 2 maternal complications').",
      a: "Eclampsia; HELLP syndrome; abruptio placentae; DIC; acute renal failure; pulmonary oedema; cerebral haemorrhage or stroke; liver haematoma or rupture; retinal detachment or cortical blindness; PPH; maternal death.",
      connect: "Abruption links this topic to APH. DIC is covered on p.1432, where pre-eclampsia/eclampsia and abruption are both listed as causes." },
    { topic: "Complications", src: "p.1232, 1212",
      q: "List the fetal complications (past paper: '2 fetal complications of pre-eclampsia').",
      a: "Intrauterine growth restriction, oligohydramnios, prematurity (spontaneous or iatrogenic), abruptio placentae, intrauterine death, fetal distress, low birth weight and neonatal death.",
      connect: "Your slides list pre-eclampsia/eclampsia and chronic hypertension among the maternal causes of IUGR through reduced uteroplacental blood flow (p.1232)." },
    { topic: "Differential diagnosis", src: "Standard teaching",
      q: "What is the differential diagnosis of hypertension with proteinuria in pregnancy?",
      a: "Chronic hypertension (with or without renal disease), glomerulonephritis and other renal disease, lupus nephritis, UTI (proteinuria), acute fatty liver of pregnancy, TTP or haemolytic uraemic syndrome, cholestasis, and for fits: epilepsy, cerebral malaria, meningitis, tetanus, intracranial haemorrhage, hypoglycaemia.",
      connect: "Past question: 'Differential diagnosis and management of pre-eclampsia'. Hypertension before 20 weeks points to chronic hypertension.", extra: true },
    { topic: "Prevention", src: "p.1307",
      q: "How can pre-eclampsia be prevented?",
      a: "Low-dose aspirin (75–150 mg nightly from 12 weeks to delivery) in women at high risk (previous pre-eclampsia, chronic hypertension, renal disease, diabetes, autoimmune disease, multiple pregnancy). Calcium supplementation in women with low dietary intake. Early booking, control of chronic hypertension, weight control.",
      connect: "Your nutrition slide recommends calcium for high-risk women with low intake where pre-eclampsia is important in the population (p.1307). Past question: the drug used to prevent or delay pre-eclampsia in chronic kidney disease is aspirin." },
    { topic: "Management", src: "Standard teaching",
      q: "Outline the management of mild pre-eclampsia (past paper: 'Management of pre-eclampsia').",
      a: "Before 37 weeks and BP below 150/100: close surveillance (outpatient or day care): BP and urine twice weekly, bloods weekly, fetal growth scan and Doppler, kick count, education on danger signs. Antihypertensive if BP is 150/100 or more. Deliver at 37 weeks. At 37 weeks or more: induce labour.",
      connect: "Admit at once if BP reaches 160/110, symptoms develop or tests worsen.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "Outline the management of severe pre-eclampsia.",
      a: "Admit to a high-dependency area. Control BP (target below 150/100): IV labetalol, IV hydralazine or oral nifedipine. Prevent fits with magnesium sulphate. Steroids if below 34 weeks. Strict fluid balance with a urinary catheter and fluid restriction (about 80 ml/h) to avoid pulmonary oedema. Monitor bloods, fetus. Deliver after stabilisation: induction if favourable, otherwise caesarean section.",
      connect: "Delivery is the only cure. Stabilise first (BP, magnesium) and then deliver; delaying for steroids is only reasonable if mother and fetus are stable.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "Which antihypertensive drugs are used in pregnancy, and which are contraindicated?",
      a: "Acute severe hypertension: IV labetalol, IV hydralazine, oral nifedipine. Long-term: methyldopa, labetalol, nifedipine. Contraindicated: ACE inhibitors and ARBs (fetal renal failure); avoid atenolol (growth restriction) and diuretics (reduce plasma volume). Methyldopa is not used postnatally (depression).",
      connect: "Hydralazine can cause maternal hypotension and fetal distress, so give small boluses with monitoring.", extra: true },
    { topic: "Magnesium sulphate", src: "Standard teaching",
      q: "What are the indications and mechanism of magnesium sulphate? (past paper: 'The use of magnesium sulphate in pre-eclampsia' and 'Two mechanisms of action')",
      a: "Indications: prophylaxis of fits in severe pre-eclampsia and treatment of eclampsia (the anticonvulsant of choice; halves the risk of eclampsia and is better than diazepam and phenytoin). Mechanism: NMDA-receptor antagonism, calcium channel antagonism, cerebral vasodilatation and relief of vasospasm, reduced acetylcholine release.",
      connect: "Asked in at least eight sittings, so write it as a full short note: indications, regimen, monitoring, toxicity, antidote, contraindications.", extra: true },
    { topic: "Magnesium sulphate", src: "Standard teaching",
      q: "Give the regimens of magnesium sulphate.",
      a: "Pritchard: 4 g of 20% IV over 5–10 min, plus 10 g of 50% IM (5 g in each buttock), then 5 g IM every 4 hours into alternate buttocks. Zuspan: 4 g IV loading then 1 g/hour IV infusion. Sibai: 4–6 g IV load then 2 g/hour infusion. Continue 24 hours after delivery or the last fit. For a recurrent fit give a further 2 g IV.",
      connect: "In busy units the IM regimen is often used because it needs no infusion pump.", extra: true },
    { topic: "Magnesium sulphate", src: "Standard teaching",
      q: "How do you monitor a patient on magnesium sulphate, and what are the signs of toxicity?",
      a: "Before each maintenance dose check: patellar reflexes present, respiratory rate at least 16/min, urine output above 30 ml/hour (or 100 ml in 4 hours). Toxicity: loss of patellar reflexes (first), respiratory depression, then cardiac arrest. Therapeutic level 4–7 mEq/L. Antidote: 10 ml of 10% calcium gluconate IV slowly.",
      connect: "Magnesium is excreted by the kidneys, so oliguria is the reason to reduce or stop the dose. Contraindicated in myasthenia gravis.", extra: true },
    { topic: "Eclampsia", src: "Standard teaching",
      q: "Outline the management of eclampsia (past paper: 'Management of eclampsia').",
      a: "Call for help. Airway, left lateral position, oxygen, IV access, protect from injury. Magnesium sulphate loading dose then maintenance. Control severe hypertension. Catheterise with strict fluid balance. Investigate (bloods, platelets, LFT, renal). Monitor the fetus. Deliver once stable, within about 12 hours of the first fit, by induction or caesarean section. HDU or ICU care, then postnatal monitoring.",
      connect: "Never leave her alone and never put anything in her mouth. Exclude other causes if fits occur after 48 hours postpartum or if there is no hypertension.", extra: true },
    { topic: "Eclampsia", src: "Standard teaching",
      q: "What is the domestic (home) management of a woman with eclampsia? (past paper: 'Domestic management of a case of eclampsia')",
      a: "Lay her on her side, clear the airway and mouth, loosen tight clothing, keep her safe from injury and fire and don't put anything into the mouth or force fluids; stay with her and take her urgently to hospital, ideally with a health worker and a magnesium sulphate first dose if available.",
      connect: "A community question about first aid and referral: the same message goes in health education during ANC (danger signs, p.143).", extra: true },
    { topic: "Eclampsia", src: "Standard teaching",
      q: "Name the bad prognostic signs in eclampsia (past paper: 'Bad prognostic signs of eclampsia').",
      a: "More than 10 fits, coma lasting over 6 hours, pulse over 120, temperature over 39.4°C, systolic BP over 200, oliguria or anuria with heavy proteinuria, jaundice, pulmonary oedema or cyanosis, antepartum onset with a long interval to delivery, and evidence of HELLP or DIC.",
      connect: "These are the Eden criteria. Remember it as 'fits, coma, pulse, temperature, BP, urine, jaundice'.", extra: true },
    { topic: "HELLP", src: "Standard teaching",
      q: "What is HELLP syndrome and how is it managed?",
      a: "Haemolysis, Elevated Liver enzymes, Low Platelets (below 100,000): a severe form of pre-eclampsia, often with epigastric pain and sometimes without marked hypertension. Manage as severe pre-eclampsia: magnesium sulphate, BP control, dexamethasone, platelet transfusion if below 50,000 before caesarean section, and delivery after stabilisation.",
      connect: "Complications: DIC, liver haematoma and rupture, renal failure, abruptio placentae. Past short question: 'Components of HELLP syndrome are ___'.", extra: true },
    { topic: "Delivery", src: "Standard teaching",
      q: "What are the indications for termination of pregnancy in pregnancy-induced hypertension? (past paper)",
      a: "Severe pre-eclampsia at 34 weeks or more (or earlier when uncontrolled), eclampsia, HELLP, failure to control BP, worsening organ function (rising creatinine, falling platelets), fetal distress, severe growth restriction with abnormal Doppler, abruptio placentae, any pre-eclampsia at 37 weeks or more.",
      connect: "Mode: induction (prostaglandin, oxytocin) if the cervix is favourable and there is no obstetric contraindication; caesarean section if induction is unlikely to succeed quickly or fetal compromise is present.", extra: true },
    { topic: "Delivery", src: "p.177, 178",
      q: "How should labour and the third stage be managed in pre-eclampsia?",
      a: "Continue magnesium sulphate and antihypertensives, strict fluid balance, continuous fetal monitoring, regional anaesthesia if platelets and clotting allow. Third stage: oxytocin (not ergometrine or syntometrine) to prevent PPH. Continue magnesium for 24 hours after delivery.",
      connect: "Ergometrine is contraindicated in hypertension (p.177) and syntometrine raises the risk of hypertension (p.178)." },
    { topic: "Postnatal", src: "Standard teaching",
      q: "What care is needed after delivery in a woman with pre-eclampsia?",
      a: "BP often peaks on days 3–6, so monitor BP for at least a week and treat to below 150/100 (enalapril, nifedipine or labetalol; avoid methyldopa postnatally). Watch for postpartum eclampsia (up to 4 weeks), pulmonary oedema, and bleeding. Counsel about recurrence (about 15–25%) and long-term risk of hypertension, stroke and heart disease. Contraception (avoid oestrogen-containing methods until BP is normal) and aspirin in the next pregnancy.",
      connect: "Breastfeeding is compatible with these antihypertensives.", extra: true },
    { topic: "Chronic hypertension", src: "p.306, 1232",
      q: "How is chronic hypertension managed in pregnancy?",
      a: "Pre-pregnancy counselling and stopping ACE inhibitors, ARBs and diuretics. In pregnancy: methyldopa, labetalol or nifedipine to keep BP below 150/100; baseline renal function and urate; aspirin from 12 weeks; serial growth scans; watch for superimposed pre-eclampsia; deliver by 38–40 weeks unless complications.",
      connect: "Your slides list chronic hypertension with obesity (p.306) and as a cause of IUGR (p.1232).", extra: true },
    { topic: "Cases", src: "Standard teaching",
      q: "A 19-year-old primigravida at 35 weeks has headache and blurred vision. BP 170/115, urine 3+ protein. What do you do?",

      connect: "Blood pressure above 160 is a medical emergency in its own right (stroke risk), not just a fetal indication for delivery.", extra: true },
    { topic: "Cases", src: "Standard teaching",

      a: "Gestational hypertension (new hypertension after 20 weeks without proteinuria). Review twice weekly (BP, urine), weekly bloods, growth scan; antihypertensive if 150/100 or more; admit if BP reaches 160/110 or pre-eclampsia develops (proteinuria, symptoms, abnormal bloods); deliver at 37 weeks. Advise to report headaches, visual symptoms, epigastric pain and reduced fetal movements.",

  id: "og-cards-infertility",
  subject: "O&G",
  group: "Infertility",
  type: "cards",
  title: "O&G Flashcards · Infertility",
  cards: [
    { topic: "Basics", src: "p.611",
      q: "Define infertility, primary infertility, secondary infertility and unexplained infertility.",
      a: "Infertility: failure to conceive after 1 year of regular unprotected intercourse. Primary: never conceived. Secondary: has conceived before. Unexplained: all standard investigations are normal.",
      connect: "Secondary infertility in Nigeria is usually tubal damage from a previous pregnancy event (abortion, puerperal sepsis) or an STI. Unexplained is a diagnosis of exclusion." },
    { topic: "Basics", src: "p.612",
      q: "Distinguish sterility, infertility, subfertility, fecundity and fecundability.",
      a: "Sterility: absolute incapacity to reproduce. Infertility: 1 year without conception, whatever the cause. Subfertility: relative reduction in fertility of a group or community. Fecundity: ability to achieve a live birth within one cycle. Fecundability: the probability of pregnancy each month (20–25%, about 0.22).",
      connect: "Fecundity of 0.15–0.18 per month adds up to roughly 90% cumulative pregnancy in a year, which is why 12 months is the cut-off." },
    { topic: "Basics", src: "p.611, 614",
      q: "How common is infertility worldwide and in sub-Saharan Africa, and which type predominates?",
      a: "10–15% of couples worldwide; 11–20% in sub-Saharan Africa. Primary is commoner worldwide, but SSA is the exception: about 52% of infertile couples there have secondary infertility.",
      connect: "Secondary-predominant infertility points to infection after pregnancy or an STI as the main driver. This is the epidemiology answer for essays." },
    { topic: "Basics", src: "p.611, 616",
      q: "What is the single most important prognostic factor, and what happens to fertility with age?",
      a: "Age of the female partner. Fertility is halved at 35 and falls sharply after 37. Investigate women over 35 after 6 months, not 12.",
      connect: "Age drives the oocyte chromosomal abnormalities that cause age-related decline (p.627), and why 'fast-track' management is needed over 35." },
    { topic: "Causes", src: "p.620",
      q: "Which causes of female infertility are most common in Africa versus the Western world?",
      a: "Africa: tubal infertility. Western world: male factor or ovulation disorders.",
      connect: "Tubal = infection = preventable. That is the programmatic message: control RTIs, prevent post-abortion and puerperal infection." },
    { topic: "Causes", src: "p.621",
      q: "Classify the causes of female infertility.",
      a: "Total ovarian failure · tubal dysfunction · disorders of implantation · disorders of ovulation (hypothalamic, pituitary, ovarian, thyroid and adrenal, chromosomal).",
      connect: "Mnemonic path of an egg: made (ovary), released (ovulation), carried (tube), planted (implantation)." },
    { topic: "Causes", src: "p.622",
      q: "What are premature ovarian failure and resistant ovary syndrome?",
      a: "Premature ovarian failure: ovaries stop functioning early (menses cease), linked to autoimmune disease and may be hereditary. Resistant ovary syndrome: primordial follicles fail to mature because of a lack of (or antibodies to) gonadotrophin receptors. Irregular ovulation is commoner than total ovarian failure.",
      connect: "Both have high FSH and LH with low oestradiol. The amenorrhoea slides define premature ovarian failure as before age 40 (this infertility slide says 40 or over)." },
    { topic: "Causes", src: "p.623, 624",
      q: "How do hypothalamic and pituitary disorders cause anovulation?",
      a: "Hypothalamic: abnormal GnRH release (stress, weight loss, drugs), often reversible. Pituitary: micro- or macroadenomas raise prolactin, causing amenorrhoea and anovulation. Prolactin above 1000 iu/L suggests an adenoma, so get MRI of the pituitary fossa.",
      connect: "Low FSH/LH (below 5 u/L) = hypothalamic. High prolactin = pituitary. Treat with pulsatile GnRH or gonadotrophins (hypothalamic) and dopamine agonists (hyperprolactinaemia)." },
    { topic: "Causes", src: "p.625",
      q: "Describe PCOS as a cause of infertility.",
      a: "Commonest cause of anovulatory infertility. Oligomenorrhoea, obesity, hirsutism, raised LH with altered LH:FSH ratio, raised androgens. More common in Asian women. USS: enlarged ovary with 10 or more peripheral small cysts, thickened stroma and increased stromal blood flow.",
      connect: "LH:FSH above 2:1 on days 1–3 is the lab clue. First treatment clomiphene; if resistant, gonadotrophins or laparoscopic ovarian drilling. OHSS risk is higher in PCOS." },
    { topic: "Causes", src: "p.626",
      q: "What is a luteinised unruptured follicle (LUF)?",
      a: "The dominant follicle luteinises but does not rupture, so no egg is released. Causes: prostaglandin synthetase inhibitors, endometriosis. Diagnosed by USS or laparoscopy.",
      connect: "Why it matters: progesterone may be normal (the trap in the mid-luteal progesterone test). Treatment is hCG as an ovulation trigger." },
    { topic: "Causes", src: "p.627",
      q: "Which thyroid, adrenal and chromosomal conditions cause infertility?",
      a: "Hypo- and hyperthyroidism; Cushing's syndrome; congenital adrenal hyperplasia; Turner syndrome and other sex-chromosome abnormalities (absent or defective X); age-related oocyte chromosomal errors.",
      connect: "Hence examination looks for exophthalmos, goitre, webbed neck and low hairline." },
    { topic: "Causes", src: "p.628",
      q: "How does the tube cause infertility, and what are the causes?",
      a: "Impaired oocyte pick-up (peritubal adhesions, damaged fimbriae) or damaged tubal epithelium. Causes: PID (the major one; chlamydia commonest, then gonococci), endometriosis, peritonitis after appendicitis, sepsis after pelvic or abdominal surgery.",
      connect: "Adhesions link endometriosis, appendicitis, surgery and PID. It also explains ectopic pregnancy risk after tubal damage." },
    { topic: "Causes", src: "p.629",
      q: "What causes failed implantation, and which lifestyle factors affect fertility?",
      a: "Luteal insufficiency (low progesterone) and a submucous fibroid distorting the cavity. Smoking, alcohol, drugs, psychological and environmental factors.",
      connect: "Submucous fibroid is the same lesion causing menorrhagia, so the fibroid card pairs with this one. HSG shows it as a filling defect." },
    { topic: "Male factor", src: "p.631–633",
      q: "Summarise normal spermatogenesis and its hormonal control.",
      a: "FSH acts on Sertoli cells; LH acts on Leydig cells, which make androgens. Spermiogenesis takes about 74 days. Sertoli cells secrete inhibin, which gives negative feedback on pituitary FSH. Genes for spermatogenesis are on the Y chromosome.",
      connect: "Sertoli = granulosa equivalent; Leydig = theca equivalent. That is why FSH is raised in testicular failure, since inhibin is low." },
    { topic: "Male factor", src: "p.634",
      q: "List causes of impaired spermatogenesis.",
      a: "Raised scrotal temperature (undescended testes, varicocoele, hot baths, tight underwear), Y-chromosome microdeletions, drugs (psychotropics, anti-epileptics, antihypertensives, antibiotics, chemotherapy).",
      connect: "About 25% of men with abnormal semen have a varicocoele, but benefit from ligation is unproven." },
    { topic: "Male factor", src: "p.635, 636",
      q: "Causes of impaired sperm transport and of ejaculatory dysfunction?",
      a: "Transport: epididymal malformation or inflammatory obstruction, absent or enlarged vas, immotile cilia syndrome, vasectomy. Ejaculatory (1–2% of male infertility): anejaculation, premature ejaculation, retrograde ejaculation, drugs, diabetes, multiple sclerosis. Anti-sperm antibodies (IgG/IgA) also impair function.",
      connect: "Diabetes appears in many pelvic questions. Retrograde ejaculation = sperm in post-ejaculate urine." },
    { topic: "Evaluation", src: "p.637–639",
      q: "What does the infertility history cover, and which clues does examination look for?",
      a: "Type and duration, previous pregnancies and outcomes, prior treatment, menstrual pattern, coital frequency, STIs, surgical contraception, lifestyle (alcohol, tobacco, drugs), occupation, family history, medications. Examination: BMI, exophthalmos, thyroid, webbed neck, low-set ears, galactorrhoea, abdominal and pelvic masses, adnexal or cul-de-sac nodularity. Examine both partners.",
      connect: "Adnexal and cul-de-sac nodularity = endometriosis. Galactorrhoea = prolactin. Always take a confidential STI and previous-pregnancy history from both partners." },
    { topic: "Evaluation", src: "p.640",
      q: "What are the psychological issues in infertility?",
      a: "Stress at every stage. Anxiety during work-up, but depression is the most common reaction to failed treatment. Risks: marital breakdown, domestic violence. Counselling at the start, when indicated, and at the end of unsuccessful treatment or after a loss. Donor gamete couples need counselling.",
      connect: "Essay marks come from covering psychosocial issues: stigma, blame on the woman, and both partners participating." },
    { topic: "Investigations", src: "p.641",
      q: "What hormone tests are done and when?",
      a: "Early follicular (days 1–3): FSH and LH (LH:FSH ratio of 2:1 or more = PCOS). In irregular menses add thyroid function, prolactin and androgen profile. Mid-luteal progesterone above 30 nmol/L = ovulation.",
      connect: "Timing is part of the answer: always state the cycle day when naming a hormone test." },
    { topic: "Investigations", src: "p.642",
      q: "What does ultrasound add, and when is it done?",
      a: "Detailed USS on days 10–12 establishes follicular and endometrial maturity, and identifies polycystic ovaries and uterine abnormalities. Serial USS tracks follicles.",
      connect: "Follicles reach 20–26 mm at the LH surge, so tracking tells you when ovulation is due and confirms rupture." },
    { topic: "Investigations", src: "p.643",
      q: "Describe the hysterosalpingogram: purpose, timing and findings.",
      a: "Radio-opaque dye through the cervix under X-ray to assess uterine cavity and tubal patency. Done in the first 10 days of the cycle (avoids irradiating an early embryo). Free spill = patent. Loculated spill = adhesions. Club-shaped dilated tube = hydrosalpinx. Filling defect = submucous fibroid, polyp or adhesions. Further tests: laparoscopy and dye test, hystero-contrast sonography.",
      connect: "A recurring short-note question in past papers, so learn this card cold." },
    { topic: "Investigations", src: "p.644, 645",
      q: "State the WHO 2010 semen reference values and the terms for abnormalities.",
      a: "Volume 1.5 ml; liquefaction within 30 min; concentration 15 million/ml; progressive motility 32% (total motility 40%); 4% normal forms; WBC under 1 million/ml. Aspermia: no ejaculate. Azoospermia: no sperm. Oligo-, astheno-, terato-zoospermia: low count, poor motility, abnormal shape.",
      connect: "Motility, morphology and agglutination predict fertilising ability better than sperm count. Abstain 2–3 days and repeat if abnormal. Oligo- or azoospermia: check gonadotrophins, testosterone and prolactin." },
    { topic: "Investigations", src: "p.646",
      q: "Outline the timing of the infertility work-up across a cycle.",
      a: "Day 3: FSH, oestradiol, antral follicle count. Days 7–11: HSG or follicular tracking. Days 10–18: urinary LH testing. Day 21 (or 1 week after the LH surge): progesterone, laparoscopy with chromotubation. Days 25–28: endometrial biopsy. Any day: semen analysis. Month 2: review results and plan treatment. Barrier contraception is advised in the testing cycle.",
      connect: "This is the structure of a good answer to 'evaluate an infertile couple': both partners, in parallel, within about two cycles." },
    { topic: "Management", src: "p.647",
      q: "What programmatic strategies apply to treating infertility in developing countries?",
      a: "Evaluate men as well as women; sensitive counselling to avoid inappropriate treatment and multiple clinic shopping; advise on timing of intercourse, smoking and alcohol; help couples cope with the social and psychological burden; consider non-medical options such as adoption.",
      connect: "Counselling is a recurring theme throughout the slides: early advice on adoption and gamete donation where indicated." },
    { topic: "Management", src: "p.648",
      q: "Which factors affect the conception rate, and what predicts a poor outcome?",
      a: "Age of the woman (decline after 35), baseline FSH, prior conception, associated sperm dysfunction. Baseline FSH above 10 u/L = poor prognosis. Fast-track women over 35.",
      connect: "High baseline FSH reflects low ovarian reserve, which means fewer and poorer oocytes." },
    { topic: "Management", src: "p.649–651",
      q: "Describe clomiphene citrate therapy.",
      a: "Non-steroidal with oestrogenic and anti-oestrogenic effects. Blocks oestradiol receptors, raising FSH. 50 mg daily on days 2–6, increase to 150 mg if no response, maximum 6 ovulatory cycles. Tamoxifen 20–40 mg days 2–6 is similar. hCG 5,000 IU trigger if there is an unruptured luteinised follicle. Check semen first, monitor by USS, warn about multiple pregnancy and OHSS.",
      connect: "Clomiphene is first-line for anovulation (PCOS). Always analyse the semen before starting treatment." },
    { topic: "Management", src: "p.651",
      q: "Clomiphene-resistant PCOS: what are the options?",
      a: "Gonadotrophins (FSH subcutaneous, or hMG IM which combines FSH and LH), with hCG trigger. Withhold hCG if more than 3 follicles are mature. Multiple gestation about 20%. Laparoscopic ovarian drilling (laser or diathermy) in selected cases.",
      connect: "Drilling avoids the multiple pregnancy and OHSS risk of gonadotrophins, but it is surgery." },
    { topic: "Management", src: "p.652, 653",
      q: "What is OHSS? Give its pathophysiology, features and risk groups.",
      a: "Iatrogenic, life-threatening complication of ovarian stimulation (up to 5% of stimulated cycles; severe in 0.5–2% of IVF cycles). hCG is necessary. VEGF from luteinised granulosa cells causes capillary leak: ovarian cystic enlargement, ascites, abdominal distension, intravascular volume depletion and haemoconcentration. Higher risk in PCOS.",
      connect: "Think of it as third-spacing. Haemoconcentration brings the thrombosis risk, and the fluid shift explains why management is fluids and monitoring." },
    { topic: "Management", src: "p.654",
      q: "Treatment of hyperprolactinaemic and hypothalamic anovulation?",
      a: "Hyperprolactinaemia: dopamine agonists. Bromocriptine (ergot, GI upset); cabergoline and quinagolide (D2 agonists, longer half-life). Hypothalamic anovulation (LH and FSH below 5 u/L, oestrogen low): pulsatile GnRH or gonadotrophins; MRI to exclude tumours.",
      connect: "Match drug to defect: high prolactin → dopamine agonist; low gonadotrophins → give gonadotrophins or GnRH; PCOS → clomiphene first." },
    { topic: "Management", src: "p.655",
      q: "What is IUI with superovulation, and when is it used?",
      a: "Prepared sperm are injected into the uterine fundus around ovulation, with ovarian stimulation to ensure at least one mature follicle. Indications: sub-optimal sperm motility and unexplained infertility. Better than no treatment in unexplained infertility.",
      connect: "Shortens the sperm's journey. It needs at least one patent tube." },
    { topic: "Management", src: "p.656, 657",
      q: "Tubal disease: when is surgery indicated and what operations exist?",
      a: "Tubal damage is graded 1–4; surgery only for grades 1 and 2 (least damaged). Salpingo-ovariolysis (adhesions), fimbrioplasty, salpingoneostomy (new tubal opening), and reversal of sterilisation (good results). Outcome depends on surgeon, facilities and the extent of damage; poor if the woman is older or there is male factor. IVF-ET is the only chance when tubes can't be opened.",
      connect: "As ART improves, tubal surgery is used less. Reversal of sterilisation works because damage is limited and fertility has been proven." },
    { topic: "Management", src: "p.658, 659",
      q: "How is male infertility treated?",
      a: "Quality of sperm matters more than count. Hormonal treatment only works in hypogonadotrophic hypogonadism. IUI with stimulation helps poor motility. Varicocoele ligation: benefit unconfirmed. Systemic steroids for anti-sperm antibodies: conflicting evidence. ART gives the best results. Azoospermia: sperm aspiration (TESA, PESA, MESA) then ICSI.",
      connect: "ART list: IVF, DI, GIFT, ZIFT, SUZI, ICSI. ICSI injects a single sperm directly into an egg." },
    { topic: "Management", src: "p.660, 661",
      q: "List the steps of an IVF-ET cycle and its complications.",
      a: "Consultation and tests → pituitary down-regulation → ovarian stimulation → hCG trigger → oocyte collection → semen preparation → insemination → fertilisation and cleavage → embryo transfer (± cryopreservation) → luteal support. Complications: OHSS, multiple gestation, possibly ovarian tumours and early menopause long-term.",
      connect: "Down-regulation is with GnRH analogues, the same drug class that treats endometriosis and fibroids." },
    { topic: "Prevention", src: "p.663–665",
      q: "How can the burden of infertility be reduced at population level?",
      a: "Control reproductive tract infections (education, condoms, prompt treatment with partner notification, access to RTI services). Prevent post-partum and post-abortion infection (safe delivery, family planning, safe abortion). Control endemic disease (schistosomiasis, TB). Challenge beliefs that blame the woman alone. Early STD treatment. Basic infertility services. Don't delay parenthood.",
      connect: "This is the public-health half of 'epidemiology and prevention of infertility in Nigeria', an essay asked in past papers (1991, 2007)." },
    { topic: "Extra", src: "standard teaching, not on slides",
      q: "How does Chlamydia cause infertility without the woman ever noticing?",
      a: "About 80% of women are asymptomatic. Silent ascending infection scars the tubes, so the first sign of the disease may be infertility or ectopic pregnancy.",
      connect: "The slides give the 80% figure (p.777) separately. A young woman with a past chlamydia infection and normal semen and cycles in the partner is a classic past-question stem (tubal/peritoneal factor).", extra: true }
  ]
}]);

window.QUESTION_BANKS = (window.QUESTION_BANKS || []).concat([{
  id: "og-cards-labour",
  subject: "O&G",
  group: "Labour & the partograph",
  type: "cards",
  title: "O&G Flashcards · Labour and the partograph",
  cards: [
    { topic: "Stages of labour", src: "Standard teaching; p.1424",
      q: "Define the four stages of labour and their usual duration.",
      a: "First: onset of regular contractions with cervical change to full dilatation (10 cm), latent then active phase; primigravida about 12 hours, multipara about 6–8. Second: full dilatation to delivery of the baby (primigravida up to 2 hours, multipara up to 1 hour). Third: delivery of the baby to delivery of the placenta and membranes (up to 30 minutes with active management). Fourth: the first hour after delivery of the placenta (p.1424).",
      connect: "Most PPH occurs in the first 4 hours, so the 4th stage is a period of close watch with uterine massage and vital signs (p.1424).", extra: true },
    { topic: "Stages of labour", src: "p.160",
      q: "What are the latent and active phases of the first stage, and who described them?",
      a: "Latent phase: slow cervical change with irregular or mild contractions. Active phase: faster dilatation (at least 1 cm per hour) from about 4 cm to full dilatation. Friedman (1957) described the two phases; Philpott (1971) worked on African women and introduced the alert and action lines; the WHO model was designed for peripheral (primary-level) use.",
      connect: "The slide criticises the WHO model because the latent phase is variable, so it is plotted only from the active phase." },
    { topic: "Admission", src: "p.157",
      q: "What do you do when a woman is admitted in labour?",
      a: "History: biodata, parity, LMP and EDD, onset of labour, show, bleeding, liquor, antenatal and past obstetric history. Examination: general, blood pressure, abdominal examination (fundal height, lie, presentation, descent, contractions), fetal heart rate, pelvic examination. Urinalysis for proteinuria.",
      connect: "Proteinuria with raised BP at admission = pre-eclampsia: see that topic and the danger signs below." },
    { topic: "Admission", src: "p.158",
      q: "Which routine practices on admission are no longer recommended?",
      a: "Routine enema and routine shaving (common in the early 1980s, believed to reduce infection but not shown to; shaving causes uncomfortable regrowth and may encourage infection; trim only if labial visibility is poor), and oil or bath routines.",
      connect: "Examiners like 'controversial practices': the answer is that evidence did not support them." },
    { topic: "Monitoring", src: "p.159",
      q: "How is a woman monitored in labour?",
      a: "Partograph; maternal BP and temperature 4-hourly, pulse half-hourly; fetal heart rate by auscultation or cardiotocography; fetal blood pH if available; pain relief: psychological preparation, hypnosis, acupuncture, narcotics, Entonox, epidural anaesthesia.",
      connect: "Pain relief is part of monitoring because pain and anxiety slow labour. Pethidine (narcotic) crosses the placenta, so watch the baby's breathing." },
    { topic: "Partograph", src: "p.163",
      q: "List the components of the WHO partograph.",
      a: "Fetal: fetal heart rate, liquor, moulding. Progress: cervical dilatation, descent of the head, contractions. Maternal: vital signs (pulse, BP, temperature), urine, drugs, infusions and oxytocin.",
      connect: "Past short note 'The partograph' (about 10 sittings). Group by the three headings and add alert and action lines." },
    { topic: "Partograph", src: "p.160; Standard teaching",
      q: "Describe the alert and action lines and how you act when they are crossed.",
      a: "Alert line: starts at 4 cm and rises at 1 cm/hour to 10 cm. Action line: parallel and 4 hours to the right. If dilatation crosses the alert line: look for the cause, correct it (rehydrate, analgesia, empty bladder) and consider referral. If it crosses the action line: assess for obstruction and act: ARM, oxytocin augmentation if no obstruction, or delivery by caesarean section.",
      connect: "The line represents the slowest 10% of normal labours. Never augment with oxytocin if there is disproportion or malpresentation.", extra: true },
    { topic: "Partograph", src: "Standard teaching",
      q: "What are the symbols and charts on a partograph?",
      a: "Dilatation plotted as X, descent as O (in fifths of head palpable above the symphysis), contractions as shading by number in 10 minutes and duration (below 20 s, 20–40 s, over 40 s), liquor I/C/M/B/A, moulding 0/+/++/+++, FHR every 30 minutes, pulse, BP and temperature, urine volume, protein and acetone, oxytocin and drugs.",
      connect: "Moulding of +++ with a high head and a slowing curve points to obstruction.", extra: true },
    { topic: "Partograph", src: "p.164, 165",
      q: "What are the advantages and criticisms of the partograph?",
      a: "Advantages: low cost; reduces labour lasting more than 18 hours by 50%; reduces the caesarean rate; reduces augmentation by 50%; improves neonatal outcome. Criticisms: the latent phase is variable, station is used rather than descent, and it is unreliable in breech and spurious labour.",
      connect: "Write these as two short lists in a partograph essay to pick up the final marks." },
    { topic: "Partograph", src: "p.1082, 1191, 1371",
      q: "In which special situations does your deck insist on the partograph?",
      a: "Grand multiparity (p.1191), sickle cell disease and other haemoglobinopathies (p.1082), and HIV-positive women, where its use improves management of progress of labour (p.1371).",
      connect: "These are high-risk labours where prolonged labour or haemorrhage is dangerous." },
    { topic: "Fetal monitoring", src: "p.269–273, 278",
      q: "Describe a normal CTG and the main abnormalities.",
      a: "Normal: baseline 110–150 bpm, variability above 10 bpm (10–25), at least 2 accelerations (rise 15 bpm for 15 s) in 20 minutes, no decelerations. Suspicious: no accelerations, baseline outside 110–150, reduced variability (below 10), variable decelerations. Abnormal: no accelerations plus two of: abnormal rate, abnormal variability, repetitive late decelerations or ominous variable decelerations. Fetal bradycardia is below 110.",
      connect: "Reduced variability is caused by hypoxia, infection, fetal sleep and drugs such as opioids and hypnotics (p.269)." },
    { topic: "Fetal monitoring", src: "p.173",
      q: "What are the causes of an abnormal fetal heart rate in labour?",
      a: "Tachycardia: maternal fever, dehydration, drugs (such as ritodrine), fetal distress. Bradycardia: fetal distress, congenital heart anomalies (heart block). Late decelerations point to uteroplacental insufficiency.",
      connect: "Treat reversible causes first (turn her left lateral, fluids, oxygen, stop oxytocin) before deciding on delivery.", extra: true },
    { topic: "Labour care", src: "p.166",
      q: "Compare early and late amniotomy.",
      a: "Early: allows early characterisation of the liquor, shortens labour and is believed to reduce fetal distress, but carries a risk of infection, cord prolapse and amniotic fluid embolism. Late: usually not associated with infection.",
      connect: "In HIV, ARM is reserved for abnormal progress or fetal distress because rupture for more than 4 hours raises transmission (p.1372)." },
    { topic: "Danger signs", src: "p.167–172",
      q: "What are the commonest causes of maternal mortality and the danger signs in labour?",
      a: "Causes: antepartum and postpartum haemorrhage, obstructed labour, sepsis, eclampsia. Maternal danger signs: bleeding (ruptured uterus, abruptio, placenta praevia), hypertension (diastolic above 90, especially above 110, proteinuria, convulsion), prolonged labour, abnormal fetal heart rate.",
      connect: "Each danger sign leads to a topic in this site: APH, hypertension, obstructed labour and PPH." },
    { topic: "Prolonged labour", src: "p.172",
      q: "What are the causes of prolonged labour (and of delay in the first and second stages)?",
      a: "The three Ps. Power: inadequate contractions. Passage: inadequate pelvis (contracted, deformed), soft tissue obstruction. Passenger: big baby, malposition (occipitoposterior) or malpresentation (breech, brow, face, shoulder), hydrocephalus. Also maternal exhaustion, dehydration, full bladder, anxiety and epidural.",
      connect: "Past questions: 'Causes of delayed 1st stage of labour' and 'Causes of delay in 2nd stage of labour'. Same three-P framework for both.", extra: true },
    { topic: "Obstructed labour", src: "p.167, 172; Standard teaching",
      q: "Define obstructed labour and give the signs.",
      a: "Failure of descent of the presenting part despite good contractions, because of mechanical obstruction (cephalopelvic disproportion, malpresentation, soft-tissue tumour). Signs: maternal exhaustion, dehydration, ketosis, fever and tachycardia; tender lower segment with Bandl's ring; oedematous cervix and vagina, hot dry vagina; severe caput and moulding; meconium; fetal distress or death.",
      connect: "Obstructed labour is among the commonest causes of maternal mortality (p.167).", extra: true },
    { topic: "Obstructed labour", src: "Standard teaching",
      q: "How do you manage a woman who is para 5+0 with obstructed labour? (past paper)",
      a: "Resuscitate: IV access, fluids, correct dehydration and acidosis, analgesia, broad-spectrum antibiotics, crossmatch blood, catheterise the bladder. Confirm obstruction and cause. Live fetus: caesarean section. Dead fetus: craniotomy or other destructive operation if the head is engaged, caesarean section if not. Check for uterine rupture. After delivery: continuous bladder drainage for 10–14 days, antibiotics, watch for PPH and sepsis, counsel, family planning (tubal ligation if she wishes).",
      connect: "Grand multiparity adds risks of rupture and PPH. Prevent with antenatal risk screening, partograph, early referral.", extra: true },

    { topic: "Placenta praevia", src: "Standard teaching",

    { topic: "Diagnosis", src: "Standard teaching",
      stem: "A woman with 7 weeks of amenorrhoea has a positive pregnancy test, a serum hCG of 4,000 IU/L and no intrauterine gestational sac on transvaginal scan. The most likely diagnosis is:",

    { topic: "Diagnosis", src: "Standard teaching",
      stem: "In early pregnancy, serum β-hCG in a normal intrauterine pregnancy:",

      explain: "In ectopic pregnancy hCG rises more slowly than normal or plateaus, so serial levels 48 hours apart help; a slow rise is suspicious but about one in five ectopics rise normally. A past paper stem says 'hCG doubles every 48 hours in ectopic pregnancy', which is false: that is the normal intrauterine pattern. Urinary hCG is detectable in a concentrated sample (true in ectopic as well)." },

    { topic: "Management", src: "Standard teaching",
      stem: "A woman with a ruptured ectopic pregnancy is pale with a pulse of 130/min and a blood pressure of 70/40 mmHg. The most appropriate management is:",

      answer: 2,
      explain: "A shocked woman needs resuscitation and surgery at the same time: two large-bore cannulae, crossmatched blood (O negative if urgent), oxygen, and laparotomy (or laparoscopy if skilled and stable enough) with salpingectomy. Do not delay surgery to complete the resuscitation, because the bleeding is the problem. Give anti-D if Rh negative." },
    { topic: "Management", src: "p.542",
      stem: "Which woman is most suitable for medical management with methotrexate?",
      options: ["Haemodynamically unstable with a ruptured tube", "Stable, 2.5 cm unruptured mass, hCG 1,800 IU/L, no fetal cardiac activity", "Stable, 5 cm mass with fetal cardiac activity", "Breastfeeding, stable, hCG 2,000 IU/L", "Stable with a coexisting live intrauterine pregnancy"],

      explain: "Criteria: haemodynamically stable, unruptured, mass under about 3.5 cm, hCG below about 5,000 (best below 1,500), no fetal cardiac activity, normal liver and renal function, reliable follow-up. Single dose 50 mg/m² IM, with hCG on day 4 and 7 (expect a fall of more than 15%). Avoid NSAIDs, folic acid and alcohol, and advise contraception for 3 months. Mifepristone has no proven value; KCl is injected locally (cervical or heterotopic). Methotrexate also appears in the slide list of drugs for induced abortion (p.542)." },
    { topic: "Management", src: "Standard teaching",
      stem: "A 29-year-old with one tube already removed for a previous ectopic has a stable unruptured tubal ectopic in the remaining tube and wishes to conceive. The best surgical option is:",
