  items: [
    { n: 1, topic: "Abortion", q: "Define unsafe abortion.",
      a: ["A procedure for terminating an unwanted pregnancy either by persons lacking the necessary skills, or in an environment lacking the minimal medical standards."],
      connect: "Two ways to be unsafe: the wrong person or the wrong place. Skills or standards, either one is enough. Unsafe does not mean illegal: a legal abortion in a poor facility is still unsafe. It causes about 13 percent of maternal deaths.",
      detail: "Your slides call unsafe abortion the commonest cause of death among adolescents. The main killers are haemorrhage, sepsis, injury to the uterus, bowel or bladder, and tetanus. The real prevention is family planning, safe and legal services, and good post-abortion care.",
      slides: "p.547, 527" },
    { n: 2, topic: "Puerperium", q: "Define puerperal pyrexia and list its causes.",
      a: ["Definition: a temperature of 38°C on any occasion in the first 14 days after delivery or miscarriage.",
          "Causes: malaria", "Urinary tract infection (UTI)", "Breast infection / mastitis", "Genital tract infection (endometritis)", "Respiratory tract infection", "Septic pelvic thrombophlebitis"],
      connect: "Thirty-eight in fourteen. Then go head to toe: Breast, Chest, Bladder, Womb, Pelvic veins, plus malaria for Nigeria. Remember M-M-R-U-E-P: Malaria, Mastitis, Respiratory, UTI, Endometritis, Pelvic thrombophlebitis.",
      detail: "Puerperal pyrexia is the symptom; puerperal sepsis is infection of the genital tract. Examine the breasts, chest, calves, wound and lochia. Send a malaria film, a urine culture and a high vaginal swab. For endometritis give broad-spectrum antibiotics, such as ampicillin or ceftriaxone with metronidazole. Group A streptococcus is the dangerous organism.",
      slides: "p.1460" },
    { n: 3, topic: "Abortion", q: "List the indications for Manual Vacuum Aspiration (MVA).",
      a: ["Inevitable abortion", "Incomplete abortion", "Evaluation of remnants of a complete abortion", "Method of induced abortion (for example, early foetal death)", "Endometrial biopsy"],
      connect: "Think of the abortion ladder: Inevitable, Incomplete, Complete with remnants, Missed (early fetal death), and the odd one out, endometrial biopsy. MVA is the tool for emptying the womb early.",
      detail: "MVA is used for evacuation up to about 12 weeks. A missed abortion beyond 12 weeks is induced with prostaglandins instead. Give antibiotics if there is infection and anti-D if she is Rhesus negative. As a rule of thumb, the cannula size in millimetres matches the gestational age in weeks.",
      slides: "p.512–520, 532" },
    { n: 4, topic: "Abortion", q: "List the instruments used in MVA.",
      a: ["Karman's syringe", "Mechanical dilators", "Silicon lubrication", "Cannulae (4–12 mm)", "Adaptor for the cannulae", "Tenaculum", "Ring forceps"],
      connect: "Picture the tray from the syringe outwards: Syringe, Adaptor, Cannula (4 to 12 mm), Dilators, Lubricant, Tenaculum, Ring forceps. Karman's syringe is the star of the picture test.",
      detail: "Charge the syringe and check it holds a vacuum before you start. The tenaculum steadies the cervix, dilators are used only if the os is closed, and silicone lubricates the syringe and cannula. You know the uterus is empty when you feel a gritty texture, see no more tissue in the syringe, and the uterus contracts.",
      slides: "p.515" },
    { n: 5, topic: "Abortion", q: "List the rationales for using MVA.",
      a: ["Risk of post-evacuation complications is reduced.", "Cost of post-abortion services or resources is reduced because the equipment is reusable.", "Care can be provided at remote sites or small clinics, not just in urban centres.", "It is used for emergency post-abortion care."],
      connect: "Three C's: fewer Complications, lower Cost (reusable), and Clinics anywhere (remote sites). Your slide gives exactly these three.",
      detail: "Compared with sharp curettage, MVA causes less pain, less blood loss, and a lower risk of perforation and of Asherman syndrome. It can be done under a paracervical block as an outpatient. Dilatation and curettage is no longer recommended for incomplete abortion, as your slide p.541 states.",
      slides: "p.520" },
    { n: 6, topic: "Abortion", q: "List the components of post-abortal care.",
      a: ["Emergency treatment and health care services.", "Family planning and counselling.", "Reproductive health and referral services."],
      connect: "E-F-R: Emergency treatment, Family planning, Referral links. Treat the woman now, stop it happening again, and connect her to the rest of the system.",
      detail: "Post-abortion care also means early detection of complications such as sepsis and haemorrhage, counselling on danger signs, and starting a contraceptive before she leaves, because ovulation can return within two weeks. Unsafe abortion is a prime indicator of unmet need for family planning.",
      slides: "p.550–556" },
    { n: 7, topic: "Public health", q: "List the functions of Primary Health Care (PHC).",
      a: ["Health education", "Immunization", "Provision of maternal and child health services, including family planning", "Provision of essential drugs", "Provision of life-saving skills"],
      connect: "H-I-M-E-L: Health education, Immunisation, Maternal and child health with family planning, Essential drugs, Life-saving skills. PHC is the base of the pyramid of maternity services.",
      detail: "PHC is the base of the pyramid of maternity services: primary, secondary, then tertiary. The principle is to bring care closer to people with skilled attendants and a working referral system. It follows the Alma-Ata declaration of 1978.",
      slides: "p.189–197" },
    { n: 8, topic: "Gynaecological surgery", q: "List the diagnostic and therapeutic indications for laparoscopy.",
      a: ["Diagnostic: primary amenorrhoea, assessment of pelvic pain, suspected ectopic pregnancy, assessment of tubal patency (infertility), genital tract malformation, assessment of a pelvic mass, endometriosis.",
          "Therapeutic: treatment of ectopic pregnancy, endometriosis treatment, laparoscopic assisted vaginal hysterectomy (LAVH), laparoscopic myomectomy, ovarian cyst aspiration or cystectomy."],
      connect: "Diagnostic means LOOK, therapeutic means FIX the same things. Ectopic and endometriosis appear on both lists because you can see them and treat them in the same sitting.",
      detail: "Laparoscopy is the gold standard for diagnosing and treating ectopic pregnancy and endometriosis. Before surgery, empty the bladder, exclude pregnancy, and consent for possible laparotomy. Entry uses a Veress needle to create a carbon dioxide pneumoperitoneum; check for loss of liver dullness, as in your slides p.1135 to 1138.",
      slides: "p.1132–1133" },
    { n: 9, topic: "Gynaecological surgery", q: "List the complications of laparoscopy.",
      a: ["Gas embolism", "Anaesthetic complications due to positioning and pneumoperitoneum", "Pneumothorax / pneumomediastinum", "Port-site recurrence (in malignancy)", "Extraperitoneal gas insufflation", "Damage to near structures (for example bladder, bowel, ureter)", "Damage to blood vessels / haemorrhage"],
      connect: "Gas, Position, Injury, Port. Gas problems (embolism, pneumothorax, extraperitoneal), the Position and pneumoperitoneum for the anaesthetist, Injury to viscera and vessels, and Port-site spread of cancer.",
      detail: "Most serious injuries happen at entry, with the Veress needle or first trocar: bowel, bladder and major vessels. A gas embolism shows as sudden hypotension, tachycardia and a mill-wheel murmur. Treat by stopping insufflation, turning her left lateral and head down, and giving 100 percent oxygen. Shoulder-tip pain afterwards is from retained gas and is normal.",
      slides: "p.1142" },
    { n: 10, topic: "Postpartum haemorrhage", q: "List the interventions you would make in the management of postpartum haemorrhage (PPH).",
      a: ["Secure IV access (2 wide-bore) and collect blood samples for grouping and cross-matching.", "Set up IV fluid infusion with isotonic crystalloids.", "Give IV oxytocics.", "Manually rub up contractions by massaging the uterus if it is palpable.", "Transfuse blood and blood products as necessary.", "Give antibiotics and anti-tetanus prophylaxis, if indicated.", "Promptly repair genital tract lacerations.", "Use ultrasound scan (USS), if available, to assess for retained products.", "Perform uterine exploration by hand or manual vacuum evacuation.", "Use the Non-pneumatic Anti-Shock Garment (NASG).", "Use intrauterine balloon tamponade if oxytocics are unavailable or ineffective.", "Administer anti-fibrinolytic agents like tranexamic acid.", "If bleeding persists, surgery may be required (B-Lynch brace sutures, internal iliac or uterine artery ligation, or hysterectomy)."],
      connect: "Work up the ladder: Resuscitate (lines, fluids, blood), Rub up the uterus, Oxytocics, treat the cause (repair tears, remove tissue), then Tamponade and tranexamic acid, then Theatre. Simple version: Call for help, Fluids, Rub, Drugs, Look for the cause, Operate.",
      detail: "Act in parallel: call for help, resuscitate, and find the cause. Oxytocin infusion is the first-choice oxytocic; ergometrine and prostaglandins such as misoprostol or carboprost are second line. Give tranexamic acid 1 gram IV within 3 hours of birth. Bimanual or aortic compression buys time while theatre is prepared. Record blood loss and fluids accurately.",
      slides: "p.1408–1418" },
    { n: 11, topic: "Postpartum haemorrhage", q: "What are the major causes of primary PPH?",
      a: ["Uterine atony (Tone, 80%)", "Genital tract trauma / lacerations (Trauma)", "Retained placental tissue (Tissue)", "Coagulopathies / bleeding disorders (Thrombin)", "Uterine inversion"],
      connect: "The four T's: Tone, Trauma, Tissue, Thrombin. Tone is 80 percent, so when in doubt, the uterus is soft. Inversion is the rare fifth.",
      detail: "Primary PPH is within 24 hours of birth. Tone causes about 80 percent: look for prolonged labour, overdistension, fibroids and anaesthetic agents. Trauma includes cervical and vaginal tears, rupture and inversion. Tissue means retained placenta or membranes, including accreta. Thrombin means coagulopathy, such as abruption, HELLP, DIC or an inherited bleeding disorder.",
      slides: "p.1403, 1461" },
    { n: 12, topic: "Postpartum haemorrhage", q: "List the causes of secondary PPH.",
      a: ["Retained products of conception (placenta, membranes, or accessory lobe)", "Breakdown of uterine wound (caesarean section or rupture repair)", "Sloughing or shedding of dead tissue after obstructed labour", "Puerperal infection (endometritis)"],
      connect: "R-B-S-I: Retained products, Breakdown of the wound, Sloughing after obstructed labour, Infection. Secondary means after 24 hours and up to 6 weeks.",
      detail: "Secondary PPH occurs from 24 hours up to 6 weeks. Expect a tender, subinvoluted uterus and offensive lochia. Send a high vaginal swab, FBC and a scan for retained products. Treat with antibiotics and oxytocics, and evacuate only if products are retained, under antibiotic cover.",
      slides: "p.1404, 1461" },
    { n: 13, topic: "Postpartum haemorrhage", q: "List the predisposing factors to uterine atony in PPH.",
      a: ["Uterine overdistension: multiparity, polyhydramnios, macrosomia, and multiple pregnancies.", "Uterine relaxants: nifedipine, MgSO4, B-mimetics, indomethacin, and nitrous oxide.", "Others: rapid or prolonged labour, use of oxytocics to induce labour, chorioamnionitis, halogenated anaesthetics, fibroid in the uterus, and previous caesarean section."],
      connect: "Stretched, Relaxed, or Tired. Stretched: big baby, twins, polyhydramnios, many births. Relaxed: drugs, especially magnesium sulphate, nifedipine and halothane. Tired: fast or long labour, oxytocin induction. Your hypertension topic connects here: magnesium sulphate for eclampsia can cause atony.",
      detail: "Use risk factors to prepare, not to predict: for a high-risk woman set up a drip, crossmatch blood and give oxytocin with the anterior shoulder. A full bladder also prevents contraction, so keep it empty. Magnesium sulphate and nifedipine, used in pre-eclampsia and preterm labour, relax the uterus.",
      slides: "p.1405–1406, 1461" },
    { n: 14, topic: "Abortion", q: "List the causes of spontaneous / recurrent abortion.",
      a: ["Immunologic causes (lupus anticoagulant, antiphospholipid antibodies)", "Genetic abnormalities / chromosomal anomalies", "Maternal causes (diabetes mellitus, infections like TORCHES)", "Uterine abnormalities (Asherman's syndrome, cervical incompetence, uterine fibroids)", "Endocrine disorders", "Toxins (alcohol, smoking)", "Trauma"],
      connect: "G-U-M-I-E-T-T: Genetic, Uterine, Maternal disease, Immunologic, Endocrine, Toxins, Trauma. Early losses are genetic, late losses are uterine or cervical. Cervical incompetence is the commonest cause of recurrent loss in sub-Saharan Africa.",
      detail: "Recurrent abortion means three or more consecutive losses. First-trimester losses are mostly chromosomal; second-trimester losses point to the cervix or uterus. Investigate with parental karyotypes, hysterosalpingography or hysteroscopy, thyroid and glucose tests and antiphospholipid antibodies. Treat antiphospholipid syndrome with low-dose aspirin and heparin, and cervical incompetence with a cerclage at 14 to 18 weeks.",
      slides: "p.502–508, 533–538, 558" },
    { n: 15, topic: "Obstetrics", q: "List the radiographic signs of intrauterine foetal death (IUFD).",
      a: ["Spalding sign: overlapping of the skull bones due to liquefaction of the brain.", "Robert's sign: X-ray shows the presence of gas in the foetal great vessels (autolysis).", "Ball sign: exaggerated curvature of the foetal spine due to maceration of the spinous ligaments; the X-ray shows a crumpled-up spine.", "Crowding of the rib shadows.", "Lithopaedion (womb stone): a foetus that has died and calcified, intra- or extra-uterine."],
      connect: "S-R-B: Spalding is the Skull, Robert is the Rotten gas in the vessels, Ball is the Back curved like a ball. Then crowded ribs and the calcified lithopaedion. A dead fetus held for weeks can cause coagulopathy, so check clotting.",
      detail: "These signs appear days to weeks after death and are now rarely needed, because ultrasound shows absent cardiac activity at once. After four weeks of retained dead fetus the fibrinogen can fall, so check clotting before induction.",
      slides: "p.529–532" },
    { n: 16, topic: "Amenorrhoea", q: "List the causes of physiologic amenorrhoea.",
      a: ["Prior to the onset of puberty", "Pregnancy", "Lactation", "Menopause"],
      connect: "Before, During, After: Puberty, Pregnancy, Lactation, Menopause. The four normal reasons periods are absent.",
      detail: "Remember the other definitions: primary amenorrhoea is no menses by 14 years without secondary sexual characteristics, or by 16 with them. Secondary amenorrhoea is no menses for 6 months after previously normal cycles. Pregnancy is the commonest cause of secondary amenorrhoea.",
      slides: "p.576" },
    { n: 17, topic: "Amenorrhoea", q: "List the causes of secondary amenorrhoea (pathologic).",
      a: ["Reproductive tract abnormalities: cervical stenosis, Asherman syndrome, post-hysterectomy, TB and suppurative endometritis.", "Endocrine defects: hypothyroidism, hyperthyroidism, diabetes mellitus, Cushing syndrome, pituitary adenomas (prolactinoma), Sheehan's syndrome, surgical ablation or irradiation, haemosiderosis.", "Ovarian disorders: premature ovarian failure, polycystic ovarian syndrome (PCOS), autoimmune oophoritis, post-infection (mumps), post-oophorectomy, post-chemotherapy or irradiation.", "Hypothalamic disorders: functional and nonfunctional hypogonadotrophic hypogonadism, craniopharyngioma, sarcoidosis, exercise, weight loss, stress, pseudocyesis, and drugs."],
      connect: "Follow the hormone down the body: Hypothalamus, Pituitary, Ovary, then the Uterus and outflow, with thyroid, adrenal and diabetes on the side. Always exclude pregnancy first.",
      detail: "In practice the commonest pathological causes are PCOS, hyperprolactinaemia, premature ovarian failure, thyroid disease, weight loss and stress, and Asherman syndrome after curettage. A history of PPH followed by failure of lactation suggests Sheehan syndrome.",
      slides: "p.577–584" },
    { n: 18, topic: "Amenorrhoea", q: "What investigations would you request for someone presenting with amenorrhoea?",
      a: ["Pregnancy test (urine or blood)", "Abdominopelvic ultrasound scan", "Chromosomal studies (karyotype)", "CT scan, MRI or skull X-ray of the pituitary gland", "Hormonal assay: serum FSH, LH, prolactin, TSH, T3, T4, DHEA, oestradiol and testosterone", "Oral glucose tolerance test (OGTT)", "Autoimmune screening", "Progestogen challenge test", "Laparoscopy, hysterosalpingogram (HSG) and hysteroscopy"],
      connect: "Pregnancy first, then Pictures (scan, pituitary imaging), Chromosomes, Hormones, Glucose, Autoimmune screen, Progestogen challenge, and finally the Look-inside tests. High FSH and LH point to the ovary; low point to the pituitary or hypothalamus; high LH to FSH points to PCOS.",
      detail: "Do the pregnancy test first. Then FSH, LH, prolactin and TSH. High FSH means ovarian failure. Low or normal FSH with low oestrogen means a hypothalamic or pituitary cause, so image the pituitary. A high prolactin also needs a pituitary scan. The progestogen challenge shows whether oestrogen is present and the outflow tract is patent.",
      slides: "p.590–592" },
    { n: 19, topic: "Cytology", q: "List the advantages of exfoliative cytology.",
      a: ["Ease of specimen collection (especially vagina and cervix)", "Usually non-invasive", "Low cost", "Adaptable to mass screening", "Serial and mass observation is possible"],
      connect: "E-N-C-M-S: Easy, Non-invasive, Cheap, Mass screening, Serial repeats. That is why the Pap smear works as a screening test.",
      detail: "The Pap smear is taken at the squamocolumnar junction with an Ayre's spatula or cytobrush rotated through 360 degrees twice, then fixed on a slide. It screens but does not diagnose: false negatives occur, and an abnormal result needs colposcopy and biopsy.",
      slides: "p.321–327" },
    { n: 20, topic: "Cytology", q: "Mention the indications of cytology in Obstetrics and Gynaecology.",
      a: ["Obstetrics: diagnosis of amniotic fluid embolism (foetal cells in maternal sputum), prenatal diagnosis, prediction of risk of abortion, confirmation of premature rupture of membranes (PROM), Kleihauer-Betke test to demonstrate foetal cells in maternal blood, and detection of chromosomal abnormalities.", "Gynaecology: cancer screening, detection of ovulation, and management of abnormal uterine bleeding."],
      connect: "Obstetrics is about FLUID and fetal cells: amniotic fluid embolism, PROM (the fern test), Kleihauer, prenatal diagnosis. Gynaecology is Cancer, Cycle (ovulation, hormone status) and Bleeding.",
      detail: "Know three examples: the fern test on liquor for PROM, navicular cells in the vagina that predict the risk of abortion, and the Kleihauer-Betke test that counts fetal red cells in maternal blood to dose anti-D.",
      slides: "p.315–320" },
    { n: 21, topic: "Fibroids", q: "List the types of fibroids based on their location.",
      a: ["Subserous (15%)", "Intramural (60%)", "Submucous (15%)", "Cervical fibroid", "Intraligamentary", "Parasitic fibroid", "Pedunculated"],
      connect: "Sixty, twenty, fifteen: Intramural 60, Submucous 20, Subserous 15. Submucous gives the heavy bleeding and infertility; subserous gives pressure and torsion when pedunculated.",
      detail: "Fibroids are smooth muscle tumours and the commonest uterine tumour, found in about 30 percent of women over 30 and two to three times more often in Black women. Most are asymptomatic. Symptoms follow the site: submucous cause menorrhagia and infertility, subserous cause pressure, and cervical fibroids cause urinary retention.",
      note: "Your slide gives submucous as 20 percent; the document says 15 percent.",
      slides: "p.734, 738" },
    { n: 22, topic: "Fibroids", q: "List the degenerative changes a fibroid may undergo.",
      a: ["Hyaline degeneration", "Fatty change", "Calcification", "Red degeneration (necrobiosis)", "Atrophic changes", "Myxomatous change", "Pseudocystic changes", "Malignant change"],
      connect: "Hyaline is the commonest. Then Fatty, which leads to Calcification (womb stone). Red degeneration belongs to pregnancy. Atrophy follows menopause. Then Myxomatous, Pseudocystic and, rarely, Malignant (about 0.5 percent).",
      detail: "Red degeneration presents in pregnancy with acute abdominal pain, mild fever and tenderness, and is managed with analgesia and rest. Calcification gives a womb stone with an onion-skin look on X-ray. Suspect sarcoma if a fibroid grows rapidly, grows after menopause, or bleeds after menopause.",
      slides: "p.741–744" },
    { n: 23, topic: "Fibroids", q: "List the complications of myomectomy.",
      a: ["Haemorrhage", "Trauma", "Infection"],
      connect: "H-T-I: Haemorrhage, Trauma, Infection. Beyond the document, also remember adhesions and recurrence, about 27 percent at 10 years, and scar rupture in a later pregnancy.",
      detail: "Before myomectomy correct anaemia and crossmatch blood, because bleeding can be heavy. Ways to reduce blood loss include a tourniquet, vasopressin, misoprostol and tranexamic acid. After a myomectomy that entered the cavity, advise caesarean section in later pregnancies.",
      slides: "p.753–754" },
    { n: 24, topic: "Family planning", q: "Mention the non-contraceptive benefits of hormonal contraceptives.",
      a: ["Regular menstrual cycles", "Lighter menstrual loss", "Eliminates mid-cycle ovulation pain", "Painless menstruation (treats dysmenorrhoea)", "Delays timing / frequency of menstruation (useful in endometriosis)", "Improvement of pre-menstrual syndrome", "Reduced risk of epithelial ovarian cancer and endometrial cancer", "Reduced risk of colorectal cancer", "Treatment for acne, hirsutism and androgenic symptoms", "Reduced risk of ectopic pregnancy", "Reduced risk of anaemia"],
      connect: "Cycle, Cramps, Cancer, Complexion. The Cycle gets regular and lighter, the Cramps go, Cancer risk falls (ovary, endometrium, colon), the Complexion clears. Plus fewer ectopics and less anaemia.",
      detail: "These benefits come from suppressing ovulation and thinning the endometrium. The protection against ovarian and endometrial cancer lasts for years after stopping. Remember the risks too: venous thrombosis, hypertension, and a small rise in breast and cervical cancer risk.",
      slides: "" },
    { n: 25, topic: "Family planning", q: "Mention the types of hormonal contraceptives.",
      a: ["Oral contraceptive pills (OCPs / combined oral contraceptives)", "Injectable contraceptives", "Contraceptive implants (subdermal)", "Vaginal rings", "Transdermal patches", "Hormone-releasing IUDs"],
      connect: "Six routes: Mouth (pill), Muscle (injection), Skin (patch and implant under the skin), Vagina (ring), Womb (hormonal IUD). Pills, Injectables, Implants, Patches, Rings, IUS.",
      detail: "Combined methods contain oestrogen and progestogen: the pill, patch, ring and monthly injectables. Progestogen-only methods are the minipill, DMPA injection, implants and the levonorgestrel IUS; these suit breastfeeding women and those with contraindications to oestrogen.",
      slides: "p.418–421, 432" },
    { n: 26, topic: "Family planning", q: "List examples of non-biodegradable implants.",
      a: ["Norplant", "Implanon", "Jadelle", "Uniplant"],
      connect: "N-I-J-U: Norplant (6 capsules), Implanon (1 rod), Jadelle (2 rods, 75 mg levonorgestrel each), Uniplant. Non-biodegradable means they must be removed at the end.",
      detail: "Norplant has six capsules and lasts five years. Jadelle has two rods and lasts five years. Implanon is a single rod that lasts three years. The commonest side effect is irregular bleeding, and fertility returns quickly after removal.",
      slides: "p.435" },
    { n: 27, topic: "Obstetrics", q: "Mention biological and social factors in obstetrics.",
      a: ["Biological: age, height, weight, parity.", "Social: religion, culture, social support, socioeconomic status (poverty), and social substances (for example substance abuse)."],
      connect: "Biological is A-H-W-P: Age, Height, Weight, Parity. Social is R-C-S-P-S: Religion, Culture, Support, Poverty, Substances. Extremes of age, short stature and obesity all raise risk.",
      detail: "Use these to flag high-risk women at booking: under 18 or over 35, height under 150 centimetres because of cephalopelvic disproportion, obesity, grand multiparity, and poverty with poor access to care. Your slides p.300 to 306 list the problems of each.",
      slides: "p.296–311" },
    { n: 28, topic: "Obstetrics", q: "Mention the types and causes of intrauterine growth restriction (IUGR).",
      a: ["Types: symmetrical, asymmetrical, and combined type IUGR.", "Foetal causes: genetic or chromosomal anomalies (trisomies), congenital malformations, congenital infections (TORCHES), and multiple pregnancy.", "Maternal causes: hypertensive disorders (pre-eclampsia, eclampsia, chronic hypertension), chronic renal disease, anaemia, malnutrition, substance abuse (smoking, alcohol, drugs), and infections (malaria, UTI).", "Placental causes: placental insufficiency, placental malperfusion, multiple infarcts, and small placenta."],
      connect: "Types: Symmetric is early and genetic (33 percent), Asymmetric is late with brain sparing (55 percent), Combined is 12 percent. Causes: Fetus, Mother, Placenta, F-M-P. Pre-eclampsia is the maternal cause to link to your hypertension topic.",
      detail: "IUGR means an estimated weight below the tenth centile. Symmetrical IUGR starts early and is genetic or infective; asymmetrical starts late from placental insufficiency, with brain sparing so the head is relatively large. Diagnose with serial fundal height, ultrasound biometry and umbilical artery Doppler. Monitor with kick counts and CTG, and deliver when growth stops or Doppler shows absent end-diastolic flow.",
      slides: "p.1230–1238" },
    { n: 29, topic: "Puerperium", q: "List the complications of the puerperium.",
      a: ["Puerperal haemorrhage (PPH)", "Mastitis", "Uterine rupture", "Wound infection", "Uterine inversion", "Urinary tract infection (UTI)", "Septic pelvic thrombophlebitis", "Endomyometritis / endometritis", "Psychiatric disorders", "Vaginal and cervical lacerations or haematomas"],
      connect: "Go from head to toe: Mind (psychiatric), Breast (mastitis), Womb (PPH, endometritis, inversion, rupture), Birth canal (lacerations, haematoma), Wound, Bladder (UTI), Veins (pelvic thrombophlebitis).",
      detail: "The puerperium lasts 6 weeks. The commonest cause of puerperal fever is genital tract sepsis, but in the tropics always exclude malaria. Postnatal blues occur in the first week and pass; depression and psychosis need treatment and close watching.",
      slides: "p.1460–1481" },
    { n: 30, topic: "Antenatal care", q: "List the advantages of preconceptional care.",
      a: ["Women with chronic diseases become pregnant in as healthy a condition as possible.", "Dietary advice is offered for extremes of weight.", "Encouragement to give up smoking and alcohol.", "Advice is given to those who are anxious.", "Rubella immunisation is offered if the woman is susceptible.", "Checking baseline measurements like weight and blood pressure.", "Introduction of intending mothers to social and medical interventions."],
      connect: "Get the body ready before the pregnancy starts: Disease controlled, Diet and weight, Drugs and smoking stopped, Immunise (rubella), Baseline BP and weight, and Introduce the services. Anaemia is corrected here too.",
      detail: "Give folic acid 400 micrograms daily from before conception, and a higher dose of 5 milligrams if there was a previous neural tube defect or she takes anticonvulsants. Correct anaemia, check the genotype, and stabilise diabetes, hypertension and epilepsy before pregnancy.",
      slides: "p.1042, 1147, 1167, 1304" },
    { n: 31, topic: "Antenatal care", q: "List the investigations carried out at the booking clinic.",
      a: ["Urinalysis", "Blood pressure", "Blood grouping and cross-matching", "Blood haemoglobin genotype", "Blood for malaria parasite (MP)", "75 g OGTT or random blood sugar", "Venereal Disease Research Laboratory test (VDRL) and HIV"],
      connect: "U-B-B-G-M-S-V: Urine, Blood pressure, Blood group, Genotype, Malaria parasite, Sugar, VDRL and HIV. Urine and blood pressure screen for pre-eclampsia; genotype finds sickle cell.",
      detail: "Also at booking: weight, height, breast and pelvic examination, haemoglobin or PCV, and HIV counselling and testing, with hepatitis B where available. Genotype matters: SS or SC disease is high risk, and an AS woman with an AS partner risks an affected baby.",
      slides: "p.133, 149–152" },
    { n: 32, topic: "Family planning", q: "List techniques for bilateral tubal ligation (BTL).",
      a: ["Parkland technique", "Pomeroy technique", "Uchida technique", "Aldridge", "Fimbriectomy", "Madlener", "Irving"],
      connect: "Group them by what you do: Cut and tie (Pomeroy, Parkland), Crush and tie (Madlener), Bury the stump (Irving, Uchida, Aldridge), and Remove the fimbria (fimbriectomy). Pomeroy and Parkland are the commonest at minilaparotomy.",
      detail: "Postpartum ligation is done within 48 hours by minilaparotomy while the fundus is high. Interval ligation can be done at laparoscopy with Filshie clips or Falope rings. The failure rate is under one percent, but when it fails the pregnancy is often ectopic. Counsel that it is permanent and get her own consent.",
      slides: "p.428 (Essure)" },
    { n: 33, topic: "HIV", q: "Mention the goals of antiretroviral (ARV) therapy.",
      a: ["Prolong the quality of life.", "Improve the quality of life.", "Reduce the viral load as much and as long as possible to halt disease progression and prevent resistant variants.", "Achieve immune reconstitution that is quantitative (CD4 count in the normal range) and qualitative (pathogen-specific immune response)."],
      connect: "Live longer, Live better, Viral load down, Immunity back. In pregnancy the extra goal is to stop mother-to-child transmission: viral load under 1,000 copies means almost no transmission.",
      detail: "In pregnancy start ART for every HIV-positive woman regardless of CD4 count; tenofovir, lamivudine and efavirenz is the preferred first-line regimen in your slides p.1367 and 1368. Aim for a viral load below 1,000 copies per millilitre, which gives almost no transmission. Give infant prophylaxis and counsel on infant feeding.",
      slides: "p.1367–1368, 1388" },
    { n: 34, topic: "Gynaecological oncology", q: "List indications for radiotherapy in O and G and its complications.",
      a: ["Indications: choriocarcinoma, placental site trophoblastic tumour, cervical cancer.", "Complications: haemorrhage, pain, radiation burns, vomiting, leukaemia."],
      connect: "Radiotherapy in gynaecology is mainly for cervical cancer. Complications are Bleeding, Pain, Burns, Vomiting and a late risk of Leukaemia.",
      detail: "The main use is cervical cancer: external beam radiotherapy plus brachytherapy for locally advanced disease. Late effects include proctitis, cystitis, vaginal stenosis, fistulae and premature ovarian failure.",
      note: "Caution: gestational trophoblastic tumours are mainly treated with chemotherapy (methotrexate, actinomycin D); radiotherapy is occasional, for example for brain metastases. Check with your lecturer.",
      slides: "p.489" },
    { n: 35, topic: "Abortion", q: "Mention indications for the removal of a cervical cerclage before 38 weeks.",
      a: ["Congenital malformation", "Antepartum haemorrhage (APH)", "Pre-term contractions", "Premature rupture of membranes / ruptured membranes", "Intrauterine infection", "Intrauterine death"],
      connect: "The cerclage normally comes out at 38 weeks. Take it out early when it is no longer helping or can harm: Ruptured membranes, Antepartum bleeding, Infection, Contractions, Death of the fetus, and Malformation. R-A-I-C-D-M.",
      detail: "The cerclage, McDonald or Shirodkar, is inserted at 14 to 18 weeks and removed at 37 to 38 weeks. If contractions start with the stitch in, remove it at once, because contractions against a closed cervix can tear it.",
      slides: "p.562, 565" },
    { n: 36, topic: "Breastfeeding", q: "List the components of the Baby Friendly Hospital Initiative (BFHI).",
      a: ["Develop a policy and communicate it to all healthcare providers.", "Ensure breastfeeding is paramount.", "Educate mothers on the benefits and management of breastfeeding.", "Show mothers how to breastfeed and maintain lactation.", "Help mothers initiate breastfeeding by putting newborns in skin contact within 30 minutes of birth.", "Encourage breastfeeding on demand.", "Encourage breastfeeding support groups.", "Give no other food or drink unless medically indicated.", "Give no teats or pacifiers."],
      connect: "Policy, Educate, Show, Skin contact in 30 minutes, On demand, Support groups, and Strictly no teats or other feeds. It was launched in 1991 by WHO and UNICEF and has ten steps; a hospital is baby friendly only if it accepts no free milk substitutes, bottles or teats.",
      detail: "The ten steps were launched in 1991 by WHO and UNICEF. A hospital is not baby friendly if it accepts free or low-cost milk substitutes, bottles, teats or pacifiers. For HIV-positive mothers, individualise feeding advice after counselling.",
      slides: "p.1293, 1328–1333" },
    { n: 37, topic: "Public health", q: "Mention common causes of maternal mortality in Nigeria.",
      a: ["Malaria", "Eclampsia", "Puerperal sepsis", "Abortion", "Prolonged labour", "Ectopic pregnancy"],
      connect: "M-E-S-A-P-E: Malaria, Eclampsia, Sepsis, Abortion, Prolonged labour, Ectopic. Your slide lists the big four as haemorrhage (antepartum and postpartum), obstructed labour, sepsis and eclampsia, so always add haemorrhage.",
      detail: "Your slides give Nigeria's maternal mortality as about 800 per 100,000 live births, with two-thirds of births at home. Remember the three delays: delay in deciding to seek care, delay in reaching a facility, and delay in receiving care there. Skilled attendants, antenatal care and emergency obstetric care address them all.",
      slides: "p.167, 388" },
    { n: 38, topic: "Gynaecology", q: "List investigations to be carried out in the evaluation of a female rape victim.",
      a: ["Pregnancy test", "Speculum and vaginal examination", "Semen analysis", "VDRL", "HIV test"],
      connect: "P-S-S-V-H: Pregnancy test, Speculum exam, Semen analysis (swabs), VDRL, HIV. Beyond the document: offer emergency contraception, HIV post-exposure prophylaxis, tetanus and hepatitis B cover, and counselling.",
      detail: "Examine with consent and a chaperone, record injuries, and collect swabs as forensic evidence with a chain of custody. Offer emergency contraception, HIV post-exposure prophylaxis within 72 hours, and tetanus and hepatitis B vaccination. Arrange counselling and follow-up at 2 weeks, 6 weeks and 3 months.",
      slides: "p.431 (emergency contraception)" },
    { n: 39, topic: "Obstetrics", q: "List investigations for premature rupture of membranes (PROM).",
      a: ["Sterile speculum examination", "Nitrazine test", "Litmus paper test", "Use of Amnisure", "Ferning", "Full blood count (FBC)", "Urine culture", "Amniocentesis with instillation of Evans blue or indigo carmine", "Ultrasound (foetal growth and size, EGA, amniotic fluid volume)", "High vaginal swab (HVS) for microscopy, culture and sensitivity"],
      connect: "Three jobs. PROVE it is liquor: speculum, nitrazine and litmus (liquor is alkaline), Amnisure, ferning, dye test. EXCLUDE infection: FBC, urine culture, HVS. SIZE the baby: ultrasound. Remember that blood, semen and vaginal infection can also turn nitrazine blue.",
      detail: "PROM is rupture of membranes before labour starts; preterm PROM is before 37 weeks. Avoid digital vaginal examinations, which raise the risk of infection. Treat with antibiotics, give steroids if under 34 weeks, and deliver if there is chorioamnionitis: fever, maternal tachycardia, uterine tenderness or offensive liquor.",
      slides: "p.317, 1284–1288" },
    { n: 40, topic: "Medical disorders in pregnancy", q: "List investigations in a patient with diabetes mellitus (DM).",
      a: ["75 g OGTT (fasting plasma glucose above 126 mg/dl, 2-hour post-prandial above 140 mg/dl)", "Fasting plasma glucose (FPG)", "Electrolytes, urea and creatinine (E/U/Cr)", "Full blood count (FBC)", "Blood sugar profile (at 26 weeks)", "Urinalysis", "Urine microscopy, culture and sensitivity, and UTI screen", "HVS for infections", "Foetal monitoring and anomaly scan (18–22 weeks), followed by serial scan (32 weeks)"],
      connect: "Sugar, Kidney, Blood, Urine, Scan. Sugar tests (OGTT, FPG, profile at 26 weeks), Kidney function (E/U/Cr), FBC, Urine and infection screens, then the baby: anomaly scan at 18 to 22 weeks and growth scan at 32 weeks.",
      detail: "Pre-gestational diabetes needs control before conception, folic acid 5 milligrams, retinal and renal assessment, insulin, and delivery by about 38 to 39 weeks. Watch the newborn for hypoglycaemia. Gestational diabetes is screened for with the 75 gram OGTT at 24 to 28 weeks.",
      note: "Newer WHO and IADPSG criteria for gestational diabetes use a 75 g OGTT with fasting 92, one-hour 180 and two-hour 153 mg/dl. The document uses fasting above 126 and two-hour above 140. Ask your lecturer which one your examiners use.",
      slides: "p.1148–1176" },
    { n: 41, topic: "Anaemia in pregnancy", q: "List the maternal and foetal complications of anaemia in pregnancy.",
      a: ["Maternal: little blood loss at delivery could be life-threatening, loss of work hours and child care, increased risk of thromboembolism, increased maternal mortality by 3–5 times, increased risk of severe consequences in APH and PPH, mental lassitude, pre-eclampsia, preterm labour, decompensation in cardiac or renal disease, susceptibility to infections, and heart failure.", "Foetal: spontaneous abortion, poor immunity, poor nutrition, prematurity, anaemia in infancy due to low iron stores, abruptio placentae, IUGR / LBW, increased stillbirth rates, increased perinatal and infant morbidity, and delayed mental and psychomotor development."],
      connect: "The mother has no reserve: any blood loss is dangerous (APH, PPH), she gets infections and heart failure, and mortality rises three to five times. The baby gets small and early: abortion, IUGR, prematurity, abruption, stillbirth, then infant anaemia and slow development.",
      detail: "Your slides define anaemia in pregnancy as haemoglobin below 11 grams per decilitre, though many Nigerian hospitals use 10. Iron deficiency is the commonest cause, with folate deficiency, malaria and haemoglobinopathies close behind. Treat with oral iron and the cause; transfuse for severe anaemia near term or in labour.",
      slides: "p.997–1002" },
    { n: 42, topic: "Labour", q: "List methods of cervical ripening.",
      a: ["Non-pharmacologic: herbal supplements, castor oil or enemas, sexual intercourse, breast stimulation, acupuncture / TENS.", "Mechanical: hygroscopic dilators, intracervical Foley catheter.", "Surgical: stripping of the membranes, amniotomy.", "Pharmacological: prostaglandins (E2, misoprostol), antiprogesterone agents (mifepristone), relaxin."],
      connect: "N-M-S-P: Natural, Mechanical, Surgical, Pharmacological. Natural is herbs, castor oil, sex, nipple stimulation, acupuncture. Mechanical is a Foley catheter or dilators. Surgical is membrane sweep or ARM. Drugs are prostaglandins, mifepristone and relaxin.",
      detail: "Ripen first if the Bishop score is low. Misoprostol 25 micrograms vaginally every 4 to 6 hours or dinoprostone gel are the usual drugs. Avoid prostaglandins in a woman with a uterine scar because of the risk of rupture; a Foley catheter is the safer option.",
      slides: "p.166 (amniotomy)" },
    { n: 43, topic: "Anaesthesia", q: "List the contraindications to spinal anaesthesia.",
      a: ["Focal infection or sepsis around the intended site", "Bleeding disorders", "Raised intracranial pressure or space-occupying lesions in the brain", "Hypovolaemia", "Anatomical deformities of the spine", "Patient refusal (non-consent)"],
      connect: "Six reasons: Site infected, Bleeding disorder, Brain pressure raised, Volume low (hypovolaemia), Spine deformed, and Refusal. In pre-eclampsia check the platelets before a spinal.",
      detail: "Check the platelet count, usually above about 80,000, and the clotting before a spinal; in pre-eclampsia and HELLP they may be abnormal. A spinal causes a sympathetic block and hypotension, so preload with fluids, have a vasopressor ready, and tilt the uterus to the left.",
      slides: "" },
    { n: 44, topic: "Labour", q: "List the components of the partograph.",
      a: ["Foetal condition: foetal heart rate, liquor, moulding.", "Progress of labour: cervical dilatation, descent, contractions.", "Maternal condition: pulse, blood pressure, temperature / vital signs, urinalysis (acetone and protein), and drugs, fluids and oxytocin."],
      connect: "F-P-M: Fetus, Progress, Mother. Fetus is heart rate, liquor, moulding. Progress is dilatation, descent, contractions. Mother is pulse, blood pressure, temperature, urine, drugs. The most repeated short note in your archive.",
      detail: "Plot from 4 centimetres: the alert line rises 1 centimetre per hour, and the action line is 4 hours to the right. Your slide p.164 says it halves labour lasting over 18 hours and reduces the caesarean rate. Record the fetal heart rate every 30 minutes and dilatation every 4 hours.",
      slides: "p.163" },
    { n: 45, topic: "Gynaecological surgery", q: "List indications for hysteroscopy.",
      a: ["Diagnostic: abnormal vaginal bleeding, persistent vaginal discharge, Asherman syndrome, evaluation of abnormal findings (for example endometrial thickness on USS or HSG), and uterine malformations.", "Therapeutic: endometrial ablation, removal of polyp, removal of foreign body (for example IUD, foetal bone), resection of submucous fibroid, and resection of uterine synechiae or septa."],
      connect: "Diagnostic is FIND: bleeding, discharge, Asherman, abnormal scan, malformation. Therapeutic is FIX: ablation, polyps, foreign bodies (IUCD, fetal bone), submucous fibroid, synechiae and septa. Same pattern as laparoscopy.",
      detail: "The distension medium is normal saline for bipolar and glycine for monopolar instruments, and glycine can cause hyponatraemia. Operate in the follicular phase just after menses. Complications include perforation, fluid overload, infection and bleeding.",
      slides: "p.1121–1122" },
    { n: 46, topic: "Family planning", q: "What are the characteristics of an ideal contraceptive?",
      a: ["Acceptable to all cultures and religions", "Widespread availability", "Independent of intercourse", "No side effects", "Cheap", "Highly effective (0% failure rate)", "Independent of health care personnel", "Easily distributed", "Rapidly reversible"],
      connect: "Accepted, Available, Affordable, Always effective, Independent of intercourse and of staff, Reversible, and free of Side effects. No method meets all of them, which is why choice matters.",
      detail: "No single method meets all these criteria, which is why choice and counselling matter. The WHO medical eligibility categories 1 to 4 guide safe use. Condoms plus another method give dual protection against pregnancy and infection.",
      slides: "p.417, 438" },
    { n: 47, topic: "Gynaecological oncology", q: "List methods of treating cervical intraepithelial neoplasia (CIN).",
      a: ["Excisional methods: loop electrosurgical excision procedure (LLETZ / LEEP), laser excision, knife cone biopsy, laser cone biopsy, loop cone biopsy, and hysterectomy.", "Ablative methods: cryocautery, electrodiathermy, cold coagulation, and carbon dioxide laser."],
      connect: "CUT it out or DESTROY it. Cut: LLETZ or LEEP, cone biopsy (knife, laser or loop), and hysterectomy. Destroy: cryocautery, diathermy, cold coagulation, CO2 laser. Excision gives a specimen for histology.",
      detail: "CIN is graded 1 to 3 on histology. CIN 1 often regresses and is observed; CIN 2 and 3 are treated. See-and-treat uses LLETZ after colposcopy. Follow up after treatment with cytology and HPV testing.",
      slides: "p.323–333" },
    { n: 48, topic: "Labour", q: "List the requirements for a vaginal breech delivery.",
      a: ["Antepartum: frank breech presentation, gestational age above 34 weeks, estimated foetal weight of 2000–3500 g, flexed foetal head, no indication for C/S, normal clinical or radiological pelvimetry (inlet: transverse 11.5 cm, AP 10.5 cm).", "Intrapartum: normal progression of first and second stage, avoidance of induction or augmentation, avoidance of breech extraction, continuous electronic foetal monitoring, policy of non-interference until the breech is up to the umbilicus, early recourse to C/S, theatre and anaesthesia must be available, and informed consent."],
      connect: "Four F's before labour: Frank breech, Fit pelvis, Fetus 2 to 3.5 kilos, Flexed head. In labour: hands off until the umbilicus, no induction, no extraction, monitor, and keep theatre ready.",
      detail: "After the Term Breech Trial in 2000 most term breech babies are delivered by elective caesarean; vaginal breech needs strict criteria. Risks include cord prolapse, head entrapment, extended arms and birth trauma. Know the manoeuvres: Lovset's for the arms, and Mauriceau-Smellie-Veit or Burns-Marshall for the head.",
      slides: "" },
    { n: 49, topic: "Labour", q: "List the requirements for induction of labour.",
      a: ["Foetal lie must be longitudinal.", "Ensure adequate pelvis.", "Exclude previous uterine scar.", "There must be a clear indication.", "Contraindications must be excluded.", "Personnel skilled in C/S and facilities for C/S must be readily available.", "Perform a vaginal examination prior to commencement of oxytocin infusion.", "Monitor induction of labour as for a high-risk patient in active labour."],
      connect: "L-A-S-I-C: Longitudinal lie, Adequate pelvis, no Scar, Indication clear, Contraindications excluded; then CS cover, a vaginal exam before oxytocin (to check the cervix), and monitor as a high-risk labour. Induction is asked in about seven sittings.",
      detail: "Common indications are post-term pregnancy, PROM, pre-eclampsia, diabetes, IUGR and fetal death. Contraindications include placenta praevia, transverse lie, a previous classical caesarean, cord presentation and active genital herpes. Complications are hyperstimulation, fetal distress, uterine rupture and failed induction.",
      slides: "p.1371" },
    { n: 50, topic: "Obstetrics", q: "List the complications of teenage pregnancy.",
      a: ["During pregnancy: pre-eclampsia, eclampsia, anaemia, malaria, nutritional deficiency, threatened abortion, hyperemesis gravidarum, and a high incidence of abortion.", "During labour: high incidence of operative delivery, obstetric fistulae (VVF and RVF), obstructed labour, premature labour, and prolonged labour."],
      connect: "A young pelvis that has not finished growing: obstructed labour, then fistula. In pregnancy think of the first-baby diseases (pre-eclampsia, eclampsia), anaemia and malaria, poor nutrition, and abortion.",
      detail: "Teenage mothers have more preterm births, low birth weight babies and neonatal deaths. Social effects include school dropout, poverty and unsafe abortion; your slide p.390 links early sexual initiation to unintended pregnancy, STIs and unsafe abortion. Prevention is sexuality education and adolescent-friendly services.",
      slides: "p.300, 389–390" },
    { n: 51, topic: "Gynaecological surgery", q: "List the post-VVF (vesicovaginal fistula) repair instructions.",
      a: ["Nothing must pull on the catheter.", "Do not allow the catheter to be blocked or fall out.", "High fluid intake (4–5 L/day) to prevent concentrated urine.", "She must remain dry (periurethral area).", "Twice daily vulval washing is essential.", "Vaginal packing should be removed on day 2.", "Leave the catheter in for 10–14 days.", "Abstinence from sexual relationships for 3 months.", "Return for follow-up consultation.", "Antenatal care and hospital delivery are essential (caesarean section for all future pregnancies)."],
      connect: "Catheter, Fluids, Dry, Pack out, Sex off, Caesarean next time. Catheter for 10 to 14 days and never blocked or pulled; 4 to 5 litres of fluid; keep dry and wash twice a day; pack out on day 2; no sex for 3 months; caesarean for every future delivery. Same rules of counselling as after rectovaginal fistula repair.",
      detail: "Prolonged bladder drainage lets the repair heal without tension. Keep the catheter free-draining and continue antibiotics. Check for stress incontinence when it is removed. Most fistulae in Nigeria follow obstructed labour, so prevention is use of the partograph and timely caesarean section.",
      slides: "p.889–890" },
    { n: 52, topic: "Anaemia in pregnancy", q: "List ways of preventing anaemia in pregnancy.",
      a: ["Family planning and avoidance of early pregnancy", "Preconception care", "Antenatal care: malaria prophylaxis and haematinics", "Appropriate diet in pregnancy", "Fortification of staple foods with iron and folate", "Intensive health education at the community level", "Improvement of sanitation and health facilities"],
      connect: "F-P-A-D-F-H-S: Family planning, Preconception care, Antenatal haematinics and malaria prophylaxis, Diet, Fortification, Health education, Sanitation. Your anaemia lecture lists exactly these, ending with the triad poverty, illiteracy and ignorance.",
      detail: "Give daily iron, 30 to 60 milligrams, and folic acid from the first visit. Your slides name malaria prevention with intermittent preventive treatment and insecticide-treated nets (p.1043). Deworm in the second trimester, and treat sickle cell and other causes.",
      slides: "p.1042–1045" }

        ["Kussmaul breathing in a known diabetic proves DKA, so glucose and ketones need not be checked.", false, "Acidotic breathing also occurs in malaria and sepsis, and a diabetic child may be hypoglycaemic. Always check glucose and ketones (past paper paed.187)."],
      ]),
      explain: "The past-paper case: 5-year-old, polyphagia, polydipsia, bed-wetting, 10% weight loss, Kussmaul breathing. Expect glucose about 300 mg/dl, bicarbonate about 10 mmol/L, treat with IV fluids and insulin infusion in an HDU/ICU, not a general ward; calcium 11.8 mg/dl would NOT be expected." },

    { topic: "Diabetic ketoacidosis", src: S+" (ISPAD-style)",
      stem: "Management of DKA:",
      items: I([
        ["Start with airway, breathing and circulation; give a 10-20 ml/kg 0.9% saline bolus only if shocked, then replace the deficit steadily over about 48 hours.", true, "Slow rehydration lowers the risk of cerebral oedema."],
        ["Insulin infusion (0.05-0.1 unit/kg/hour) is started about an hour after fluids begin.", true, "Insulin switches off ketogenesis; fluids first."],
        ["Potassium is added to the IV fluids once urine is passing, unless the child is hyperkalaemic.", true, "Typically 40 mmol/L; monitor ECG and electrolytes."],
        ["Routine intravenous bicarbonate should be given in severe acidosis.", false, "Not recommended: it can worsen intracellular acidosis and hypokalaemia, and raise cerebral oedema risk."],
        ["Cerebral oedema occurs only before treatment and never after it is started.", false, "Typically 4-12 hours into treatment: headache, bradycardia, rising BP, falling GCS. Give mannitol (0.5-1 g/kg) or hypertonic saline and slow the fluids."],
      ]),
      explain: "Hourly glucose and neuro observations; electrolytes and blood gases every 2-4 h. Add dextrose to the fluid when glucose falls to about 14 mmol/L so insulin can continue. Transition to subcutaneous insulin when the child is eating and ketones have cleared." },

    { topic: "Hypoglycaemia", src: S+"; p.143-144",
      stem: "Hypoglycaemia in childhood:",
      items: I([
        ["Low blood glucose with detectable insulin and low ketones suggests hyperinsulinism.", true, "Insulin blocks fat breakdown, so no ketones (hypoketotic hypoglycaemia). Check the critical sample before treating if you can."],
        ["Ketotic hypoglycaemia is the commonest cause of fasting hypoglycaemia in well pre-school children.", true, "Small thin children; resolves by about 8-10 years."],
        ["Hypoglycaemia (under 2.2 mmol/L) is a recognised complication of severe malaria.", true, "Slide p.143. Cytokines reduce gluconeogenesis (p.144); quinine adds hyperinsulinism."],
        ["GH and cortisol deficiency can present with hypoglycaemia.", true, "Counter-regulatory hormones missing: hypopituitarism, Addison, CAH. Link p.50, 56."],
        ["The correct bolus for a hypoglycaemic child is 50% dextrose 2 ml/kg.", false, "Use 10% dextrose 2-5 ml/kg IV (25-50% is too hyperosmolar and damages veins). Past paper: 20-25 ml 'concentrated glucose' is not a safe test."],
      ]),
      explain: "Critical sample at the time of hypoglycaemia: glucose, insulin, cortisol, GH, ketones/BOHB, lactate, FFA, ammonia. Then the pattern of ketones and insulin sorts hyperinsulinism from hormone deficiency from metabolic disease." },

    { topic: "Hypoglycaemia", src: "p.174; paed.235, 897, 901",
      stem: "Neonatal hypoglycaemia:",
      items: I([
        ["It is common in small-for-gestational-age babies.", true, "Slide p.174: rapid depletion of glycogen stores and impaired gluconeogenesis."],
        ["It is rare in babies of diabetic mothers.", false, "COMMON: fetal hyperinsulinism after maternal hyperglycaemia, then the glucose supply is cut at birth."],
        ["Birth asphyxia, hypothermia and sepsis are recognised causes.", true, "Increased glucose use and poor stores."],
        ["Biliary atresia is a recognised cause.", false, "Not a cause. Genuine causes include Beckwith-Wiedemann (hyperinsulinism) and glycogen storage disease."],
        ["It carries a good prognosis with minimal treatment even when symptomatic.", false, "Symptomatic or prolonged hypoglycaemia can cause permanent brain injury: treat promptly (10% dextrose 2 ml/kg then an infusion)."],
      ]),
      explain: "Operational threshold: treat below about 2.6 mmol/L (47 mg/dl). Early feeding, skin-to-skin and glucose checks in at-risk babies (SGA, preterm, IDM) prevent most of it (slide p.174 lists hypoglycaemia among SGA and preterm problems)." },

    { topic: "Hypoglycaemia", src: S+"; p.59",
      stem: "Infant of a diabetic mother:",
      items: I([
        ["Macrosomia is typical.", true, "Fetal hyperinsulinism is anabolic."],
        ["Hypoglycaemia, hypocalcaemia and polycythaemia occur.", true, "Also jaundice and hypomagnesaemia."],
        ["Respiratory distress is more likely because surfactant production is delayed.", true, "Insulin antagonises cortisol's effect on lung maturation."],
        ["Congenital anomalies are increased: neural tube defects, TGA, VSD and imperforate anus.", true, "Slide p.59 (VACTERL-like pattern)."],
        ["The commonest problem in the first days is hyperglycaemia.", false, "Hypoglycaemia, not hyperglycaemia."],
      ]),
      explain: "Case from the past papers: a 37-week baby of a diabetic mother with early respiratory symptoms. Remember hypoglycaemia first, then RDS (ground-glass, air bronchograms), polycythaemia, and look for the cardiac and spinal anomalies." },

    { topic: "Thyroid disease", src: S+"; p.37, 41, 81; paed.186, 217, 224, 239",
      stem: "Congenital hypothyroidism: recognition",
      items: I([
        ["The commonest cause is thyroid dysgenesis (agenesis, hypoplasia or ectopic gland).", true, "About 85% in iodine-replete areas; iodine deficiency is the world's commonest cause overall."],
        ["Prolonged jaundice, constipation, poor feeding, lethargy and hypotonia are typical early features.", true, "Slide p.81 lists hypothyroidism under delayed stooling and neonatal cholestasis work-up."],
        ["Tachycardia and diarrhoea are typical.", false, "Bradycardia and constipation. (Past paper: 'tachycardia' was the false option.)"],
        ["Meconium ileus is a typical presentation.", false, "That is cystic fibrosis. Hypothyroidism gives delayed passage of meconium."],
        ["Wide-open fontanelles, macroglossia, umbilical hernia and cold mottled skin occur.", true, "Slide p.41: late closure of the anterior fontanelle; p.37 thyroid hormone drives fontanelle closure and brain development."],
      ]),
      explain: "Remember: Hypothyroid baby = prolonged jaundice, big tongue, hoarse cry, hernia, hypotonia, cold, dry skin. Retarded bone age (p.42); no distal femoral epiphysis on a term baby's knee X-ray." },

    { topic: "Thyroid disease", src: S,
      stem: "Congenital hypothyroidism: screening and treatment",
      items: I([
        ["Newborn screening uses a heel-prick TSH on about day 5, with a high TSH and low free T4 confirming it.", true, "Primary hypothyroidism: high TSH, low T4 (negative feedback, p.55)."],
        ["Levothyroxine (about 10-15 micrograms/kg/day) should be started in the first 2 weeks of life.", true, "Early treatment protects IQ."],
        ["The age at which treatment starts is the most important determinant of the child's eventual intelligence.", true, "Delayed treatment = intellectual disability, deafness, short stature, spasticity (cretinism)."],
        ["Untreated, it is usually fatal in infancy.", false, "Not usually lethal; the harm is severe and permanent neurodevelopmental disability and growth failure (past paper: 'usually lethal' was false)."],
        ["Treatment can be stopped at 1 year in all children once milestones are normal.", false, "Usually lifelong in permanent forms; only some transient forms (maternal antibodies, iodine) can be reassessed after 3 years."],
      ]),
      explain: "Why screening exists: the signs are subtle in the first weeks, but the brain window is narrow. Link: iodine deficiency and cretinism (slide p.59 lists iodine under 20 micrograms/day causing mental retardation, deafness, spastic diplegia)." },

    { topic: "Thyroid disease", src: S+"; p.42; paed.194, 230, 233",
      stem: "Juvenile (acquired) hypothyroidism in a 5-year-old:",
      items: I([
        ["Hashimoto (autoimmune) thyroiditis is the commonest cause in areas without iodine deficiency.", true, "Goitre is common; antithyroid peroxidase antibodies positive."],
        ["Short stature and a slow growth velocity are expected.", true, "Weight may rise as height falls: short and fat suggests endocrine disease."],
        ["Bradycardia, dry skin, constipation, cold intolerance and weight gain are expected.", true, "Slowed metabolism."],
        ["Bone age is advanced.", false, "RETARDED (slide p.42). Advanced bone age belongs to thyrotoxicosis, CAH, precocious puberty."],
        ["Full bounding pulse and warm tremulous hands are typical.", false, "Those are thyrotoxicosis."],
      ]),
      explain: "Rare paradox: severe untreated hypothyroidism can cause early breast or testicular enlargement (Van Wyk-Grumbach) even though bone age is delayed. Check TSH in any short child (slide p.46-47)." },

    { topic: "Thyroid disease", src: S+"; paed.38",
      stem: "A 10-year-old girl with a neck swelling and thyrotoxicosis (Graves disease):",
      items: I([
        ["Tachycardia, tremor, weight loss despite a good appetite and heat intolerance are expected.", true, "Hypermetabolism."],
        ["Linear growth may accelerate and the bone age is advanced.", true, "Slide p.42 lists thyrotoxicosis among causes of advanced bone age."],
        ["Exophthalmos is present in every case.", false, "Absent in many children; look for lid lag and stare."],
        ["Emergency thyroidectomy is the first-line treatment.", false, "Start antithyroid drugs (carbimazole/methimazole) plus propranolol; surgery or radioiodine is for relapse after a long course."],
        ["A sore throat or fever on carbimazole needs urgent stopping of the drug and a full blood count.", true, "Agranulocytosis."],
      ]),
      explain: "Graves disease is autoimmune (TSH-receptor stimulating antibodies). Neonatal thyrotoxicosis occurs when maternal antibodies cross the placenta. Heart failure is a rare severe complication, as in the past-paper options." },

    { topic: "Rickets", src: S+"; p.41; paed.190, 193, 250",
      stem: "Nutritional (vitamin D deficiency) rickets: findings",
      items: I([
        ["Serum phosphate is low.", true, "Secondary hyperparathyroidism wastes phosphate."],
        ["Serum alkaline phosphatase is raised.", true, "Osteoblast activity."],
        ["Serum calcium is always low.", false, "Low or low-normal: PTH keeps it near normal until late (past paper: 'always low' was false)."],
        ["Closure of the anterior fontanelle is delayed.", true, "Slide p.41 lists rickets among causes."],
        ["Hypertonia is characteristic.", false, "Hypotonia and proximal weakness (late walking, pot belly)."],
      ]),
      explain: "Mnemonic for the labs: calcium low-or-normal, phosphate LOW, ALP HIGH, PTH HIGH, 25-OH vitamin D LOW. Reverse every one of them for the past-paper trap options." },

    { topic: "Rickets", src: S+"; paed.40-43, 189, 199, 212, 226",
      stem: "Clinical and radiological features of rickets:",
      items: I([
        ["X-ray shows widened growth plates with cupping and fraying of the metaphyses.", true, "Wrist and knee are best."],

        ["In a bow-legged toddler breastfed for 8 months with recurrent chest infections, nutritional history, wrist X-ray and fontanelle examination are all relevant.", true, "Prolonged exclusive breast milk without vitamin D, and chest infections, point to rickets; Blount disease is the main differential."],
        ["Wedge osteotomy is the treatment of choice in the first year of life.", false, "Medical treatment first; osteotomy only for deformity persisting after healing, in an older child."],
        ["Vitamin D deficiency is a common cause of Blount disease.", false, "Blount disease is a growth disorder of the medial proximal tibia (early walkers, obesity); metabolic bone tests and wrist X-ray are normal."],
      ]),
      explain: "Rickets: widened wrists, bowed legs, rosary, craniotabes, frontal bossing, delayed dentition, pot belly, hypocalcaemic seizures. Blount: isolated bowed tibia with a beak at the medial metaphysis, normal ALP." },

    { topic: "Rickets", src: S+"; paed.197, 212, 231, 275",
      stem: "Causes and treatment of rickets:",
      items: I([
        ["Low dietary calcium is an important cause in Nigerian children despite plenty of sunlight.", true, "Cereal-based diets high in phytate; calcium alone can heal it."],

        ["The bone deformities of early rickets usually correct with medical treatment.", true, "Remodelling with growth. Deformities fixed in older children may need surgery."],
      ]),
      explain: "Hypocalcaemic tetany or seizures in an infant with rickets: IV 10% calcium gluconate. Renal rickets (CKD) and vitamin D resistance need active vitamin D (calcitriol) and phosphate; plain vitamin D will not do." },

    { topic: "Turner & chromosomal", src: S+"; p.41, 47-48, 199; paed.255, 268, 468, 990",
      stem: "Turner syndrome:",
      items: I([
        ["The usual karyotype is 45,X (or a mosaic), diagnosed by chromosome analysis.", true, "Slide p.48 (45,X); p.46 karyotype in the short-stature work-up."],
        ["Webbed neck, low posterior hairline, shield chest, cubitus valgus and lymphoedema of the hands and feet at birth are typical.", true, "See the picture test."],

        ["Coarctation of the aorta, bicuspid aortic valve and horseshoe kidney are associated.", true, "Slide p.199: horseshoe kidney is commoner in Turner syndrome."],

      ]),
      explain: "High-yield short-answer: short stature plus a webbed neck in a girl, plus a cardiac murmur. Karyotype, echocardiography and renal ultrasound, then GH and oestrogen. Slide p.264 adds that girls with Turner syndrome can develop Duchenne muscular dystrophy (X-linked recessive)." },

    { topic: "Turner & chromosomal", src: S+"; p.47, 48, 264; paed.255",
      stem: "Turner syndrome: management and links",
      items: I([
        ["Recombinant growth hormone is an approved treatment for the short stature.", true, "Slide p.47."],
        ["Oestrogen is needed to induce puberty and maintain secondary sexual characteristics.", true, "Slide p.48: girls with delayed puberty are given oestradiol."],
        ["Spontaneous fertility is the rule.", false, "Most are infertile (ovarian failure); donor-egg IVF is possible. Rare spontaneous pregnancy in mosaics."],
        ["Girls with Turner syndrome can be affected by X-linked recessive disease such as Duchenne muscular dystrophy.", true, "Slide p.264: only one X, so a recessive gene on it is expressed."],
        ["The risk rises sharply with maternal age, as in trisomy 21.", false, "No clear maternal-age effect; mostly a sporadic loss of a sex chromosome at meiosis or early mitosis."],
      ]),
      explain: "Turner (female, 45,X) versus Klinefelter (male, 47,XXY): both hypergonadotropic hypogonadism (p.48). Turner short, Klinefelter tall with small firm testes." },

    { topic: "Diabetes insipidus", src: "p.55-56, 237 (renal/electrolyte lecture); 2014.3, paed.1128",
      stem: "Diabetes insipidus (DI):",
      items: I([
        ["Central DI is due to deficiency of vasopressin (ADH) made in the hypothalamus.", true, "Slide p.55. Causes: craniopharyngioma, germinoma, histiocytosis X, head injury, neurosurgery (p.56)."],
        ["Polyuria, polydipsia and nocturia with dilute urine are typical.", true, "Low urine osmolality and specific gravity."],
        ["Fluid restriction produces a rising serum sodium and osmolality without concentrating the urine.", true, "The water-deprivation test. Desmopressin then concentrates the urine in central DI but not nephrogenic."],
        ["Glycosuria is expected.", false, "Glycosuria belongs to diabetes mellitus; in DI the urine is clear of sugar."],
        ["Nephrogenic DI responds to desmopressin.", false, "The kidney is resistant (often X-linked AVPR2); treat with fluids, thiazides and a low-salt diet."],
      ]),
      explain: "Slide p.237: DI = excess dilute urine from lack of ADH (central) or kidney resistance (nephrogenic: X-linked or AR primary; secondary to renal disease, low K, high Ca, lithium, demeclocycline); diagnosis by water deprivation test. ADH excess is the opposite: SIADH gives hyponatraemia with concentrated urine and is treated with fluid restriction (p.237). Slide p.56 says SIADH can follow craniopharyngioma surgery, so watch sodium both ways post-op." },

      stem: "A newborn with ambiguous genitalia:",
      items: I([
        ["CAH is strongly suspected, and the commonest finding is a virilised 46,XX baby.", true, "Slide p.49 (ambiguous genitalia in the newborn strongly suggests CAH). 21-hydroxylase deficiency is commonest."],
        ["The sex of rearing should be announced immediately before the baby leaves the delivery room.", false, "Do not assign sex until the multidisciplinary team has done karyotype, ultrasound and hormone tests, and parents are counselled."],
        ["The baby may deteriorate with vomiting, dehydration and shock at 1-3 weeks of life.", true, "Salt-wasting crisis; monitor sodium, potassium and glucose."],
        ["Karyotype, pelvic ultrasound, 17-hydroxyprogesterone and serum electrolytes are first-line tests.", true, "Slide p.50: raised 17-OHP, low bicarbonate, high potassium."],
        ["Ambiguous genitalia is a typical presentation of Turner syndrome.", false, "Turner girls have normal female external genitalia. Past paper options that ARE correct: CAH (21-hydroxylase) and pseudohermaphroditism."],
      ]),
      explain: "46,XX DSD: CAH. 46,XY DSD: androgen insensitivity, 5-alpha-reductase deficiency, defects of testosterone synthesis. Ovotesticular DSD and mixed gonadal dysgenesis make up the rest. Hydrocortisone and saline are life-saving." },
  ]

    { topic: "Diabetes mellitus", src: S+"; paed.220",

      stem: "Hypoglycaemia in the tropical child (malaria and malnutrition):",

      items: I([
        ["Rapid-acting analogues (lispro, aspart) start working within about 15 minutes and are given with or just before meals.", true, "Peak 1-2 h."],

      items: I([

        ["It lasts weeks to a year or two.", true, "Not permanent."],

    { topic: "Hypoglycaemia", src: S,
      stem: "Hypoglycaemia in a child with type 1 diabetes: recognition and treatment",

      stem: "Triggers and complications of hypoglycaemia:",

    { topic: "Diabetic ketoacidosis", src: S,

      items: I([

      ]),
      explain: "'Headache, slow pulse, high BP, falling GCS in a DKA child at hour 4-12 means brain swelling.' Nurse head-up, reduce fluid rate, hypertonic agent, then image once stable." },
