const PGROUPS=["Paediatric endocrinology","Infectious diseases"];
const PCOMING=["Neonatology","Nutrition & malnutrition","Haemato-oncology","Cardiology","Nephrology","Neurology","Gastroenterology"];
const TYPE_LABEL={cards:"Flashcards",mcq:"Multiple choice",essay:"Essays",fillgap:"Fill in the gap",tf:"True / False (5 stems each, negative marking)",pics:"Picture test (5 True / False per picture)"};
const TYPE_ORDER=["cards","mcq","tf","pics","fillgap","essay"];
const countOf=b=>b.type==="cards"?b.cards.length:b.type==="essay"?b.essays.length:b.questions.length;
const KEY="mbIII-resit-history-v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=h=>{try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}};
let S=null, tick=null;

const norm=s=>String(s||"").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9.%\- ]/g," ").replace(/\s+/g," ").trim();
const squash=s=>norm(s).replace(/[ \-]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function isCorrect(given,accepted){
  const g=squash(given); if(!g) return false;
  return accepted.some(a=>{const x=squash(a); if(g===x) return true;
    return x.length>=7 && /[a-z]/.test(x) && lev(g,x)<=Math.floor(x.length/6);});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

function ask(msg,yes){
  const o=document.createElement("div");o.className="modal";
  o.innerHTML=`<div class="sheet"><p>${esc(msg)}</p><div class="row"><button class="primary" id="ask-y">Yes</button><button id="ask-n">Cancel</button></div></div>`;
  document.body.appendChild(o);$("#ask-n").onclick=()=>o.remove();$("#ask-y").onclick=()=>{o.remove();yes()};
}

const srcOf=(s,subj)=>(/^p\./.test(s)?(subj==="Paediatrics"?"Paediatrics":"O&G")+" slides "+esc(s):esc(s)).replace(/Standard teaching/g,"<b>outside the slide</b> (standard teaching)").replace(/beyond the slides/g,"outside the slide");
const tfWhere=q=>{ if(q.pg===undefined) return `Source: ${srcOf(q.src,"Paediatrics")}`;
  const outs=q.items.map((it,k)=>it.o?"abcde"[k]:"").filter(Boolean);
  if(!q.pg) return "<b>Outside the slide</b>: standard teaching, not in the Paediatrics deck.";
  return `Paediatrics slides <b>${esc(q.pg)}</b>`+(outs.length?` · statement${outs.length>1?"s":""} ${outs.join(", ")}: <b>outside the slide</b> (standard teaching)`:" · every statement is answered in the slides");};
const tfTag=(q,k)=>{const it=q.items[k]; if(q.pg===undefined) return ""; return it.o?`<span class="meta"> · outside the slide</span>`:`<span class="meta"> · slide ${esc(q.pg)}</span>`};

function wire(){
  app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>start(+b.dataset.start,b.dataset.mode));
  app.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>tfStart(+b.dataset.tf,b.dataset.mode));
  app.querySelectorAll("[data-mcq]").forEach(b=>b.onclick=()=>mcqStart(+b.dataset.mcq,b.dataset.mode));
  app.querySelectorAll("[data-essay]").forEach(b=>b.onclick=()=>essayStart(+b.dataset.essay,+b.dataset.k));
  app.querySelectorAll("[data-cards]").forEach(b=>b.onclick=()=>startCards(+b.dataset.cards,b.dataset.all==="1"));
  app.querySelectorAll("[data-saq]").forEach(b=>b.onclick=()=>saqPage(+b.dataset.saq));
  app.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{curGroup=b.dataset.topic;topicPage()});
  const all=$("#all"); if(all) all.onclick=()=>{curGroup=null;root()};
  const rs=$("#reset"); if(rs) rs.onclick=()=>ask("Clear all saved results?",()=>{save([]);root()});
}
function home(){ curGroup?topicPage():root(); }
function root(){
  stopAudio(); clearInterval(tick); timerEl.hidden=true; S=null; scrollTo(0,0);
  const hist=load();
  const tile=g=>{const bs=banks.filter(b=>b.group===g),n=t=>bs.filter(b=>b.type===t).reduce((s,b)=>s+countOf(b),0);
    const bits=[["cards","flashcards"],["mcq","MCQs"],["tf","T/F stems"],["pics","pictures"],["fillgap","gap-fills"],["essay","essays"]].filter(([t])=>n(t)).map(([t,l])=>`${n(t)} ${n(t)===1?l.replace(/s$/,""):l}`).join(" · ");
    return `<button class="tile" data-topic="${esc(g)}"><b>${esc(g)}</b><span class="meta">${bits}</span></button>`};
  const feat=banks.map((b,i)=>[b,i]).filter(([b])=>b.type==="saq").map(([b,i])=>{const a=window.OG1_AUDIO;
    return `<button class="tile feature" data-saq="${i}"><b>${esc(b.group)}</b><span>${b.items.length} questions with answers, more detail and memory hooks${a?` · listen on the go: full lesson, quick hooks or test yourself, by topic`:""}</span></button>`}).join("");
  app.innerHTML=feat+`<div class="card"><h2 style="margin:0 0 4px">Obstetrics &amp; Gynaecology</h2>
   <div class="meta" style="margin-bottom:12px">Pick a topic, then choose what to practise.</div>
   <div class="tiles">${GROUPS.map(tile).join("")}</div></div>
   <div class="card"><h3 style="margin:0 0 6px">Still to come</h3><div class="meta">${COMING.map(esc).join(" · ")}</div></div>
   <div class="card"><h2 style="margin:0 0 4px">Paediatrics</h2>
   <div class="meta" style="margin-bottom:12px">True/False stems with negative marking, picture tests, essays.</div>
   <div class="tiles">${PGROUPS.map(tile).join("")}</div>
   <div class="meta" style="margin-top:12px">Still to come: ${PCOMING.map(esc).join(" · ")}</div></div>`+
   weakCard(hist)+histCard(hist);
  wire();
}
function topicPage(){
  stopAudio(); clearInterval(tick); timerEl.hidden=true; S=null; scrollTo(0,0);
  const g=curGroup,bs=banks.map((b,i)=>[b,i]).filter(([b])=>b.group===g).sort((x,y)=>TYPE_ORDER.indexOf(x[0].type)-TYPE_ORDER.indexOf(y[0].type));
  app.innerHTML=`<div class="row" style="margin:0 0 10px"><button id="all">← All topics</button></div>
   <div class="card"><h2 style="margin:0 0 4px">${esc(g)}</h2><div class="meta">Choose an activity.</div>${bs.map(([b,i])=>bankRow(b,i)).join("")}</div>`;
  wire();
}

function bankRow(b,i){
  if(b.type==="tf"||b.type==="pics"){const items=b.questions.reduce((n,q)=>n+q.items.length,0); return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${esc(b.title)} · ${b.questions.length} ${b.type==="pics"?"pictures":"stems"} · ${items} statements · ${b.negativeMarking?"−½ per wrong answer, 0 for blank":"no negative marking"}</div>
     <button class="primary" data-tf="${i}" data-mode="exam">Start timed exam</button>
     <button data-tf="${i}" data-mode="practice">Practice (check as you go)</button></div>`}
  if(b.type==="cards") return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${b.cards.length} cards · ${cardsMastered(b)} mastered</div>
     <button class="primary" data-cards="${i}" data-all="0">Study (weakest first)</button>
     <button data-cards="${i}" data-all="1">All cards, shuffled</button></div>`;
  if(b.type==="mcq") return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${b.questions.length} questions · ${b.negativeMarking?"negative marking":"no negative marking"} · options reshuffled each attempt</div>
     <button class="primary" data-mcq="${i}" data-mode="exam">Start timed exam</button>
     <button data-mcq="${i}" data-mode="practice">Practice (check as you go)</button></div>`;
  if(b.type==="essay") return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     ${b.essays.map((e,k)=>`<div class="meta" style="margin-top:6px">${esc(e.kind)} · ${esc(e.prompt.slice(0,90))}…</div><button class="primary" data-essay="${i}" data-k="${k}">Write &amp; self-mark</button>`).join("")}</div>`;
  return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${b.questions.length} questions · ${b.questions.reduce((n,q)=>n+q.blanks.length,0)} gaps · ${b.negativeMarking?"negative marking":"no negative marking"}</div>
     <button class="primary" data-start="${i}" data-mode="exam">Start timed exam</button>
     <button data-start="${i}" data-mode="practice">Practice (check as you go)</button></div>`;
}
function weakCard(h){
  const t={}; h.forEach(r=>r.topics&&Object.entries(r.topics).forEach(([k,v])=>{t[k]=t[k]||[0,0];t[k][0]+=v[0];t[k][1]+=v[1]}));
  const rows=Object.entries(t).map(([k,v])=>[k,v[0]/v[1],v[0],v[1]]).sort((a,b)=>a[1]-b[1]);
  if(!rows.length) return "";
  return `<div class="card"><h3 style="margin-top:0">Weak points (all attempts)</h3>`+rows.map(r=>`<div>${esc(r[0])} <span class="meta">${r[2]}/${r[3]} correct</span><div class="bar"><i style="width:${Math.round(r[1]*100)}%"></i></div></div>`).join("")+`</div>`;
}
function histCard(h){
  if(!h.length) return "";
  return `<div class="card"><h3 style="margin-top:0">History</h3><table><tr><th>Date</th><th>Paper</th><th>Score</th></tr>`+
   h.slice(-10).reverse().map(r=>`<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>${esc(r.title)}${r.mode==="practice"?" (practice)":""}</td><td>${r.got}/${r.max} (${Math.round(100*r.got/r.max)}%)</td></tr>`).join("")+
   `</table><div class="row"><button id="reset">Clear history</button></div></div>`;
}

function start(i,mode){
  const b=banks[i];
  S={b,mode,idx:0,ans:b.questions.map(q=>q.blanks.map(()=>"")),checked:b.questions.map(()=>false),start:Date.now(),limit:b.questions.length*60000};
  if(mode==="exam"){timerEl.hidden=false;tick=setInterval(()=>{const left=S.limit-(Date.now()-S.start);timerEl.textContent=fmt(left);if(left<=0){clearInterval(tick);finish()}},500)}
  else timerEl.hidden=true;
  render();
}
function qView(i){
  const q=S.b.questions[i];
  const parts=q.stem.split(/\{(\d+)\}/);
  let html="";
  parts.forEach((p,k)=>{ if(k%2===0) html+=esc(p); else { const n=+p-1; const checked=S.checked[i];
    if(checked){const ok=isCorrect(S.ans[i][n],q.blanks[n]); html+=`<span class="gapres ${ok?"ok":"bad"}">${esc(S.ans[i][n]||"—")}${ok?"":` <small>→ ${esc(q.blanks[n][0])}</small>`}</span>`}
    else html+=`<input class="gap" data-n="${n}" value="${esc(S.ans[i][n])}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="gap ${n+1}">`;}});
  return html;
}
function render(){
  const {b,idx}=S, q=b.questions[idx], practice=S.mode==="practice";
  app.innerHTML=`<div class="card"><div class="meta">Question ${idx+1} of ${b.questions.length} · ${esc(q.topic)}</div>
   <div class="stem">${qView(idx)}</div>
   <div class="src">📖 Find the answers: ${srcOf(q.src,b.subject)}</div>
   ${S.checked[idx]?`<div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div>`:""}
   <div class="row"><button id="prev" ${idx?"":"disabled"}>Back</button>
   ${practice&&!S.checked[idx]?`<button class="primary" id="check">Check</button>`:""}
   ${idx<b.questions.length-1?`<button class="primary" id="next">Next</button>`:`<button class="primary" id="fin">Finish</button>`}</div>
   <div class="dots">${b.questions.map((_,k)=>`<button class="dot ${k===idx?"cur":""} ${S.ans[k].some(Boolean)?"done":""}" data-go="${k}">${k+1}</button>`).join("")}</div></div>`;
  app.querySelectorAll("input.gap").forEach((el,k)=>{el.oninput=()=>S.ans[idx][+el.dataset.n]=el.value;
    el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const all=[...app.querySelectorAll("input.gap")];(all[k+1]||$("#check")||$("#next")||$("#fin"))?.focus?.()}}});
  const f=app.querySelector("input.gap"); if(f) f.focus();
  $("#prev").onclick=()=>{S.idx--;render()};
  if($("#next")) $("#next").onclick=()=>{S.idx++;render()};
  if($("#check")) $("#check").onclick=()=>{S.checked[idx]=true;render()};
  if($("#fin")) $("#fin").onclick=()=>{ if(S.mode==="exam"){const un=S.ans.filter(a=>!a.some(Boolean)).length; if(un){ask(un+" question(s) unanswered. Submit anyway?",finish);return}} finish()};
  app.querySelectorAll("[data-go]").forEach(d=>d.onclick=()=>{S.idx=+d.dataset.go;render()});
}
function finish(){
  clearInterval(tick); timerEl.hidden=true;
  S.over={}; // manual overrides "mark correct": key "q-n"
  results(true);
}
function score(){
  let got=0,max=0; const topics={};
  S.b.questions.forEach((q,i)=>q.blanks.forEach((acc,n)=>{max++; const ok=S.over[i+"-"+n]!==undefined?S.over[i+"-"+n]:isCorrect(S.ans[i][n],acc); if(ok){got++}
    const t=topics[q.topic]=topics[q.topic]||[0,0]; t[1]++; if(ok)t[0]++;}));
  return {got,max,topics};
}
function results(first){
  const sc=score(), pct=Math.round(100*sc.got/sc.max);
  if(first){const h=load();h.push({date:Date.now(),title:S.b.title,mode:S.mode,got:sc.got,max:sc.max,topics:sc.topics});save(h);S.saved=h.length-1}
  else{const h=load(); if(h[S.saved]){Object.assign(h[S.saved],{got:sc.got,topics:sc.topics});save(h)}}
  const weak=Object.entries(sc.topics).filter(([_,v])=>v[0]<v[1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  app.innerHTML=`<div class="card"><div class="meta">${esc(S.b.title)} · ${S.mode==="exam"?"time used "+fmt(Date.now()-S.start):"practice"}</div>
   <div class="score">${sc.got} / ${sc.max} <span style="font-size:18px;color:var(--mute)">(${pct}%)</span></div>
   ${weak.length?`<p><b>Revise first:</b> ${weak.map(([k,v])=>`${esc(k)} (${v[0]}/${v[1]})`).join(" · ")}</p>`:`<p>Clean sweep.</p>`}
   <div class="row"><button class="primary" id="home">Back to topic</button><button id="retry">Retake</button></div></div>`+
   S.b.questions.map((q,i)=>`<div class="card"><div class="meta">Q${i+1} · ${esc(q.topic)}</div><div class="stem">${
     q.stem.split(/\{(\d+)\}/).map((p,k)=>{ if(k%2===0)return esc(p); const n=+p-1,key=i+"-"+n; const auto=isCorrect(S.ans[i][n],q.blanks[n]); const ok=S.over[key]!==undefined?S.over[key]:auto;
       return `<span class="gapres ${ok?"ok":"bad"}">${esc(S.ans[i][n]||"—")}${auto?"":` <small>→ ${esc(q.blanks[n][0])}</small>`}</span>${auto?"":`<label class="toggle"><input type="checkbox" data-ov="${key}" ${ok?"checked":""}> I was right</label>`}`}).join("")
   }</div><div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div></div>`).join("");
  $("#home").onclick=home; $("#retry").onclick=()=>start(banks.indexOf(S.b),S.mode);
  app.querySelectorAll("[data-ov]").forEach(c=>c.onchange=()=>{S.over[c.dataset.ov]=c.checked; const y=scrollY; results(false); scrollTo(0,y)});
  scrollTo(0,0);
}
// ---------- single-best-option MCQ ----------
function mcqStart(bi,mode){
  const b=banks[bi];
  const perm=b.questions.map(q=>q.options.map((_,i)=>i).sort(()=>Math.random()-.5)); // perm[q][shownPos]=originalIdx
  S={mcq:true,b,mode,idx:0,perm,pick:b.questions.map(()=>null),checked:b.questions.map(()=>false),start:Date.now(),limit:b.questions.length*60000};
  if(mode==="exam"){timerEl.hidden=false;tick=setInterval(()=>{const left=S.limit-(Date.now()-S.start);timerEl.textContent=fmt(left);if(left<=0){clearInterval(tick);mcqFinish()}},500)}
  else timerEl.hidden=true;
  mcqRender();
}
function mcqRender(){
  const {b,idx,perm}=S,q=b.questions[idx],L="ABCDE",shown=S.checked[idx];
  app.innerHTML=`<div class="card"><div class="meta">Question ${idx+1} of ${b.questions.length} · ${esc(q.topic)}</div>
   <div class="stem" style="line-height:1.5">${esc(q.stem)}</div>
   <div class="src" style="margin-top:4px">📖 Find the answer: ${srcOf(q.src,b.subject)}</div>
   <div style="margin-top:12px">${perm[idx].map((o,pos)=>{const sel=S.pick[idx]===pos,right=o===q.answer;
     const st=shown?(right?"background:var(--okbg);border-color:var(--ok)":(sel?"background:var(--badbg);border-color:var(--bad)":"")):(sel?"background:color-mix(in srgb,var(--accent) 15%,var(--card));border-color:var(--accent)":"");
     return `<button class="opt" data-pos="${pos}" style="display:block;width:100%;text-align:left;margin:6px 0;${st}" ${shown?"disabled":""}><b>${L[pos]}.</b> ${esc(q.options[o])}</button>`}).join("")}</div>
   ${shown?`<div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div>`:""}
   <div class="row"><button id="prev" ${idx?"":"disabled"}>Back</button>
   ${S.mode==="practice"&&!shown?`<button class="primary" id="check" ${S.pick[idx]===null?"disabled":""}>Check</button>`:""}
   ${idx<b.questions.length-1?`<button class="primary" id="next">Next</button>`:`<button class="primary" id="fin">Finish</button>`}</div>
   <div class="dots">${b.questions.map((_,k)=>`<button class="dot ${k===idx?"cur":""} ${S.pick[k]!==null?"done":""}" data-go="${k}">${k+1}</button>`).join("")}</div></div>`;
  app.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{S.pick[idx]=+o.dataset.pos;mcqRender()});
  $("#prev").onclick=()=>{S.idx--;mcqRender()};
  if($("#next")) $("#next").onclick=()=>{S.idx++;mcqRender()};
  if($("#check")) $("#check").onclick=()=>{S.checked[idx]=true;mcqRender()};
  if($("#fin")) $("#fin").onclick=()=>{const un=S.pick.filter(p=>p===null).length; if(S.mode==="exam"&&un){ask(un+" unanswered. Submit anyway?",mcqFinish);return} mcqFinish()};
  app.querySelectorAll("[data-go]").forEach(d=>d.onclick=()=>{S.idx=+d.dataset.go;mcqRender()});
}
function mcqFinish(){
  clearInterval(tick);timerEl.hidden=true;
  const {b,perm,pick}=S,L="ABCDE",topics={};let got=0,pen=0;
  b.questions.forEach((q,i)=>{const ok=pick[i]!==null&&perm[i][pick[i]]===q.answer; if(ok)got++; else if(pick[i]!==null&&b.negativeMarking)pen+=.5;
    const t=topics[q.topic]=topics[q.topic]||[0,0];t[1]++;if(ok)t[0]++});
  const net=got-pen, max=b.questions.length;
  const h=load();h.push({date:Date.now(),title:b.title,mode:S.mode,got:net,max,topics});save(h);
  const weak=Object.entries(topics).filter(([_,v])=>v[0]<v[1]);
  app.innerHTML=`<div class="card"><div class="meta">${esc(b.title)} · ${S.mode==="exam"?"time used "+fmt(Date.now()-S.start):"practice"}</div>
   <div class="score">${net} / ${max} <span style="font-size:18px;color:var(--mute)">(${Math.round(100*net/max)}%)</span></div>
   ${weak.length?`<p><b>Revise first:</b> ${weak.map(([k,v])=>`${esc(k)} (${v[0]}/${v[1]})`).join(" · ")}</p>`:"<p>Clean sweep.</p>"}
   <div class="row"><button class="primary" id="home">Back to topic</button><button id="retry">Retake</button></div></div>`+
   b.questions.map((q,i)=>{const p=pick[i],ok=p!==null&&perm[i][p]===q.answer,correctPos=perm[i].indexOf(q.answer);
     return `<div class="card"><div class="meta">Q${i+1} · ${esc(q.topic)} · <b style="color:var(--${ok?"ok":"bad"})">${ok?"correct":(p===null?"not answered":"wrong")}</b></div>
     <div class="stem" style="line-height:1.5">${esc(q.stem)}</div>
     <p>Your answer: <b>${p===null?"—":L[p]+". "+esc(q.options[perm[i][p]])}</b><br>Correct: <b>${L[correctPos]}. ${esc(q.options[q.answer])}</b></p>
     <div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div></div>`}).join("");
  $("#home").onclick=home;$("#retry").onclick=()=>mcqStart(banks.indexOf(b),S.mode);scrollTo(0,0);
}


// ---------- True/False stems (5 statements each, negative marking) and picture tests ----------
function tfStart(bi,mode){
  const b=banks[bi], per=b.secPerQ||(b.type==="pics"?90:120);
  S={tf:true,b,mode,idx:0,ans:b.questions.map(q=>q.items.map(()=>null)),checked:b.questions.map(()=>false),start:Date.now(),limit:b.questions.length*per*1000};
  if(mode==="exam"){timerEl.hidden=false;tick=setInterval(()=>{const left=S.limit-(Date.now()-S.start);timerEl.textContent=fmt(left);if(left<=0){clearInterval(tick);tfFinish()}},500)}
  else timerEl.hidden=true;
  tfRender();
}
const tfPts=(a,key,neg)=>a===null?0:(a===key?1:(neg?-.5:0));
function tfRows(q,ans,reveal,neg){
  return q.items.map((it,k)=>{const a=ans[k],right=a!==null&&a===it.a;
    const btn=(v,l)=>{const on=a===v, st=on?(reveal?(right?"background:var(--okbg);border-color:var(--ok)":"background:var(--badbg);border-color:var(--bad)"):"background:color-mix(in srgb,var(--accent) 18%,var(--card));border-color:var(--accent)"):"";
      return `<button class="tfb" data-k="${k}" data-v="${v}" style="min-width:64px;${st}" ${reveal?"disabled":""}>${l}</button>`};

  app.querySelectorAll("[data-go]").forEach(d=>d.onclick=()=>{S.idx=+d.dataset.go;tfRender();scrollTo(0,0)});

function tfFinish(){
  clearInterval(tick);timerEl.hidden=true;
  const {b,ans}=S,neg=b.negativeMarking,topics={};let net=0,right=0,wrong=0,blank=0;
  b.questions.forEach((q,i)=>q.items.forEach((it,k)=>{const a=ans[i][k],ok=a!==null&&a===it.a;

   ${weak.length?`<p><b>Revise first:</b> ${weak.map(([k,v])=>`${esc(k)} (${v[0]}/${v[1]})`).join(" · ")}</p>`:"<p>Clean sweep.</p>"}
   <div class="row"><button class="primary" id="home">Back to topic</button><button id="retry">Retake</button></div></div>`+
   b.questions.map((q,i)=>`<div class="card"><div class="meta">${b.type==="pics"?"Picture":"Stem"} ${i+1} · ${esc(q.topic)}</div>
     ${q.img?`<img src="${esc(q.img)}" alt="" style="max-width:100%;max-height:220px;display:block;margin:0 auto 10px;border-radius:8px;background:#fff" referrerpolicy="no-referrer">`:""}
     <div class="stem" style="line-height:1.5"><b>${esc(q.stem)}</b></div><div class="src" style="margin-top:4px">📖 Find the answers: ${tfWhere(q)}</div>${tfRows(q,ans[i],true,neg)}

// ---------- O/G 1 Questions: every question, answer and memory hook, with audio ----------
const SKEY="mbIII-resit-saq-known-v1", PKEY="mbIII-og1-pos-v2", MKEY="mbIII-og1-choice-v2";
const kload=()=>{try{return JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){return{}}};
const ksave=o=>{try{localStorage.setItem(SKEY,JSON.stringify(o))}catch(e){}};
const jload=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const jsave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let aud=null, sleepT=null;
function stopAudio(){ if(sleepT){clearTimeout(sleepT);sleepT=null} if(aud){try{aud.pause()}catch(e){} aud=null} }
const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function ansLine(s){const m=s.match(/^([^:]{2,36}):\s+(.+)$/);return m?`<b>${esc(m[1])}:</b> ${esc(m[2])}`:esc(s)}
function saqPage(bi){

  const chips=()=>A.tracks.map(t=>{const f=A.files[mode+"/"+t.id];return f?`<button class="chip-btn${t.id===trackId?" on":""}" data-track="${t.id}">${esc(t.label)}<small>${Math.round(f.total/60)} min · ${t.qs.length} Qs</small></button>`:""}).join("");
  app.innerHTML=`<div class="row" style="margin:0 0 10px"><button id="all">← All topics</button></div>
   <div class="card"><h2 style="margin:0 0 4px">${esc(b.group)}</h2>
    <div class="meta">All ${b.items.length} questions from the shared document, with the answer, more detail and a hook to remember it. <span id="kcount"></span></div></div>
   ${A?`<div class="card"><h3 style="margin:0 0 8px">Listen</h3>
     <div class="seg" id="modes">${A.modes.map(m=>`<button data-mode="${m.id}">${esc(m.label)}</button>`).join("")}</div>
     <div class="meta" id="mhint" style="margin:6px 0 10px"></div>
     <div class="chips" id="tracks"></div></div>
    <div class="card player" id="player"><div class="meta nowline" id="now">Pick a playlist, then press play.</div>
     <div class="row" style="margin:6px 0 0;align-items:center;flex-wrap:nowrap">
      <button id="prev" aria-label="Previous question">⏮</button><button class="primary" id="play" style="flex:1 1 auto">▶ Play</button><button id="next" aria-label="Next question">⏭</button>
      <select id="rate" aria-label="Speed"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></div>
     <input type="range" id="seek" min="0" max="100" value="0" style="width:100%;margin:8px 0 0" aria-label="Position in the audio">
     <div class="meta" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span id="tm"></span>
      <details><summary>More</summary><div class="row" style="margin:6px 0 0;align-items:center"><button id="b15" aria-label="Back 15 seconds">−15s</button><button id="f15" aria-label="Forward 15 seconds">+15s</button>
      <label class="toggle"><input type="checkbox" id="loop"> repeat this question</label>
      <label class="toggle"><input type="checkbox" id="follow" checked> follow along</label>
      <label class="toggle">sleep timer <select id="sleep"><option value="0">off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></label></div><div class="meta" id="sleepnote"></div></details></div></div>`:""}
   <div class="card"><div class="row" style="margin:0;align-items:center">
     <input id="q" type="search" placeholder="Search questions or answers…" style="flex:1 1 200px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">
     <select id="topic" aria-label="Topic"><option value="">All topics</option>${topics.map(t=>`<option>${esc(t)}</option>`).join("")}</select>
     <label class="toggle"><input type="checkbox" id="hide"> hide answers (test yourself)</label>
     <label class="toggle"><input type="checkbox" id="onlynew"> only ones I don't know yet</label></div></div>
   <div id="list"></div>`;
  $("#all").onclick=()=>{curGroup=null;root()};
  const draw=()=>{
    const tp=$("#topic").value, qq=query.toLowerCase();
    const shown=b.items.filter(it=>(!tp||it.topic===tp)&&(!qq||(it.q+" "+it.a.join(" ")+" "+it.connect+" "+(it.detail||"")).toLowerCase().includes(qq))&&(!onlyNew||!known.includes(it.n)));

    $("#list").innerHTML=shown.length?shown.map(it=>`<div class="card qcard${nowN===it.n?" playing":""}" id="q${it.n}" data-n="${it.n}">
      <div class="meta"><span class="num">${it.n}</span> <span class="chip">${esc(it.topic)}</span></div>
      <div class="stem" style="line-height:1.4;font-size:18px"><b>${esc(it.q)}</b></div>
      <div class="ans"${hide?" hidden":""}><ul class="pts">${it.a.map(p=>`<li>${ansLine(p)}</li>`).join("")}</ul>
       ${it.detail?`<div class="detail"><b>More detail:</b> ${esc(it.detail)}</div>`:""}
       <div class="explain hook"><b>How to remember it:</b> ${esc(it.connect)}</div>
       ${it.note?`<div class="explain warn"><b>Check:</b> ${esc(it.note)}</div>`:""}
       ${it.slides?`<div class="src">Your slides: ${esc(it.slides)}</div>`:""}</div>
      <div class="row" style="margin-top:10px;align-items:center">${A?`<button data-play="${it.n}">▶ Listen from here</button>`:""}
       ${hide?`<button data-reveal="${it.n}">Show answer</button>`:""}
       <label class="toggle"><input type="checkbox" data-know="${it.n}" ${known.includes(it.n)?"checked":""}> I know this</label></div></div>`).join(""):`<div class="card meta">No questions match.</div>`;
    app.querySelectorAll("[data-know]").forEach(c=>c.onchange=()=>{const n=+c.dataset.know,i=known.indexOf(n);if(c.checked&&i<0)known.push(n);if(!c.checked&&i>=0)known.splice(i,1);
      const all=kload();all[b.id]=known;ksave(all);$("#kcount").textContent=`You marked ${known.length} of ${b.items.length} as known.`});
    app.querySelectorAll("[data-reveal]").forEach(x=>x.onclick=()=>{x.closest(".qcard").querySelector(".ans").hidden=false;x.remove()});

  };
  let playQuestion=()=>{};
  if(A){
    const $p=id=>document.getElementById(id);
    const posKey=()=>mode+"/"+trackId;
    const idxAt=t=>{const st=meta.starts;let lo=0,hi=st.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(st[m]<=t)lo=m;else hi=m-1}return lo};
    const paintChoice=()=>{ app.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on",x.dataset.mode===mode));
      $p("mhint").textContent=A.modes.find(m=>m.id===mode).hint+" · voices: "+A.voices.main+" and "+A.voices.hook;
      $p("tracks").innerHTML=chips(); app.querySelectorAll("[data-track]").forEach(x=>x.onclick=()=>choose(mode,x.dataset.track,true)); };
    const mediaMeta=()=>{try{if("mediaSession" in navigator&&curPos>=0){const n=track.qs[curPos];navigator.mediaSession.metadata=new MediaMetadata({title:`Q${n}. ${b.items[n-1].q}`,artist:`O/G 1 · ${A.modes.find(m=>m.id===mode).label}`,album:track.label})}}catch(e){}};

      if(loop&&i!==loopPos){ aud.currentTime=meta.starts[loopPos]; return }
      if(i!==curPos){curPos=i; const n=track.qs[i]; $p("now").textContent=`Q${n}. ${b.items[n-1].q}`; mediaMeta();

        const c=document.getElementById("q"+n); if(c){c.classList.add("playing"); if(follow&&!aud.paused)c.scrollIntoView({behavior:"smooth",block:"center"})}}

    // load a mode/playlist; keep the same question (or start n) when the new file contains it
    function choose(m,tid,auto,startN){
      const wasPlaying=aud&&!aud.paused, nowN=startN||(track&&curPos>=0?track.qs[curPos]:0);
      if(m==="test"&&tid==="all")tid=(A.tracks.find(t=>t.qs.includes(nowN)&&t.id!=="all")||A.tracks[1]).id;
      mode=m; trackId=tid; jsave(MKEY,{mode,track:trackId});
      track=A.tracks.find(t=>t.id===trackId); meta=A.files[mode+"/"+trackId]; curPos=-1; paintChoice();
      if(aud){try{aud.pause()}catch(e){}}

      $p("seek").max=Math.floor(meta.total); const saved=jload(PKEY,{})[posKey()]||0;
      const startAt=nowN&&track.qs.includes(nowN)?meta.starts[track.qs.indexOf(nowN)]:(auto?0:saved);
      aud.addEventListener("loadedmetadata",()=>{ if(startAt>0)aud.currentTime=startAt; mark(); if(auto||wasPlaying||startN)aud.play().catch(()=>{}); });
      aud.addEventListener("timeupdate",()=>{mark(); if(Math.floor(aud.currentTime)%5===0){const p=jload(PKEY,{});p[posKey()]=Math.floor(aud.currentTime);jsave(PKEY,p)}});
      aud.addEventListener("play",()=>{$p("play").textContent="❚❚ Pause"; if("mediaSession" in navigator)navigator.mediaSession.playbackState="playing"});
      aud.addEventListener("pause",()=>{$p("play").textContent="▶ Play"; if("mediaSession" in navigator)navigator.mediaSession.playbackState="paused"});
      aud.addEventListener("ended",()=>{$p("play").textContent="▶ Play"});
      aud.addEventListener("error",()=>{$p("now").textContent="The audio could not be loaded. Check your connection and try again."});
      $p("now").textContent=`${A.modes.find(x=>x.id===mode).label} · ${track.label}`; draw();
    }
    playQuestion=n=>{ const inTrack=track.qs.includes(n); const tid=inTrack?trackId:(mode==="test"?(A.tracks.find(t=>t.id!=="all"&&t.qs.includes(n)).id):"all"); choose(mode,tid,false,n); loopPos=(A.tracks.find(t=>t.id===trackId)).qs.indexOf(n); };

    $p("rate").onchange=e=>{aud.playbackRate=+e.target.value}; $p("follow").onchange=e=>{follow=e.target.checked};
    $p("loop").onchange=e=>{loop=e.target.checked; if(loop)loopPos=Math.max(0,curPos)};
    $p("sleep").onchange=e=>{ if(sleepT){clearTimeout(sleepT);sleepT=null} const m=+e.target.value; $p("sleepnote").textContent="";
      if(m){sleepT=setTimeout(()=>{if(aud)aud.pause();$p("sleepnote").textContent="Paused by the sleep timer."},m*60000);$p("sleepnote").textContent=`Will pause in ${m} minutes.`} };
    app.querySelectorAll("#modes button").forEach(x=>x.onclick=()=>choose(x.dataset.mode,trackId,false));
    try{ if("mediaSession" in navigator){const ms=navigator.mediaSession;
      ms.setActionHandler("play",()=>aud&&aud.play()); ms.setActionHandler("pause",()=>aud&&aud.pause());
      ms.setActionHandler("previoustrack",prev); ms.setActionHandler("nexttrack",next);
      ms.setActionHandler("seekbackward",()=>{aud.currentTime=Math.max(0,aud.currentTime-15)}); ms.setActionHandler("seekforward",()=>{aud.currentTime+=15});} }catch(e){}
    choose(mode,trackId,false);
  }
  $("#q").oninput=e=>{query=e.target.value;draw()}; $("#topic").onchange=draw;
  $("#hide").onchange=e=>{hide=e.target.checked;draw()}; $("#onlynew").onchange=e=>{onlyNew=e.target.checked;draw()};

}

const CKEY="mbIII-resit-cards-v1";
const cload=()=>{try{return JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){return{}}};
const csave=o=>{try{localStorage.setItem(CKEY,JSON.stringify(o))}catch(e){}};
const cid=(b,i)=>b.id+":"+i;
function cardsMastered(b){const m=cload();return b.cards.filter((_,i)=>(m[cid(b,i)]||{}).streak>=2).length+"/"+b.cards.length}
function startCards(bi,all){
  const b=banks[bi],m=cload();
  let order=b.cards.map((_,i)=>i).sort(()=>Math.random()-.5);
  if(!all) order.sort((x,y)=>((m[cid(b,x)]||{}).streak||0)-((m[cid(b,y)]||{}).streak||0));
  S={cards:true,b,bi,all,queue:order,pos:0,missed:[],got:0,revealed:false,typed:""};
  renderCard();
}
function renderCard(){
  const {b,queue,pos}=S;
  if(pos>=queue.length) return cardsDone();
  const c=b.cards[queue[pos]];
  app.innerHTML=`<div class="card"><div class="meta">Card ${pos+1} of ${queue.length} · ${esc(c.topic)}</div>
   <div class="stem" style="line-height:1.5">${esc(c.q)}</div>
   ${S.revealed?`<div class="explain" style="margin-top:14px"><b>Answer:</b> ${esc(c.a)}</div>
     ${S.typed?`<div class="src">You wrote: ${esc(S.typed)}</div>`:""}
     <div class="explain"><b>Connect it:</b> ${esc(c.connect)}</div>
     <div class="src">Source: ${esc(c.src)}${c.extra?" · <b>outside the slide</b>":""}</div>
     <div class="row"><button class="primary" id="got">I had it all</button><button id="miss">I missed something</button></div>`
   :`<textarea id="typed" rows="3" placeholder="Say or type your answer from memory first…" style="width:100%;margin-top:14px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">${esc(S.typed)}</textarea>
     <div class="row"><button class="primary" id="rev">Reveal answer</button></div>`}
   <div class="bar" style="margin-top:16px"><i style="width:${Math.round(100*pos/queue.length)}%"></i></div></div>`;
  if(S.revealed){$("#got").onclick=()=>rate(true);$("#miss").onclick=()=>rate(false)}
  else{const t=$("#typed");t.focus();t.oninput=()=>S.typed=t.value;$("#rev").onclick=()=>{S.typed=t.value;S.revealed=true;renderCard()}}
}
function rate(ok){
  const {b,queue,pos}=S,i=queue[pos],m=cload(),k=cid(b,i),r=m[k]||{streak:0,seen:0};
  r.seen++; r.streak=ok?r.streak+1:0; m[k]=r; csave(m);
  if(ok)S.got++; else S.missed.push(i);
  S.pos++;S.revealed=false;S.typed="";renderCard();
}
function cardsDone(){
  const {b,queue,missed,got}=S, byTopic={};
  missed.forEach(i=>{const t=b.cards[i].topic;byTopic[t]=(byTopic[t]||0)+1});
  const pct=Math.round(100*got/queue.length);
  app.innerHTML=`<div class="card"><div class="meta">${esc(b.title)}</div>
   <div class="score">${got} / ${queue.length} <span style="font-size:18px;color:var(--mute)">(${pct}%)</span></div>
   <p>${missed.length?`<b>Missed:</b> ${Object.entries(byTopic).map(([k,v])=>`${esc(k)} (${v})`).join(" · ")}`:"Every card recalled. Come back tomorrow to confirm it stuck."}</p>
   <p class="meta">A card counts as mastered after two clean recalls in a row, so re-test it on a different day.</p>
   <div class="row">${missed.length?`<button class="primary" id="drill">Drill the ${missed.length} missed</button>`:""}<button id="home">Back to topic</button></div></div>`;
  $("#home").onclick=home;
  if($("#drill")) $("#drill").onclick=()=>{S={...S,queue:missed.slice().sort(()=>Math.random()-.5),pos:0,missed:[],got:0,revealed:false,typed:""};renderCard()};
}

home();
})();

</script>
