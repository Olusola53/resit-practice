<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Resit Exam Practice</title><meta name="description" content="MBBS III resit practice: O&G fill-in-the-gap, MCQs, flashcards and self-marked essays."></head><body><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#5d6672;--line:#dde1e6;--accent:#1f6feb;--ok:#18794e;--okbg:#e6f6ee;--bad:#b42318;--badbg:#fdecea;--scrim:rgba(20,24,30,.45)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--card:#1b2027;--ink:#e8ebef;--mute:#9aa4b0;--line:#2c333c;--accent:#5b9bff;--ok:#4cc38a;--okbg:#14301f;--bad:#ff7b72;--badbg:#3a1a18;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151a;--card:#1b2027;--ink:#e8ebef;--mute:#9aa4b0;--line:#2c333c;--accent:#5b9bff;--ok:#4cc38a;--okbg:#14301f;--bad:#ff7b72;--badbg:#3a1a18;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,system-ui,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0}
#timer{font-variant-numeric:tabular-nums;font-weight:600}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.meta{color:var(--mute);font-size:13px;margin-bottom:8px}
.stem{font-size:18px;line-height:2.1}
input.gap{font:inherit;width:9em;padding:2px 8px;border:0;border-bottom:2px solid var(--accent);background:transparent;color:var(--ink);text-align:center;outline:none}
input.gap:focus{background:color-mix(in srgb,var(--accent) 10%,transparent)}
button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dot{width:30px;height:30px;padding:0;font-size:13px;border-radius:6px}
.dot.done{background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.dot.cur{outline:2px solid var(--accent)}
.score{font-size:34px;font-weight:700}
.gapres{display:inline-block;border-radius:6px;padding:0 8px;margin:0 2px;font-weight:600}
.gapres.ok{background:var(--okbg);color:var(--ok)}
.gapres.bad{background:var(--badbg);color:var(--bad)}
.gapres small{font-weight:400;opacity:.85}
.explain{border-left:3px solid var(--accent);padding:4px 12px;margin-top:10px;color:var(--ink)}
.src{color:var(--mute);font-size:13px;margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px}
.bar>i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
label.toggle{font-size:13px;color:var(--mute);cursor:pointer}
header{top:env(safe-area-inset-top,0px)}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%}
button{min-height:42px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main,.card,.stem,.explain{min-width:0;overflow-wrap:anywhere}
table{display:block;overflow-x:auto}
@media (max-width:520px){
  main{padding:12px 16px}
  .stem{font-size:17px;line-height:2}
  input.gap{width:7.5em}
  .row button{flex:1 1 auto}
  .dot{width:36px;height:36px}
}
.opt:disabled{opacity:1;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:76px;background:var(--bg)}
.tile:hover,.tile:focus-visible{border-color:var(--accent)}
.tile b{font-size:16px}

<script>
// O&G · Flashcards · Antepartum haemorrhage.
// The supplied slide deck has NO APH lecture; standard teaching shaped by past papers. src names a slide page only where the deck mentions the point.
window.QUESTION_BANKS = (window.QUESTION_BANKS || []).concat([{
  id: "og-cards-aph",
  subject: "O&G",
  group: "Antepartum haemorrhage",
  type: "cards",
  title: "O&G Flashcards · Antepartum haemorrhage",
  cards: [
    { topic: "Basics", src: "p.497, 170",
      q: "Define antepartum haemorrhage (APH) and give its incidence.",
      a: "Bleeding from the genital tract after the age of viability (28 weeks in Nigeria; 24 weeks in the UK) and before delivery of the baby. Complicates about 3–5% of pregnancies.",
      connect: "Before viability it is abortion; after delivery it is PPH. Vaginal bleeding is the first of the danger signs of pregnancy on your ANC slide (p.143)." },
    { topic: "Basics", src: "Standard teaching",
      q: "List the causes of antepartum haemorrhage (past paper: 'Causes of APH').",
      a: "Placenta praevia (about a third), abruptio placentae (about a third), and the rest unclassified or 'incidental': cervicitis, ectropion, cervical polyp or carcinoma, vaginal and vulval lesions or trauma, genital infection, 'show' of early labour, vasa praevia, uterine rupture, marginal (circumsinusoidal) sinus bleed.",
      connect: "'Incidental' (local) APH is a diagnosis of exclusion: scan out praevia, then examine the cervix and vagina with a speculum. Slide p.170 lists ruptured uterus, abruptio and praevia as bleeding danger signs.", extra: true },
    { topic: "Basics", src: "Standard teaching",
      q: "What are the two types of APH, and what is the first rule of management of any APH?",
      a: "Placenta praevia (bleeding from a placenta in the lower segment) and abruptio placentae (accidental haemorrhage; premature separation of a normally sited placenta). First rule: do NOT do a vaginal (digital) examination until the placental site is known.",
      connect: "Past short note: 'Two types of antepartum haemorrhage'. The rule protects the woman from torrential bleeding if the finger disturbs a low placenta.", extra: true },
    { topic: "Placenta praevia", src: "Standard teaching",
      q: "Define placenta praevia and list the classification.",
      a: "Implantation of the placenta wholly or partly in the lower uterine segment. Type I: placenta in the lower segment, not reaching the os (low-lying). Type II: reaches the edge of the os (marginal). Type III: partially covers the os (incomplete central). Type IV: completely covers the os (complete central). Types III and IV are major.",
      connect: "Past MCQ: 'Type III is major placenta praevia' (true). Type decides the route of delivery." },
    { topic: "Placenta praevia", src: "Standard teaching",
      q: "What are the risk factors for placenta praevia?",
      a: "Previous caesarean section (risk rises with the number), previous placenta praevia, multiparity (grand multipara: your slides p.303 and p.1183 link grand multiparity with praevia), advanced maternal age, multiple pregnancy, previous uterine surgery or curettage, smoking, IVF.",
      connect: "Scar plus praevia is the dangerous combination because of placenta accreta.", extra: true },
    { topic: "Placenta praevia", src: "Standard teaching",
      q: "Describe the clinical features of placenta praevia.",
      a: "Painless, recurrent, bright red 'causeless' bleeding, typically at 28–34 weeks (often a warning haemorrhage first, but not always). Soft non-tender uterus, malpresentation (breech, transverse, oblique) and a high floating head, normal fetal heart, shock proportional to the visible loss.",
      connect: "Past MCQ: 'there is always a warning bleed' is false and 'it causes abdominal pain' is false.", extra: true },
    { topic: "Placenta praevia", src: "Standard teaching",
      q: "How is placenta praevia diagnosed?",
      a: "Ultrasound: transabdominal first; transvaginal is more accurate and safe. MRI if accreta is suspected (previous scar). Never by digital examination. A routine 20-week scan often finds it, but most low placentas move up as the lower segment grows, so rescan at about 32 weeks.",
      connect: "Past essay: a woman with type III praevia found on routine scan. The answer starts with the rescan, not the caesarean.", extra: true },
    { topic: "Placenta praevia", src: "Standard teaching",
      q: "Outline the management of placenta praevia (past paper: 'Management of placenta praevia').",
      a: "Assess and resuscitate (ABC, two IV lines, FBC, group and crossmatch, clotting, anti-D if Rh-negative). Admit. If mother stable and fetus preterm: expectant management with steroids (24–34 weeks) and correction of anaemia, then CS at 37–38 weeks (earlier if major with bleeding). Emergency CS for heavy bleeding, fetal distress or labour. Minor types clear of the os may deliver vaginally.",
      connect: "Delivery needs a senior obstetrician, anaesthetist, blood and neonatal care. Anticipate PPH: the lower segment contracts poorly.", extra: true },
    { topic: "Placenta praevia", src: "Standard teaching",
      q: "What are the maternal and fetal complications of placenta praevia?",
      a: "Maternal: antepartum, intrapartum and postpartum haemorrhage, shock, anaemia, placenta accreta (with a scar), hysterectomy, infection, thromboembolism, death. Fetal: preterm birth, malpresentation, IUGR, cord prolapse, vasa praevia, anaemia and perinatal death.",
      connect: "Most perinatal deaths are from prematurity. Hence the push to reach 37 weeks safely.", extra: true },
    { topic: "Abruptio placentae", src: "Standard teaching",
      q: "Define abruptio placentae (accidental haemorrhage) and its types.",
      a: "Premature separation of a normally situated placenta after the age of viability and before delivery of the fetus. Types: revealed (blood escapes through the cervix), concealed (retroplacental clot, no external bleeding) and mixed. Incidence about 0.5–1% of pregnancies.",
      connect: "Concealed type is the most dangerous because the visible loss hides the real one.", extra: true },
    { topic: "Abruptio placentae", src: "p.303, 1000, 1183, 1278",
      q: "List the risk factors for abruptio placentae (past paper: 'Risk factors of accidental haemorrhage').",
      a: "Hypertension and pre-eclampsia (commonest association), previous abruption, trauma (RTA, blows, domestic violence), sudden decompression (ruptured membranes with polyhydramnios, delivery of first twin), multiparity and grand multiparity, advanced age, anaemia and folate deficiency, smoking, cocaine, short cord, external cephalic version, thrombophilia, PROM, low socioeconomic status.",
      connect: "Your slides name abruptio in grand multiparity (p.303, 1183), in the effects of anaemia (p.1000) and as a sequel of PROM (p.1278)." },
    { topic: "Abruptio placentae", src: "Standard teaching",
      q: "Describe the clinical features of abruptio placentae.",
      a: "Constant severe abdominal pain, dark bleeding (revealed) or none (concealed), a tense, hard, tender 'woody' uterus that may be larger than dates, difficulty palpating fetal parts, fetal distress or absent fetal heart, and shock out of proportion to the visible loss. Features of pre-eclampsia are often present. Oliguria and bleeding elsewhere suggest coagulopathy.",
      connect: "Compare with praevia: painful, hard, shocked out of proportion, fetus often compromised.", extra: true },
    { topic: "Abruptio placentae", src: "Standard teaching",
      q: "How is abruption diagnosed and what investigations are done?",
      a: "Mainly clinical (a past MCQ: 'usual method of diagnosing placental abruption: clinical'). Ultrasound may be normal. FBC, group and crossmatch, clotting profile (fibrinogen, PT, APTT, platelets, FDPs or D-dimer), urea and electrolytes, liver function, urine output. Kleihauer test to quantify fetomaternal haemorrhage for anti-D. CTG for fetal state.",
      connect: "Clotting results guide transfusion of FFP, platelets and cryoprecipitate.", extra: true },
    { topic: "Abruptio placentae", src: "Standard teaching",
      q: "Outline the management of abruptio placentae.",
      a: "Resuscitate: two large IV lines, blood and fluids, catheter with hourly urine output (aim above 30 ml/h), oxygen, analgesia. Correct coagulopathy (FFP, cryoprecipitate, platelets). Live fetus in distress or mother unstable: emergency CS. Fetal death and mother stable: ARM with oxytocin for vaginal delivery. Prevent PPH (active third stage, oxytocin infusion). Anti-D if Rh-negative. Be ready for hysterectomy if bleeding persists.",
      connect: "Past question: 'Treatment of antepartum haemorrhage'. The principle is to treat shock and clotting first and deliver once she is stable.", extra: true },
    { topic: "Abruptio placentae", src: "Standard teaching",
      q: "What is a Couvelaire uterus?",
      a: "Extravasation of blood into the myometrium (sometimes to the serosa) in severe concealed abruption (uterine apoplexy). The muscle contracts poorly, so atonic PPH is likely; usually responds to oxytocics and massage, but may need compression sutures or hysterectomy.",
      connect: "Explains why every abruption needs PPH prevention and a transfusion plan.", extra: true },
    { topic: "Abruptio placentae", src: "p.1425, 1432–1435",
      q: "List the maternal and fetal complications of accidental haemorrhage (past paper: 'Maternal and fetal complications').",
      a: "Maternal: haemorrhagic shock, coagulopathy/DIC, acute renal failure (acute tubular or cortical necrosis), PPH (Couvelaire uterus), Sheehan syndrome, sepsis, anaemia, amniotic fluid embolism, maternal death. Fetal: hypoxia, IUGR, prematurity, intrauterine death, perinatal mortality (about 30–50% in severe cases).",
      connect: "Your slides list abruption as a cause of DIC (p.1432) and describe the lab picture (low platelets, prolonged PT and APTT, raised D-dimer; treatment with FFP, platelets and treating the cause, p.1434–1435). Sheehan syndrome is on p.1425 as a consequence of PPH." },
    { topic: "Abruptio placentae", src: "p.1318, 1338",
      q: "A woman has an abruption at 37 weeks and a stillbirth. What breast problems can she have, and how are they prevented?",
      a: "Engorgement, mastitis and breast abscess. Prevent or treat with firm breast support or binding, no nipple stimulation, ice packs, mild analgesics (aspirin, ibuprofen) and bromocriptine for 10–14 days.",
      connect: "This is a case study on your lactation slides (p.1318, answered on p.1338), so an examiner can join obstetric emergency to lactation." },
    { topic: "Differential diagnosis", src: "Standard teaching",
      q: "Differentiate placenta praevia from abruptio placentae (past paper: 'Differential diagnosis between placenta previa and accidental haemorrhage').",
      a: "Pain: praevia painless; abruption constant, severe. Bleeding: praevia bright red, recurrent, equal to shock; abruption dark, may be concealed, shock out of proportion. Uterus: praevia soft, relaxed; abruption hard, tender, woody, larger than dates. Presentation: praevia malpresentation, high head; abruption normal lie. Fetal heart: praevia normal; abruption distressed or absent. Associations: praevia with scar and multiparity; abruption with pre-eclampsia and trauma.",
      connect: "This table is also a short MCQ. Learn it as pain, colour, uterus, lie, fetal heart.", extra: true },
    { topic: "Other causes", src: "Standard teaching",
      q: "What is vasa praevia and how does it present?",
      a: "Fetal vessels running through the membranes across or near the internal os, not protected by cord or placenta (velamentous cord insertion, succenturiate or bilobed placenta, low-lying placenta, IVF). Presents with painless fresh bleeding at rupture of the membranes with fetal bradycardia or a sinusoidal trace; the blood lost is fetal.",
      connect: "Past T/F stem: 'vasa praevia always results in maternal mortality' is false; the loss is fetal. Apt test confirms fetal blood.", extra: true },
    { topic: "Other causes", src: "Standard teaching",
      q: "How is vasa praevia diagnosed and managed?",
      a: "Antenatal: transvaginal colour Doppler. In labour: Apt (alkali denaturation) test on blood. If diagnosed antenatally: steroids, admission around 30–32 weeks and elective CS at 34–36 weeks. If bleeding with fetal compromise: immediate emergency CS and neonatal resuscitation with blood.",
      connect: "Rapid delivery is the only treatment. A fetus has only about 250 ml of blood, so a small loss is fatal.", extra: true },
    { topic: "Other causes", src: "p.170",
      q: "How can uterine rupture present with antepartum bleeding?",
      a: "With sudden severe pain, vaginal bleeding, loss of fetal heart, a change in uterine shape with fetal parts palpable under the skin, and shock. Risk factors: previous scar, obstructed labour, grand multiparity, oxytocin misuse.",
      connect: "Ruptured uterus is listed with abruptio and praevia among bleeding danger signs on your slide (p.170). Treat by resuscitation and laparotomy.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "A woman presents with antepartum haemorrhage. How do you assess her?",
      a: "Resuscitate first (airway, IV fluids, oxygen, call for help). History: gestation, amount, colour, pain, trauma, fetal movement, previous scars, hypertension. Examination: pulse, BP, pallor, abdominal tone, tenderness, lie and presentation, fetal heart. Bloods: FBC, group and crossmatch, clotting. Scan for placental site. No digital vaginal examination before the scan; speculum examination afterwards to exclude local causes.",
      connect: "In a primary facility: IV line, keep warm, refer with a health worker. All APH is treated as dangerous because the visible loss can understate the true loss.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "What is the role of anti-D, corticosteroids and Kleihauer testing in APH?",
      a: "Anti-D: give to every Rh-negative woman with APH (within 72 hours). Kleihauer: counts fetal cells in maternal blood to calculate the anti-D dose in larger fetomaternal haemorrhage. Corticosteroids (betamethasone or dexamethasone) between 24 and 34 weeks to mature the fetal lungs if early delivery is likely.",
      connect: "Same anti-D principle as in abortion (p.514) and ectopic pregnancy.", extra: true },
    { topic: "Prevention", src: "p.143",
      q: "How can APH be prevented or its outcome improved?",
      a: "Early booking and ANC with scan, treating hypertension and anaemia, avoiding smoking and cocaine, promoting family planning (limits grand multiparity), safe delivery practices to avoid previous scars, and educating women on danger signs (vaginal bleeding is the first on your slide p.143) so they report immediately. Deliver in a unit with blood and a theatre.",
      connect: "Preventing delay in reaching hospital saves lives more than any single drug.", extra: true },
    { topic: "Cases", src: "Standard teaching",
      q: "A 31-year-old G3P2 with a previous caesarean section has painless bleeding at 34 weeks. The scan shows an anterior placenta praevia. What is your concern?",
      a: "Placenta accreta (increta or percreta), because praevia over a uterine scar. Plan delivery in a tertiary unit by a senior team with blood, cell salvage and possible hysterectomy; MRI or Doppler to assess invasion; counsel about hysterectomy.",
      connect: "The more caesareans, the higher the risk of both praevia and accreta.", extra: true },
    { topic: "Cases", src: "Standard teaching",
      q: "A hypertensive woman at 36 weeks has severe abdominal pain, a hard tender uterus and absent fetal heart. BP is 90/60, pulse 130. What is your management?",
      a: "Concealed abruption with fetal death and shock. Resuscitate with two IV lines, blood and fluids, catheter; check clotting and correct it; treat the hypertension if she recovers; ARM and oxytocin for vaginal delivery when stable; active management of third stage; monitor for renal failure and PPH.",
      connect: "Blood pressure may fall because of shock, hiding pre-eclampsia. Watch urine output.", extra: true }
  ]
}]);

</script>
<script>
// O&G · Flashcards · Ectopic pregnancy.
// The supplied slide deck has NO ectopic lecture; cards are standard teaching shaped by the past-paper questions.
// src names a slide page only where the deck mentions the point. extra:true is used for items the deck never touches.
window.QUESTION_BANKS = (window.QUESTION_BANKS || []).concat([{
  id: "og-cards-ectopic",
  subject: "O&G",
  group: "Ectopic pregnancy",
  type: "cards",
  title: "O&G Flashcards · Ectopic pregnancy",
  cards: [
    { topic: "Basics", src: "Standard teaching",
      q: "Define ectopic pregnancy and give its incidence.",
      a: "Implantation of the fertilised ovum outside the endometrial lining of the uterine cavity. About 1–2% of pregnancies (roughly 1 in 80–100).",
      connect: "Essay opener. Ectopic is the leading cause of first-trimester maternal death, so it is always on the differential of a woman of reproductive age with pain, bleeding or collapse.", extra: true },
    { topic: "Basics", src: "Standard teaching",
      q: "List the sites of ectopic pregnancy with their approximate frequency.",
      a: "Tubal over 95%: ampulla about 70%, isthmus about 12%, fimbria about 11%, interstitial (cornual) 2–4%. Rare: ovarian, cervical, abdominal, caesarean-scar, broad-ligament.",
      connect: "Site decides when it presents: isthmic ruptures at 6–8 weeks, ampullary 8–12, interstitial 12–16 (and bleeds the most).", extra: true },
    { topic: "Basics", src: "p.931 (ovarian ectopic)",
      q: "How is an ovarian ectopic pregnancy recognised?",
      a: "Spiegelberg criteria: the tube on that side is intact and separate; the gestational sac lies in the normal position of the ovary; the sac is connected to the uterus by the ovarian ligament; ovarian tissue is present in the wall of the sac.",
      connect: "These four points are listed on your benign ovarian tumours slide among the non-neoplastic ovarian lesions, so it can come as a picture or viva question." },
    { topic: "Risk factors", src: "Standard teaching",
      q: "List 10 predisposing factors for ectopic pregnancy (asked as 'List 10' in past papers).",
      a: "1 Previous ectopic. 2 Previous tubal surgery or failed sterilisation. 3 PID/salpingitis (chlamydia, gonorrhoea). 4 IUCD in situ. 5 Assisted reproduction (IVF). 6 Ovulation induction (clomiphene). 7 Endometriosis. 8 Progestogen-only pill or emergency contraception failure. 9 Smoking. 10 Age over 35. Also: previous pelvic or abdominal surgery, congenital tubal anomalies, in-utero DES exposure, infertility.",
      connect: "Group them to remember: damaged tube (infection, surgery, endometriosis), slow transport (progestogens, smoking), and artificial conception (IVF, ovulation induction)." },
    { topic: "Risk factors", src: "p.628, 767, 528",
      q: "Which infections and obstetric events lead to ectopic pregnancy in our environment?",
      a: "Pelvic inflammatory disease: chlamydia (commonest, 80% asymptomatic in women) and gonococcus; also post-abortal and puerperal sepsis. The slides list ectopic pregnancy as a complication of reproductive tract infection and of unsafe abortion.",
      connect: "Same tubal damage that causes tubal infertility. Prevention is the same: treat STIs early with partner notification, safe abortion and delivery." },
    { topic: "Risk factors", src: "Standard teaching",
      q: "A woman conceives with an IUCD in place. What is the chance the pregnancy is ectopic?",
      a: "The IUCD lowers the overall risk of pregnancy and of ectopic pregnancy compared with using no contraception, but of the pregnancies that do occur with an IUCD in situ, a higher proportion are ectopic. Progestogen-only pill failures behave the same way.",
      connect: "Past MCQ pattern: 'if a pregnancy occurs in an IUCD user, the risk of it being ectopic is higher than in women not using contraception' (true, read it carefully).", extra: true },
    { topic: "Pathology", src: "Standard teaching",
      q: "What are the possible fates of a tubal ectopic pregnancy? (asked as 'Fate of tubal ectopic pregnancy')",
      a: "1 Tubal rupture (isthmic, early). 2 Tubal abortion (ampullary): expelled through the fimbrial end into the peritoneal cavity. 3 Spontaneous resolution (reabsorption). 4 Tubal mole. 5 Secondary abdominal pregnancy (rare). 6 Lithopedion (rare).",
      connect: "Rupture and tubal abortion cause the haemoperitoneum. Resolution explains why expectant management is possible when hCG is low and falling.", extra: true },
    { topic: "Presentation", src: "Standard teaching",
      q: "Give the symptoms of ectopic pregnancy (past papers: 'list 3 symptoms').",
      a: "Amenorrhoea of 6–8 weeks, lower abdominal pain (often unilateral, colicky then constant) and vaginal bleeding (scanty, dark or brown). Also: shoulder-tip pain, dizziness or syncope, urge to defecate, early pregnancy symptoms.",
      connect: "Pain usually comes before the bleeding (the reverse of abortion). A woman can present with only one of the three, so keep the diagnosis in mind.", extra: true },
    { topic: "Presentation", src: "Standard teaching",
      q: "What are the symptoms and signs of RUPTURED ectopic pregnancy?",
      a: "Sudden severe lower abdominal pain, collapse or fainting, shoulder-tip pain, pallor, tachycardia, hypotension and shock; abdominal tenderness, guarding and rebound; distension; cervical excitation (chandelier sign), bulging tender pouch of Douglas.",
      connect: "Shock out of proportion to the vaginal bleeding is the clue, because the blood is inside the abdomen. Treat as an emergency: resuscitate and operate.", extra: true },
    { topic: "Presentation", src: "Standard teaching",
      q: "What do you find on bimanual examination in an unruptured ectopic?",
      a: "A uterus smaller than dates, a closed cervix, cervical motion tenderness, a tender adnexal fullness or mass, and tenderness in one fornix. Do it gently: rough examination can rupture the tube.",
      connect: "Compare incomplete abortion (open os, uterus matches dates) and PID (fever, discharge, bilateral tenderness).", extra: true },
    { topic: "Presentation", src: "Standard teaching",
      q: "How do you distinguish ectopic pregnancy from threatened abortion? (past paper)",
      a: "Ectopic: pain first, bleeding scanty and dark, uterus smaller than dates, cervical excitation, adnexal mass, no intrauterine sac on scan. Threatened abortion: bleeding first and fresh red, pain minimal or cramping after, uterus matches dates, closed os, intrauterine sac with fetal echo.",
      connect: "Threatened abortion slide (p.509–510) says explicitly that ectopic must be ruled out; a scan separates them." },
    { topic: "Presentation", src: "Standard teaching",
      q: "Give the differential diagnosis of acute lower abdominal pain with a positive pregnancy test (acutely disturbed ectopic).",
      a: "Threatened or incomplete abortion, ruptured or haemorrhagic corpus luteum cyst, torsion or rupture of an ovarian cyst, PID or tubo-ovarian abscess, acute appendicitis, urinary tract infection or ureteric colic, degenerating fibroid.",
      connect: "Appendicitis and PID are the two that sit closest to ectopic, so a pregnancy test is routine in every woman of reproductive age with abdominal pain.", extra: true },
    { topic: "Diagnosis", src: "Standard teaching",
      q: "Does a negative pregnancy test exclude ectopic pregnancy? What about an intrauterine sac on scan?",
      a: "A negative test makes it very unlikely (sensitive urine tests detect hCG above about 25 IU/L; hCG is detectable even in a concentrated urine sample), but a serum hCG settles it. An intrauterine sac makes ectopic unlikely, but a pseudosac or coexisting (heterotopic) pregnancy can occur. Heterotopic is rare spontaneously but much commoner after IVF.",
      connect: "Past paper true/false stems: 'negative pregnancy test excludes ectopic' is false; 'an intrauterine sac strongly excludes ectopic' is true as a rule, with the heterotopic exception.", extra: true },
    { topic: "Diagnosis", src: "Standard teaching",
      q: "How is serum hCG used in diagnosis?",
      a: "In a normal early intrauterine pregnancy it roughly doubles every 48 hours (rises by at least 66%). In ectopic it rises slowly or plateaus (but about 20% rise normally). Discriminatory zone: above about 1,500 IU/L a normal intrauterine sac should be visible on transvaginal scan; if not, suspect ectopic.",
      connect: "The slow-rise rule only helps once the pregnancy is stable and small. A woman with signs of rupture goes to theatre, not to repeat hCG.", extra: true },
    { topic: "Diagnosis", src: "Standard teaching",
      q: "What does transvaginal ultrasound show in ectopic pregnancy?",
      a: "Empty uterus (± thickened endometrium or a pseudosac), an adnexal mass with a 'tubal ring' (bagel sign), free fluid or blood in the pouch of Douglas (and Morison's pouch if large). Most specific sign: a live extrauterine embryo (cardiac activity outside the uterus).",
      connect: "Past paper: 'the most specific sign is an extrauterine live embryo' (true). Ultrasound with hCG is the usual diagnostic route; laparoscopy confirms.", extra: true },
    { topic: "Diagnosis", src: "p.1132, 1133",
      q: "What is the role of laparoscopy and culdocentesis?",
      a: "Laparoscopy is the traditional diagnostic standard and also allows treatment (listed in the slides as both a diagnostic indication, 'suspected ectopic pregnancy', and a therapeutic one, 'treatment of ectopic pregnancy'). Culdocentesis: needle through the posterior fornix; non-clotting dark blood means haemoperitoneum. Rarely used now.",
      connect: "Culdocentesis is the one to remember for viva or picture-test instruments: a long needle with syringe through the posterior vaginal fornix." },
    { topic: "Management", src: "Standard teaching",
      q: "Outline the management of a ruptured ectopic pregnancy.",
      a: "Call for help; two large-bore IV cannulae; blood for group and crossmatch (O negative if urgent), FBC; fluids and oxygen; consent; immediate laparotomy (or laparoscopy if stable and skilled) with salpingectomy; give anti-D if Rh negative; monitor and counsel.",
      connect: "Resuscitate while preparing for theatre. Surgery stops the bleeding, so it must not wait for the blood pressure to be fixed.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "What are the management options for a stable, unruptured ectopic pregnancy?",
      a: "1 Expectant (asymptomatic, hCG low and falling, no mass). 2 Medical: methotrexate. 3 Surgical, preferably laparoscopic: salpingectomy or salpingotomy. Choice depends on symptoms, hCG, mass size, fetal cardiac activity, fertility wishes and reliability of follow-up.",
      connect: "Past essay: 'Modern treatment of ectopic pregnancy', 'Update diagnosis and management'. Structure the answer around these three branches." },
    { topic: "Management", src: "p.542",
      q: "Give the criteria for methotrexate treatment and the regimen.",
      a: "Haemodynamically stable, unruptured, mass under about 3.5 cm, hCG below about 5,000 IU/L (best below 1,500), no fetal cardiac activity, normal liver and renal function and blood count, reliable for follow-up, not breastfeeding. Single dose 50 mg/m² IM (day 1); check hCG on day 4 and 7 (should fall by more than 15%), then weekly until negative. Avoid NSAIDs, folic acid, alcohol and sun; no pregnancy for 3 months.",
      connect: "Methotrexate is a folate antagonist that kills fast-dividing trophoblast, which is why folic acid is avoided. It also appears in the slides' list of drugs for induced abortion (p.542).", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "Name the medical treatments for ectopic pregnancy (past paper: '3 medical treatments').",
      a: "Methotrexate (systemic IM, the standard; or local injection), potassium chloride (local injection under scan, for cervical or heterotopic pregnancy), mifepristone (little proven value), also actinomycin D, hyperosmolar glucose and prostaglandins (largely historical).",
      connect: "If the question asks for 3, write methotrexate, potassium chloride and mifepristone. Past T/F: 'mifepristone has no value in the slow-leaking ectopic' and 'KCl can be used'.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "Compare salpingectomy and salpingotomy.",
      a: "Salpingectomy: remove the tube; preferred when the other tube is healthy (lower risk of persistent trophoblast and repeat ectopic), and in rupture, uncontrolled bleeding or a damaged tube. Salpingotomy (salpingostomy): open the tube and remove the products, leaving the tube; used when the other tube is absent or damaged and fertility is wanted. About 5–15% have persistent trophoblast, so follow hCG and give methotrexate if it plateaus.",
      connect: "Past MCQ: 'salpingectomy is the only option for surgical management' (false). Either can be done by laparoscopy.", extra: true },
    { topic: "Management", src: "Standard teaching",
      q: "How are interstitial (cornual) and cervical ectopic pregnancies managed?",
      a: "Cornual: methotrexate if early and stable, or laparoscopic cornual resection or cornuostomy; hysterectomy if rupture is catastrophic. Cervical: methotrexate (systemic or local), local KCl, uterine artery embolisation, avoid curettage before treatment; hysterectomy if bleeding is uncontrolled.",
      connect: "Both carry the highest case-fatality rate. Past T/F: 'the case-fatality rate in cervical ectopic is higher than in the ampullary type' (true).", extra: true },
    { topic: "Management", src: "p.514",
      q: "What extra step applies to a Rhesus-negative woman?",
      a: "Give anti-D immunoglobulin after any ectopic pregnancy (surgical or medical), as for abortion.",
      connect: "The slides list anti-D in the management of incomplete abortion (p.514). Same principle for every bleeding event in early pregnancy." },
    { topic: "Complications", src: "Standard teaching",
      q: "What are the immediate and long-term implications of ectopic pregnancy? (essay 2013.3)",
      a: "Immediate: haemorrhage and shock, death, need for emergency surgery and transfusion, loss of the pregnancy, anti-D need. Long-term: loss of a tube, tubal infertility, recurrence (about 10–15%), chronic pelvic pain and adhesions, psychological grief and marital strain, subsequent intrauterine pregnancy about 60%.",
      connect: "Add the public-health point: ectopic is a leading cause of first-trimester death, and delay in presentation is common in Nigeria. A full answer also mentions prevention (treat STIs, avoid unsafe abortion).", extra: true },
    { topic: "Complications", src: "p.1347",
      q: "How do HIV and heterotopic pregnancy relate to ectopic pregnancy?",
      a: "The slides report that, in some African studies, HIV is linked with lower pregnancy rates, more pregnancy losses and higher rates of ectopic pregnancy. Heterotopic pregnancy (intrauterine plus ectopic together) is rare naturally and commoner after assisted reproduction.",
      connect: "Another route by which genital infection leads to tubal damage and ectopic pregnancy." },
    { topic: "Complications", src: "p.1491",
      q: "Can a malignancy follow an ectopic pregnancy?",
      a: "Yes, rarely. Choriocarcinoma may arise after an ectopic pregnancy (as well as after a mole, abortion or normal birth), though over 50% of cases follow a hydatidiform mole.",
      connect: "Why follow-up hCG matters after treatment: a persistently raised level needs further evaluation." },
    { topic: "Cases", src: "Standard teaching",
      q: "A 26-year-old has 7 weeks of amenorrhoea, lower abdominal pain and spotting. She faints in the clinic: pulse 128, BP 80/50. What do you do?",
      a: "Treat as a ruptured ectopic until proven otherwise: call for help, IV access with fluids and blood, crossmatch, oxygen, a quick pregnancy test and bedside scan if it does not delay, then immediate surgery (laparotomy or laparoscopy) with salpingectomy; anti-D if Rh negative.",
      connect: "Do not send her for a scan or for hCG trending when she is shocked.", extra: true },
    { topic: "Cases", src: "Standard teaching",
      q: "A stable woman with 6 weeks of amenorrhoea has mild lower abdominal pain, hCG 1,200 IU/L, a 2 cm adnexal mass and no fetal heart. Management?",
      a: "Methotrexate 50 mg/m² IM if reliable follow-up and normal liver and renal function, with hCG on day 4 and 7 then weekly (expectant management is an option if hCG is low and falling and she is asymptomatic). Surgery if pain worsens, rupture is suspected or hCG rises.",
      connect: "Counsel her about warning signs (worsening pain, dizziness) and about avoiding pregnancy for 3 months.", extra: true }
  ]
}]);

window.QUESTION_BANKS = (window.QUESTION_BANKS || []).concat([{
  id: "og-cards-endometriosis",
  subject: "O&G",
  group: "Fibroids & endometriosis",
  type: "cards",
  title: "O&G Flashcards · Endometriosis",
  cards: [
    { topic: "Definition", src: "p.755",
      q: "Define endometriosis.",
      a: "Endometrial tissue occurring aberrantly (outside the uterine cavity) in various tissues.",
      connect: "Compare adenomyosis: endometrial tissue INSIDE the myometrium. Endometriosis is OUTSIDE the uterus altogether." },
    { topic: "Definition", src: "p.755",
      q: "What must be demonstrated to make the diagnosis histologically?",
      a: "Endometrial GLANDS and STROMA outside the uterine cavity.",
      connect: "Two things, glands + stroma. Tissue that only looks like endometrium is not enough." },
    { topic: "Epidemiology", src: "p.756",
      q: "Give the prevalence of endometriosis (a) among menstruating women and (b) among infertile patients.",
      a: "(a) 7–10% of all menstruating women. (b) 35–50% of infertile patients.",
      connect: "The jump from 7–10% to 35–50% is why infertility work-up always asks about endometriosis. The true incidence is unknown because many cases are missed." },
    { topic: "Epidemiology", src: "p.756",
      q: "Peak age of incidence, and the parity association?",
      a: "30–40 years; low parity.",
      connect: "Same age band as symptomatic fibroids (30–40), so the two sit together on the differential for a woman in her thirties with pelvic pain and menstrual problems. Low parity means more menstrual cycles, more exposure to retrograde flow." },
    { topic: "Epidemiology", src: "p.756",
      q: "Name the three most common sites.",
      a: "Ovary, uterosacral ligament, pouch of Douglas.",
      connect: "All sit in the dependent pelvis, where retrograde menstrual blood would pool. That is why theory 1 (retrograde menstruation) fits the distribution." },
    { topic: "Aetiology", src: "p.757",
      q: "List the three theories of aetiology.",
      a: "1. Retrograde menstruation. 2. Transformation (metaplasia) of coelomic epithelium. 3. Lymphatic or vascular spread.",
      connect: "Match the theory to the clue. Pelvic peritoneum and ovary disease → retrograde menstruation. Rare distant sites (lung, umbilicus, scars) → lymphatic or vascular spread. Disease in someone with no menstruation → coelomic metaplasia." },
    { topic: "Presentation", src: "p.758",
      q: "What proportion of cases are asymptomatic, and what determines the symptoms in the rest?",
      a: "About 50% are asymptomatic. Symptoms depend on the SITE of the deposits.",
      connect: "Severity of symptoms does not track the amount of disease. A woman can have extensive disease and few symptoms, or the reverse." },
    { topic: "Presentation", src: "p.758 (symptom box)",
      q: "List the symptoms of endometriosis from the slide.",
      a: "Dysmenorrhoea · pelvic pain · lower abdominal or back pain · dyspareunia · dyschezia (pain on defecation) · loin pain · pain on micturition · pain on exercise.",
      connect: "Read the symptom as the organ involved: dyschezia → bowel/rectovaginal area, pain on micturition → bladder, loin pain → ureter, dyspareunia → pouch of Douglas/uterosacral ligaments. Infertility is the other big presentation." },
    { topic: "Presentation", src: "p.758 (site → symptom)",
      q: "Which site gives (a) dyschezia, (b) pain on micturition, (c) loin pain?",
      a: "(a) Bowel / rectovaginal region. (b) Bladder. (c) Ureter (ureteric involvement, risking obstruction).",
      connect: "This is the site-based reasoning the slide is hinting at with 'symptoms will depend on site'. It is the logic examiners use for case questions.", extra: true },
    { topic: "Diagnosis", src: "p.759",
      q: "What is the definitive way to diagnose endometriosis?",
      a: "Visualisation at laparoscopy (with histology confirming glands and stroma).",
      connect: "Not ultrasound, not examination, not a blood test. Scans only suggest it (e.g. an ovarian cyst). Laparoscopy lets you see, biopsy and treat in the same sitting." },
    { topic: "Diagnosis", src: "p.759",
      q: "Name the three appearances of endometriosis the slide lists.",
      a: "Mass, 'powder burn' appearance, chocolate-coloured cyst.",
      connect: "Powder burn = small dark brown or blue-black peritoneal spots. Chocolate cyst = ovarian endometrioma." },
    { topic: "Diagnosis", src: "p.760–761",
      q: "Describe the peritoneal lesions seen at laparoscopy (slide figure).",
      a: "Blue-black lesions, white plaques, clear vesicles and newly formed blood vessels.",
      connect: "Appearance varies with the age of the lesion, so a 'normal-looking' peritoneum with subtle clear or white lesions does not exclude disease." },
    { topic: "Diagnosis", src: "p.760",
      q: "What is an endometrioma and why is it called a 'chocolate cyst'?",
      a: "An endometriotic cyst of the ovary. It bleeds slowly into itself over months, so it fills with old dark-brown 'chocolate' fluid.",
      connect: "The slide's case: a left-sided cyst with worsening pain, a small rupture leaking chocolate fluid into the abdomen. Rupture = acute pain. Surgery removed the cyst and saved the normal ovarian tissue." },
    { topic: "Diagnosis", src: "p.762",
      q: "What does the 'mild adhesions' picture show, and why does that matter for fertility?",
      a: "Endometriotic deposits with scarring (adhesions) in the pelvis.",
      connect: "Adhesions can distort the tubes and ovaries and impair egg pick-up. This is one way endometriosis causes infertility. Tubal damage is also how pelvic infection causes infertility (see the infertility notes), so tubal factor is the common thread.", extra: true },
    { topic: "Medical treatment", src: "p.763 (table)",
      q: "List the six drug groups in the slide's medical-treatment table.",
      a: "1. NSAIDs. 2. Progestogens. 3. Synthetic androgens (danazol, gestrinone). 4. Combined oestrogens and progestogens. 5. GnRH analogues. 6. GnRH analogues + HRT (add-back).",
      connect: "Two ideas run through all of them. NSAIDs treat PAIN. Everything else suppresses the ovarian cycle so the deposits stop cycling and shrink." },
    { topic: "Medical treatment", src: "p.763",
      q: "NSAIDs for endometriosis: examples and main side-effect?",
      a: "Diclofenac, ibuprofen, mefenamic acid. Side-effect: gastric irritation.",
      connect: "Same mefenamic acid used for DUB (prostaglandin synthetase inhibitor, 500 mg tds). Prostaglandins drive both dysmenorrhoea and heavy bleeding." },
    { topic: "Medical treatment", src: "p.763",
      q: "Progestogens for endometriosis: examples and side-effects?",
      a: "Dydrogesterone, medroxyprogesterone acetate, norethisterone. Side-effects: bloating, fluid retention, breast tenderness, nausea.",
      connect: "Norethisterone and medroxyprogesterone are the same drugs used in DUB, now used to stop cycling and decidualise the endometrial deposits." },
    { topic: "Medical treatment", src: "p.763",
      q: "Danazol and gestrinone: what are they and what are their side-effects?",
      a: "Synthetic androgens. Side-effects: seborrhoea, acne, weight gain, muscle cramps and menopausal symptoms (the slide excludes osteoporosis).",
      connect: "Androgenic side-effects (acne, oily skin, weight gain) are the clue. Danazol also appeared in the DUB drug list, and androgen effects are why women dislike it." },
    { topic: "Medical treatment", src: "p.763",
      q: "GnRH analogues: examples, side-effects, and how are the side-effects reduced?",
      a: "Buserelin, goserelin, leuprorelin, nafarelin, triptorelin. Cause menopausal symptoms (including osteoporosis). Reduced by add-back HRT (continuous or sequential) or tibolone.",
      connect: "GnRH analogues switch off the pituitary, so the woman becomes oestrogen-deficient: hot flushes, vaginal dryness, bone loss. Hence add-back HRT. Same drug class as in the DUB and fibroid slides.",
    },
    { topic: "Medical treatment", src: "p.763",
      q: "A woman on a GnRH analogue complains of hot flushes. What is the cause, and what do you add?",
      a: "Drug-induced oestrogen deficiency (a pseudo-menopause). Add HRT (add-back) or tibolone.",
      connect: "Add-back therapy lets treatment continue and protects bone without bringing back the disease." },
    { topic: "Surgical treatment", src: "p.764",
      q: "What are the conservative surgical options?",
      a: "Excision of lesions and neurectomy.",
      connect: "Conservative = keep the uterus. Choose it for younger women who want children or want to keep their fertility." },
    { topic: "Surgical treatment", src: "p.764",
      q: "What is the radical surgical option?",
      a: "Total abdominal hysterectomy (TAH), with excision of bladder and bowel disease.",
      connect: "For severe disease and completed family. Compare DUB and fibroids, where hysterectomy is also reserved for completed family and failed medical treatment." },
    { topic: "Cases", src: "p.756–759",
      q: "A 32-year-old nulligravida has painful periods, painful intercourse and has not conceived after 2 years. Most likely diagnosis, and how do you confirm it?",
      a: "Endometriosis. Confirm by laparoscopy (visualisation ± biopsy showing glands and stroma).",
      connect: "Nullipara + 30–40 years + infertility + dysmenorrhoea/dyspareunia is the textbook pattern. Fibroids would more often cause heavy periods and a mass; PID would cause fever and discharge." },
    { topic: "Cases", src: "p.760",
      q: "Laparoscopy shows an enlarged ovary leaking dark brown fluid. What is the lesion and the treatment?",
      a: "An endometrioma (chocolate cyst). Excise the cyst while conserving normal ovarian tissue (conservative surgery).",
      connect: "Picture-test pattern. The slide image shows exactly this: a white enlarged ovary with a pointing arrow at the leaking spot." },
    { topic: "Cases", src: "p.756, 764",
      q: "Which treatment suits (a) a 24-year-old wanting pregnancy soon with a small ovarian endometrioma, (b) a 46-year-old with severe disease and a completed family?",
      a: "(a) Conservative: excision of the lesion (laparoscopic) ± medical suppression. (b) Radical: TAH with excision of bladder or bowel disease.",
      connect: "Treatment follows the patient's goals: fertility wish decides conservative versus radical." },
    { topic: "Extra", src: "standard teaching, not on slides",
      q: "Which aetiological theory is attributed to Sampson, and which to Meyer?",
      a: "Sampson: retrograde menstruation. Meyer: coelomic metaplasia.",
      connect: "Handy for viva. Both appear on the slide as theories, just without names.", extra: true },
    { topic: "Extra", src: "standard teaching, not on slides",
      q: "Is CA-125 diagnostic for endometriosis?",
      a: "No. It may be raised, but it is non-specific (also raised in ovarian cancer, fibroids, PID, menstruation). Diagnosis stays laparoscopic.",
      connect: "A raised CA-125 with a pelvic mass sends you to think about ovarian cancer, so don't read it in isolation.", extra: true }
  ]
}]);

<script>
// O&G · Flashcards · Infertility — slides p.609–665 of "O and G 1 Merged.pdf"

window.QUESTION_BANKS = (window.QUESTION_BANKS || []).concat([{
  id: "og-cards-infertility",
  subject: "O&G",
  group: "Infertility",
  type: "cards",
  title: "O&G Flashcards · Infertility",
  cards: [
    { topic: "Basics", src: "p.611",
      q: "Define infertility, primary infertility, secondary infertility and unexplained infertility.",
      a: "Infertility: failure to conceive after 1 year of regular unprotected intercourse. Primary: never conceived. Secondary: has conceived before. Unexplained: all standard investigations are normal.",
      connect: "Secondary infertility in Nigeria is usually tubal damage from a previous pregnancy event (abortion, puerperal sepsis) or an STI. Unexplained is a diagnosis of exclusion." },
    { topic: "Basics", src: "p.612",
      q: "Distinguish sterility, infertility, subfertility, fecundity and fecundability.",
      a: "Sterility: absolute incapacity to reproduce. Infertility: 1 year without conception, whatever the cause. Subfertility: relative reduction in fertility of a group or community. Fecundity: ability to achieve a live birth within one cycle. Fecundability: the probability of pregnancy each month (20–25%, about 0.22).",
      connect: "Fecundity of 0.15–0.18 per month adds up to roughly 90% cumulative pregnancy in a year, which is why 12 months is the cut-off." },
    { topic: "Basics", src: "p.611, 614",
      q: "How common is infertility worldwide and in sub-Saharan Africa, and which type predominates?",
      a: "10–15% of couples worldwide; 11–20% in sub-Saharan Africa. Primary is commoner worldwide, but SSA is the exception: about 52% of infertile couples there have secondary infertility.",
      connect: "Secondary-predominant infertility points to infection after pregnancy or an STI as the main driver. This is the epidemiology answer for essays." },
    { topic: "Basics", src: "p.611, 616",
      q: "What is the single most important prognostic factor, and what happens to fertility with age?",
      a: "Age of the female partner. Fertility is halved at 35 and falls sharply after 37. Investigate women over 35 after 6 months, not 12.",
      connect: "Age drives the oocyte chromosomal abnormalities that cause age-related decline (p.627), and why 'fast-track' management is needed over 35." },
    { topic: "Causes", src: "p.620",
      q: "Which causes of female infertility are most common in Africa versus the Western world?",
      a: "Africa: tubal infertility. Western world: male factor or ovulation disorders.",
      connect: "Tubal = infection = preventable. That is the programmatic message: control RTIs, prevent post-abortion and puerperal infection." },
    { topic: "Causes", src: "p.621",
      q: "Classify the causes of female infertility.",
      a: "Total ovarian failure · tubal dysfunction · disorders of implantation · disorders of ovulation (hypothalamic, pituitary, ovarian, thyroid and adrenal, chromosomal).",
      connect: "Mnemonic path of an egg: made (ovary), released (ovulation), carried (tube), planted (implantation)." },
    { topic: "Causes", src: "p.622",
      q: "What are premature ovarian failure and resistant ovary syndrome?",
      a: "Premature ovarian failure: ovaries stop functioning early (menses cease), linked to autoimmune disease and may be hereditary. Resistant ovary syndrome: primordial follicles fail to mature because of a lack of (or antibodies to) gonadotrophin receptors. Irregular ovulation is commoner than total ovarian failure.",
      connect: "Both have high FSH and LH with low oestradiol. The amenorrhoea slides define premature ovarian failure as before age 40 (this infertility slide says 40 or over)." },
    { topic: "Causes", src: "p.623, 624",
      q: "How do hypothalamic and pituitary disorders cause anovulation?",
      a: "Hypothalamic: abnormal GnRH release (stress, weight loss, drugs), often reversible. Pituitary: micro- or macroadenomas raise prolactin, causing amenorrhoea and anovulation. Prolactin above 1000 iu/L suggests an adenoma, so get MRI of the pituitary fossa.",
      connect: "Low FSH/LH (below 5 u/L) = hypothalamic. High prolactin = pituitary. Treat with pulsatile GnRH or gonadotrophins (hypothalamic) and dopamine agonists (hyperprolactinaemia)." },
    { topic: "Causes", src: "p.625",
      q: "Describe PCOS as a cause of infertility.",
      a: "Commonest cause of anovulatory infertility. Oligomenorrhoea, obesity, hirsutism, raised LH with altered LH:FSH ratio, raised androgens. More common in Asian women. USS: enlarged ovary with 10 or more peripheral small cysts, thickened stroma and increased stromal blood flow.",
      connect: "LH:FSH above 2:1 on days 1–3 is the lab clue. First treatment clomiphene; if resistant, gonadotrophins or laparoscopic ovarian drilling. OHSS risk is higher in PCOS." },
    { topic: "Causes", src: "p.626",
      q: "What is a luteinised unruptured follicle (LUF)?",
      a: "The dominant follicle luteinises but does not rupture, so no egg is released. Causes: prostaglandin synthetase inhibitors, endometriosis. Diagnosed by USS or laparoscopy.",
      connect: "Why it matters: progesterone may be normal (the trap in the mid-luteal progesterone test). Treatment is hCG as an ovulation trigger." },
    { topic: "Causes", src: "p.627",
      q: "Which thyroid, adrenal and chromosomal conditions cause infertility?",
      a: "Hypo- and hyperthyroidism; Cushing's syndrome; congenital adrenal hyperplasia; Turner syndrome and other sex-chromosome abnormalities (absent or defective X); age-related oocyte chromosomal errors.",
      connect: "Hence examination looks for exophthalmos, goitre, webbed neck and low hairline." },
    { topic: "Causes", src: "p.628",
      q: "How does the tube cause infertility, and what are the causes?",
      a: "Impaired oocyte pick-up (peritubal adhesions, damaged fimbriae) or damaged tubal epithelium. Causes: PID (the major one; chlamydia commonest, then gonococci), endometriosis, peritonitis after appendicitis, sepsis after pelvic or abdominal surgery.",
      connect: "Adhesions link endometriosis, appendicitis, surgery and PID. It also explains ectopic pregnancy risk after tubal damage." },
    { topic: "Causes", src: "p.629",
      q: "What causes failed implantation, and which lifestyle factors affect fertility?",
      a: "Luteal insufficiency (low progesterone) and a submucous fibroid distorting the cavity. Smoking, alcohol, drugs, psychological and environmental factors.",
      connect: "Submucous fibroid is the same lesion causing menorrhagia, so the fibroid card pairs with this one. HSG shows it as a filling defect." },
    { topic: "Male factor", src: "p.631–633",
      q: "Summarise normal spermatogenesis and its hormonal control.",
      a: "FSH acts on Sertoli cells; LH acts on Leydig cells, which make androgens. Spermiogenesis takes about 74 days. Sertoli cells secrete inhibin, which gives negative feedback on pituitary FSH. Genes for spermatogenesis are on the Y chromosome.",
      connect: "Sertoli = granulosa equivalent; Leydig = theca equivalent. That is why FSH is raised in testicular failure, since inhibin is low." },
    { topic: "Male factor", src: "p.634",
      q: "List causes of impaired spermatogenesis.",
      a: "Raised scrotal temperature (undescended testes, varicocoele, hot baths, tight underwear), Y-chromosome microdeletions, drugs (psychotropics, anti-epileptics, antihypertensives, antibiotics, chemotherapy).",
      connect: "About 25% of men with abnormal semen have a varicocoele, but benefit from ligation is unproven." },
    { topic: "Male factor", src: "p.635, 636",
      q: "Causes of impaired sperm transport and of ejaculatory dysfunction?",
      a: "Transport: epididymal malformation or inflammatory obstruction, absent or enlarged vas, immotile cilia syndrome, vasectomy. Ejaculatory (1–2% of male infertility): anejaculation, premature ejaculation, retrograde ejaculation, drugs, diabetes, multiple sclerosis. Anti-sperm antibodies (IgG/IgA) also impair function.",
      connect: "Diabetes appears in many pelvic questions. Retrograde ejaculation = sperm in post-ejaculate urine." },
    { topic: "Evaluation", src: "p.637–639",
      q: "What does the infertility history cover, and which clues does examination look for?",
      a: "Type and duration, previous pregnancies and outcomes, prior treatment, menstrual pattern, coital frequency, STIs, surgical contraception, lifestyle (alcohol, tobacco, drugs), occupation, family history, medications. Examination: BMI, exophthalmos, thyroid, webbed neck, low-set ears, galactorrhoea, abdominal and pelvic masses, adnexal or cul-de-sac nodularity. Examine both partners.",
      connect: "Adnexal and cul-de-sac nodularity = endometriosis. Galactorrhoea = prolactin. Always take a confidential STI and previous-pregnancy history from both partners." },
    { topic: "Evaluation", src: "p.640",
      q: "What are the psychological issues in infertility?",
      a: "Stress at every stage. Anxiety during work-up, but depression is the most common reaction to failed treatment. Risks: marital breakdown, domestic violence. Counselling at the start, when indicated, and at the end of unsuccessful treatment or after a loss. Donor gamete couples need counselling.",
      connect: "Essay marks come from covering psychosocial issues: stigma, blame on the woman, and both partners participating." },

  if(b.type==="cards") return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${b.cards.length} cards · ${cardsMastered(b)} mastered</div>
     <button class="primary" data-cards="${i}" data-all="0">Study (weakest first)</button>
     <button data-cards="${i}" data-all="1">All cards, shuffled</button></div>`;
  if(b.type==="mcq") return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${b.questions.length} questions · ${b.negativeMarking?"negative marking":"no negative marking"} · options reshuffled each attempt</div>
     <button class="primary" data-mcq="${i}" data-mode="exam">Start timed exam</button>
     <button data-mcq="${i}" data-mode="practice">Practice (check as you go)</button></div>`;
  if(b.type==="essay") return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     ${b.essays.map((e,k)=>`<div class="meta" style="margin-top:6px">${esc(e.kind)} · ${esc(e.prompt.slice(0,90))}…</div><button class="primary" data-essay="${i}" data-k="${k}">Write &amp; self-mark</button>`).join("")}</div>`;
  return `<div style="margin:12px 0"><b>${TYPE_LABEL[b.type]}</b>
     <div class="meta">${b.questions.length} questions · ${b.questions.reduce((n,q)=>n+q.blanks.length,0)} gaps · ${b.negativeMarking?"negative marking":"no negative marking"}</div>
     <button class="primary" data-start="${i}" data-mode="exam">Start timed exam</button>
     <button data-start="${i}" data-mode="practice">Practice (check as you go)</button></div>`;
}
function weakCard(h){
  const t={}; h.forEach(r=>r.topics&&Object.entries(r.topics).forEach(([k,v])=>{t[k]=t[k]||[0,0];t[k][0]+=v[0];t[k][1]+=v[1]}));
  const rows=Object.entries(t).map(([k,v])=>[k,v[0]/v[1],v[0],v[1]]).sort((a,b)=>a[1]-b[1]);
  if(!rows.length) return "";
  return `<div class="card"><h3 style="margin-top:0">Weak points (all attempts)</h3>`+rows.map(r=>`<div>${esc(r[0])} <span class="meta">${r[2]}/${r[3]} gaps</span><div class="bar"><i style="width:${Math.round(r[1]*100)}%"></i></div></div>`).join("")+`</div>`;
}
function histCard(h){
  if(!h.length) return "";
  return `<div class="card"><h3 style="margin-top:0">History</h3><table><tr><th>Date</th><th>Paper</th><th>Score</th></tr>`+
   h.slice(-10).reverse().map(r=>`<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>${esc(r.title)}${r.mode==="practice"?" (practice)":""}</td><td>${r.got}/${r.max} (${Math.round(100*r.got/r.max)}%)</td></tr>`).join("")+
   `</table><div class="row"><button id="reset">Clear history</button></div></div>`;
}

function start(i,mode){
  const b=banks[i];
  S={b,mode,idx:0,ans:b.questions.map(q=>q.blanks.map(()=>"")),checked:b.questions.map(()=>false),start:Date.now(),limit:b.questions.length*60000};
  if(mode==="exam"){timerEl.hidden=false;tick=setInterval(()=>{const left=S.limit-(Date.now()-S.start);timerEl.textContent=fmt(left);if(left<=0){clearInterval(tick);finish()}},500)}
  else timerEl.hidden=true;
  render();
}
function qView(i){
  const q=S.b.questions[i];
  const parts=q.stem.split(/\{(\d+)\}/);
  let html="";
  parts.forEach((p,k)=>{ if(k%2===0) html+=esc(p); else { const n=+p-1; const checked=S.checked[i];
    if(checked){const ok=isCorrect(S.ans[i][n],q.blanks[n]); html+=`<span class="gapres ${ok?"ok":"bad"}">${esc(S.ans[i][n]||"—")}${ok?"":` <small>→ ${esc(q.blanks[n][0])}</small>`}</span>`}
    else html+=`<input class="gap" data-n="${n}" value="${esc(S.ans[i][n])}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="gap ${n+1}">`;}});
  return html;
}
function render(){
  const {b,idx}=S, q=b.questions[idx], practice=S.mode==="practice";
  app.innerHTML=`<div class="card"><div class="meta">Question ${idx+1} of ${b.questions.length} · ${esc(q.topic)}</div>
   <div class="stem">${qView(idx)}</div>
   ${S.checked[idx]?`<div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div>`:""}
   <div class="row"><button id="prev" ${idx?"":"disabled"}>Back</button>
   ${practice&&!S.checked[idx]?`<button class="primary" id="check">Check</button>`:""}
   ${idx<b.questions.length-1?`<button class="primary" id="next">Next</button>`:`<button class="primary" id="fin">Finish</button>`}</div>
   <div class="dots">${b.questions.map((_,k)=>`<button class="dot ${k===idx?"cur":""} ${S.ans[k].some(Boolean)?"done":""}" data-go="${k}">${k+1}</button>`).join("")}</div></div>`;
  app.querySelectorAll("input.gap").forEach((el,k)=>{el.oninput=()=>S.ans[idx][+el.dataset.n]=el.value;
    el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const all=[...app.querySelectorAll("input.gap")];(all[k+1]||$("#check")||$("#next")||$("#fin"))?.focus?.()}}});
  const f=app.querySelector("input.gap"); if(f) f.focus();
  $("#prev").onclick=()=>{S.idx--;render()};
  if($("#next")) $("#next").onclick=()=>{S.idx++;render()};
  if($("#check")) $("#check").onclick=()=>{S.checked[idx]=true;render()};
  if($("#fin")) $("#fin").onclick=()=>{ if(S.mode==="exam"){const un=S.ans.filter(a=>!a.some(Boolean)).length; if(un){ask(un+" question(s) unanswered. Submit anyway?",finish);return}} finish()};
  app.querySelectorAll("[data-go]").forEach(d=>d.onclick=()=>{S.idx=+d.dataset.go;render()});
}
function finish(){
  clearInterval(tick); timerEl.hidden=true;
  S.over={}; // manual overrides "mark correct": key "q-n"
  results(true);
}
function score(){
  let got=0,max=0; const topics={};
  S.b.questions.forEach((q,i)=>q.blanks.forEach((acc,n)=>{max++; const ok=S.over[i+"-"+n]!==undefined?S.over[i+"-"+n]:isCorrect(S.ans[i][n],acc); if(ok){got++}
    const t=topics[q.topic]=topics[q.topic]||[0,0]; t[1]++; if(ok)t[0]++;}));
  return {got,max,topics};
}
function results(first){
  const sc=score(), pct=Math.round(100*sc.got/sc.max);
  if(first){const h=load();h.push({date:Date.now(),title:S.b.title,mode:S.mode,got:sc.got,max:sc.max,topics:sc.topics});save(h);S.saved=h.length-1}
  else{const h=load(); if(h[S.saved]){Object.assign(h[S.saved],{got:sc.got,topics:sc.topics});save(h)}}
  const weak=Object.entries(sc.topics).filter(([_,v])=>v[0]<v[1]).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  app.innerHTML=`<div class="card"><div class="meta">${esc(S.b.title)} · ${S.mode==="exam"?"time used "+fmt(Date.now()-S.start):"practice"}</div>
   <div class="score">${sc.got} / ${sc.max} <span style="font-size:18px;color:var(--mute)">(${pct}%)</span></div>
   ${weak.length?`<p><b>Revise first:</b> ${weak.map(([k,v])=>`${esc(k)} (${v[0]}/${v[1]})`).join(" · ")}</p>`:`<p>Clean sweep.</p>`}
   <div class="row"><button class="primary" id="home">Back to topic</button><button id="retry">Retake</button></div></div>`+
   S.b.questions.map((q,i)=>`<div class="card"><div class="meta">Q${i+1} · ${esc(q.topic)}</div><div class="stem">${
     q.stem.split(/\{(\d+)\}/).map((p,k)=>{ if(k%2===0)return esc(p); const n=+p-1,key=i+"-"+n; const auto=isCorrect(S.ans[i][n],q.blanks[n]); const ok=S.over[key]!==undefined?S.over[key]:auto;
       return `<span class="gapres ${ok?"ok":"bad"}">${esc(S.ans[i][n]||"—")}${auto?"":` <small>→ ${esc(q.blanks[n][0])}</small>`}</span>${auto?"":`<label class="toggle"><input type="checkbox" data-ov="${key}" ${ok?"checked":""}> I was right</label>`}`}).join("")
   }</div><div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div></div>`).join("");
  $("#home").onclick=home; $("#retry").onclick=()=>start(banks.indexOf(S.b),S.mode);
  app.querySelectorAll("[data-ov]").forEach(c=>c.onchange=()=>{S.over[c.dataset.ov]=c.checked; const y=scrollY; results(false); scrollTo(0,y)});
  scrollTo(0,0);
}
// ---------- single-best-option MCQ ----------
function mcqStart(bi,mode){
  const b=banks[bi];
  const perm=b.questions.map(q=>q.options.map((_,i)=>i).sort(()=>Math.random()-.5)); // perm[q][shownPos]=originalIdx
  S={mcq:true,b,mode,idx:0,perm,pick:b.questions.map(()=>null),checked:b.questions.map(()=>false),start:Date.now(),limit:b.questions.length*60000};
  if(mode==="exam"){timerEl.hidden=false;tick=setInterval(()=>{const left=S.limit-(Date.now()-S.start);timerEl.textContent=fmt(left);if(left<=0){clearInterval(tick);mcqFinish()}},500)}
  else timerEl.hidden=true;
  mcqRender();
}
function mcqRender(){
  const {b,idx,perm}=S,q=b.questions[idx],L="ABCDE",shown=S.checked[idx];
  app.innerHTML=`<div class="card"><div class="meta">Question ${idx+1} of ${b.questions.length} · ${esc(q.topic)}</div>
   <div class="stem" style="line-height:1.5">${esc(q.stem)}</div>
   <div style="margin-top:12px">${perm[idx].map((o,pos)=>{const sel=S.pick[idx]===pos,right=o===q.answer;
     const st=shown?(right?"background:var(--okbg);border-color:var(--ok)":(sel?"background:var(--badbg);border-color:var(--bad)":"")):(sel?"background:color-mix(in srgb,var(--accent) 15%,var(--card));border-color:var(--accent)":"");
     return `<button class="opt" data-pos="${pos}" style="display:block;width:100%;text-align:left;margin:6px 0;${st}" ${shown?"disabled":""}><b>${L[pos]}.</b> ${esc(q.options[o])}</button>`}).join("")}</div>
   ${shown?`<div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div>`:""}
   <div class="row"><button id="prev" ${idx?"":"disabled"}>Back</button>
   ${S.mode==="practice"&&!shown?`<button class="primary" id="check" ${S.pick[idx]===null?"disabled":""}>Check</button>`:""}
   ${idx<b.questions.length-1?`<button class="primary" id="next">Next</button>`:`<button class="primary" id="fin">Finish</button>`}</div>
   <div class="dots">${b.questions.map((_,k)=>`<button class="dot ${k===idx?"cur":""} ${S.pick[k]!==null?"done":""}" data-go="${k}">${k+1}</button>`).join("")}</div></div>`;
  app.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{S.pick[idx]=+o.dataset.pos;mcqRender()});
  $("#prev").onclick=()=>{S.idx--;mcqRender()};
  if($("#next")) $("#next").onclick=()=>{S.idx++;mcqRender()};
  if($("#check")) $("#check").onclick=()=>{S.checked[idx]=true;mcqRender()};
  if($("#fin")) $("#fin").onclick=()=>{const un=S.pick.filter(p=>p===null).length; if(S.mode==="exam"&&un){ask(un+" unanswered. Submit anyway?",mcqFinish);return} mcqFinish()};
  app.querySelectorAll("[data-go]").forEach(d=>d.onclick=()=>{S.idx=+d.dataset.go;mcqRender()});
}
function mcqFinish(){
  clearInterval(tick);timerEl.hidden=true;
  const {b,perm,pick}=S,L="ABCDE",topics={};let got=0,pen=0;
  b.questions.forEach((q,i)=>{const ok=pick[i]!==null&&perm[i][pick[i]]===q.answer; if(ok)got++; else if(pick[i]!==null&&b.negativeMarking)pen+=.5;
    const t=topics[q.topic]=topics[q.topic]||[0,0];t[1]++;if(ok)t[0]++});
  const net=got-pen, max=b.questions.length;
  const h=load();h.push({date:Date.now(),title:b.title,mode:S.mode,got:net,max,topics});save(h);
  const weak=Object.entries(topics).filter(([_,v])=>v[0]<v[1]);
  app.innerHTML=`<div class="card"><div class="meta">${esc(b.title)} · ${S.mode==="exam"?"time used "+fmt(Date.now()-S.start):"practice"}</div>
   <div class="score">${net} / ${max} <span style="font-size:18px;color:var(--mute)">(${Math.round(100*net/max)}%)</span></div>
   ${weak.length?`<p><b>Revise first:</b> ${weak.map(([k,v])=>`${esc(k)} (${v[0]}/${v[1]})`).join(" · ")}</p>`:"<p>Clean sweep.</p>"}
   <div class="row"><button class="primary" id="home">Back to topic</button><button id="retry">Retake</button></div></div>`+
   b.questions.map((q,i)=>{const p=pick[i],ok=p!==null&&perm[i][p]===q.answer,correctPos=perm[i].indexOf(q.answer);
     return `<div class="card"><div class="meta">Q${i+1} · ${esc(q.topic)} · <b style="color:var(--${ok?"ok":"bad"})">${ok?"correct":(p===null?"not answered":"wrong")}</b></div>
     <div class="stem" style="line-height:1.5">${esc(q.stem)}</div>
     <p>Your answer: <b>${p===null?"—":L[p]+". "+esc(q.options[perm[i][p]])}</b><br>Correct: <b>${L[correctPos]}. ${esc(q.options[q.answer])}</b></p>
     <div class="explain"><b>Connect it:</b> ${esc(q.explain)}</div><div class="src">Source: ${srcOf(q.src)}</div></div>`}).join("");
  $("#home").onclick=home;$("#retry").onclick=()=>mcqStart(banks.indexOf(b),S.mode);scrollTo(0,0);
}

// ---------- essays: write, then self-mark against a point-by-point model answer ----------
const EKEY="mbIII-resit-essay-drafts-v1";
const eload=()=>{try{return JSON.parse(localStorage.getItem(EKEY))||{}}catch(e){return{}}};
const esave=o=>{try{localStorage.setItem(EKEY,JSON.stringify(o))}catch(e){}};
function essayStart(bi,k){
  const b=banks[bi],e=b.essays[k],id=b.id+":"+k;
  S={essay:true,b,e,id,start:Date.now()};
  app.innerHTML=`<div class="card"><div class="meta">${esc(e.kind)} · ${esc(e.src)}</div>
   <div class="stem" style="line-height:1.5"><b>${esc(e.prompt)}</b></div>
   <p class="meta">Write it as you would in the exam hall: headings first, then points. Allow ${e.marks>=20?"30":"12"} minutes.</p>
   <textarea id="ans" rows="18" style="width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)" placeholder="Write your answer here (auto-saved in this browser)…">${esc(eload()[id]||"")}</textarea>
   <div class="row"><button class="primary" id="mark">Done — show model answer and mark</button><button id="home">Back</button></div></div>`;
  const t=$("#ans");t.oninput=()=>{const d=eload();d[id]=t.value;esave(d)};
  $("#home").onclick=home;$("#mark").onclick=()=>essayMark(t.value);
}
function essayMark(written){
  const {b,e,id}=S,total=e.sections.reduce((n,s)=>n+s.pts.length,0);
  app.innerHTML=`<div class="card"><div class="meta">${esc(e.kind)} · self-marking</div>
   <div class="stem" style="line-height:1.5"><b>${esc(e.prompt)}</b></div>
   <div class="score" id="sc"></div><p class="meta">Tick each point you actually covered. Be strict: a point counts only if you wrote it, not if you merely knew it.</p>
   <div class="explain"><b>Examiner's tip:</b> ${esc(e.tip)}</div></div>
   <div class="card"><details><summary>Your answer</summary><pre style="white-space:pre-wrap;font:inherit">${esc(written||"(nothing written)")}</pre></details></div>`+
   e.sections.map((s,si)=>`<div class="card"><h3 style="margin-top:0">${esc(s.h)}</h3>${s.pts.map((p,pi)=>`<label style="display:flex;gap:10px;margin:8px 0;cursor:pointer"><input type="checkbox" data-s="${si}" data-p="${pi}" style="margin-top:6px"><span>${esc(p.t)}${p.x?` <span class="meta">(beyond the slides)</span>`:""}</span></label>`).join("")}</div>`).join("")+
   `<div class="card"><div class="row"><button class="primary" id="save">Save score</button><button id="home">Back to topic</button></div></div>`;
  const upd=()=>{const boxes=[...app.querySelectorAll("input[type=checkbox]")],n=boxes.filter(c=>c.checked).length;
    $("#sc").innerHTML=`${(n/total*e.marks).toFixed(1)} / ${e.marks} <span style="font-size:18px;color:var(--mute)">(${n}/${total} points)</span>`;return n};
  app.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=upd);upd();
  $("#home").onclick=home;
  $("#save").onclick=()=>{const topics={};e.sections.forEach((s,si)=>{const t=topics[e.topic+" · "+s.h]=[0,s.pts.length];s.pts.forEach((_,pi)=>{if(app.querySelector(`[data-s="${si}"][data-p="${pi}"]`).checked)t[0]++})});
    const n=upd(),h=load();h.push({date:Date.now(),title:b.title+" — "+e.kind,mode:"essay",got:+(n/total*e.marks).toFixed(1),max:e.marks,topics});save(h);home()};
  scrollTo(0,0);
}

// ---------- flashcards ----------
const CKEY="mbIII-resit-cards-v1";
const cload=()=>{try{return JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){return{}}};
const csave=o=>{try{localStorage.setItem(CKEY,JSON.stringify(o))}catch(e){}};
const cid=(b,i)=>b.id+":"+i;
function cardsMastered(b){const m=cload();return b.cards.filter((_,i)=>(m[cid(b,i)]||{}).streak>=2).length+"/"+b.cards.length}
function startCards(bi,all){
  const b=banks[bi],m=cload();
  let order=b.cards.map((_,i)=>i).sort(()=>Math.random()-.5);
  if(!all) order.sort((x,y)=>((m[cid(b,x)]||{}).streak||0)-((m[cid(b,y)]||{}).streak||0));
  S={cards:true,b,bi,all,queue:order,pos:0,missed:[],got:0,revealed:false,typed:""};
  renderCard();
}
function renderCard(){
  const {b,queue,pos}=S;
  if(pos>=queue.length) return cardsDone();
  const c=b.cards[queue[pos]];
  app.innerHTML=`<div class="card"><div class="meta">Card ${pos+1} of ${queue.length} · ${esc(c.topic)}</div>
   <div class="stem" style="line-height:1.5">${esc(c.q)}</div>
   ${S.revealed?`<div class="explain" style="margin-top:14px"><b>Answer:</b> ${esc(c.a)}</div>
     ${S.typed?`<div class="src">You wrote: ${esc(S.typed)}</div>`:""}
     <div class="explain"><b>Connect it:</b> ${esc(c.connect)}</div>
     <div class="src">Source: ${esc(c.src)}${c.extra?" · <b>beyond the slides</b>":""}</div>
     <div class="row"><button class="primary" id="got">I had it all</button><button id="miss">I missed something</button></div>`
   :`<textarea id="typed" rows="3" placeholder="Say or type your answer from memory first…" style="width:100%;margin-top:14px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">${esc(S.typed)}</textarea>
     <div class="row"><button class="primary" id="rev">Reveal answer</button></div>`}
   <div class="bar" style="margin-top:16px"><i style="width:${Math.round(100*pos/queue.length)}%"></i></div></div>`;
  if(S.revealed){$("#got").onclick=()=>rate(true);$("#miss").onclick=()=>rate(false)}
  else{const t=$("#typed");t.focus();t.oninput=()=>S.typed=t.value;$("#rev").onclick=()=>{S.typed=t.value;S.revealed=true;renderCard()}}
}
function rate(ok){
  const {b,queue,pos}=S,i=queue[pos],m=cload(),k=cid(b,i),r=m[k]||{streak:0,seen:0};
  r.seen++; r.streak=ok?r.streak+1:0; m[k]=r; csave(m);
  if(ok)S.got++; else S.missed.push(i);
  S.pos++;S.revealed=false;S.typed="";renderCard();
}
function cardsDone(){
  const {b,queue,missed,got}=S, byTopic={};
  missed.forEach(i=>{const t=b.cards[i].topic;byTopic[t]=(byTopic[t]||0)+1});
  const pct=Math.round(100*got/queue.length);
  app.innerHTML=`<div class="card"><div class="meta">${esc(b.title)}</div>
   <div class="score">${got} / ${queue.length} <span style="font-size:18px;color:var(--mute)">(${pct}%)</span></div>
   <p>${missed.length?`<b>Missed:</b> ${Object.entries(byTopic).map(([k,v])=>`${esc(k)} (${v})`).join(" · ")}`:"Every card recalled. Come back tomorrow to confirm it stuck."}</p>
   <p class="meta">A card counts as mastered after two clean recalls in a row, so re-test it on a different day.</p>
   <div class="row">${missed.length?`<button class="primary" id="drill">Drill the ${missed.length} missed</button>`:""}<button id="home">Back to topic</button></div></div>`;
  $("#home").onclick=home;
  if($("#drill")) $("#drill").onclick=()=>{S={...S,queue:missed.slice().sort(()=>Math.random()-.5),pos:0,missed:[],got:0,revealed:false,typed:""};renderCard()};
}

home();
})();

</script>
<footer style="max-width:760px;margin:0 auto;padding:8px 16px 28px;color:var(--mute);font-size:13px">Revision practice for MBBS III O&amp;G, written from UCH lecture slides. Not examiner-verified; check answers against your lectures and textbooks. Scores and drafts are saved only in this browser.</footer></body></html>
